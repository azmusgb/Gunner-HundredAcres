<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>Pooh's Enhanced Honey Hunt - Complete Edition</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
      <meta name="theme-color" content="#d4a574" />
      <meta name="description" content="Help Pooh catch honey pots in the Hundred Acre Wood! Now with achievements, character selection, weather effects, and more!" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
      <link rel="stylesheet" href="styles-game.css">
   </head>
   <body>
      <!-- Background -->
      <div class="background-layer" aria-hidden="true">
         <div class="cloud cloud-1"></div>
         <div class="cloud cloud-2"></div>
         <div class="cloud cloud-3"></div>
      </div>
      <!-- Honey Cursor -->
      <div class="honey-cursor" id="honey-cursor">
         <div class="spoon"></div>
      </div>
      <main id="game-root">
         <!-- Sound -->
         <div class="sound-controls">
            <button class="sound-btn" id="sound-toggle-btn" aria-label="Toggle sound">
            <i class="fas fa-volume-up"></i>
            </button>
         </div>
         <!-- Share -->
         <button class="share-btn" id="share-btn" aria-label="Share score">
         <i class="fas fa-share-alt"></i>
         </button>
         <!-- Game Controls -->
         <div class="game-controls">
            <button class="control-btn pause" id="pause-btn"><i class="fas fa-pause"></i></button>
            <button class="control-btn help" id="help-btn"><i class="fas fa-question"></i></button>
         </div>
         <!-- Weather Toggle -->
         <button class="weather-toggle" id="weather-toggle">🌦️</button>
         <!-- Weather Drawer -->
         <aside class="weather-drawer" id="weather-drawer">
            <div class="weather-drawer-header">
               <span class="weather-title">Weather</span>
               <button class="weather-close" id="weather-close">✕</button>
            </div>
            <div class="weather-drawer-buttons">
               <button class="weather-btn" data-weather="clear">☀️</button>
               <button class="weather-btn" data-weather="rain">🌧️</button>
               <button class="weather-btn" data-weather="snow">❄️</button>
               <button class="weather-btn" data-weather="leaves">🍂</button>
               <button class="weather-btn" data-weather="blossoms">🌸</button>
            </div>
         </aside>
         <!-- HUD -->
         <header class="hud">
            <div class="hud-wrap">
               <div class="hud-item hud-score">
                  <div class="hud-icon">🍯</div>
                  <div class="hud-meta">
                     <div class="hud-label">Score</div>
                     <div class="hud-value" id="score">0</div>
                  </div>
               </div>
               <div class="hud-sep"></div>
               <div class="hud-item">
                  <div class="hud-icon">🔥</div>
                  <div class="hud-meta">
                     <div class="hud-label">Streak</div>
                     <div class="hud-value" id="streak">0</div>
                  </div>
               </div>
               <div class="hud-sep"></div>
               <div class="hud-item">
                  <div class="hud-icon">❤️</div>
                  <div class="hud-meta">
                     <div class="hud-label">Lives</div>
                     <div class="hud-value" id="lives">3</div>
                  </div>
               </div>
               <div class="hud-actions">
                  <button class="hud-ach" id="achievements-btn">
                  <span class="hud-ach-icon">🏆</span>
                  <span class="hud-ach-text">
                  <span class="hud-ach-label">Achievements</span>
                  <span class="hud-ach-value" id="achievements-count">0/10</span>
                  </span>
                  <span class="hud-ach-caret">›</span>
                  </button>
               </div>
            </div>
         </header>
         <!-- Game Canvas -->
         <div class="game-container">
            <canvas id="honey-game" width="420" height="700"></canvas>
         </div>
         <!-- ================= START ================= -->
         <div class="overlay" id="start-overlay">
            <div class="pooh-intro"></div>
            <p class="story-line">Pooh is waiting for honey…</p>
            <button class="btn" id="start-btn">
            🍯 Start Collecting Honey
            </button>
            <div class="start-links">
               <button class="link-btn" id="select-character-btn">Choose Character</button>
               <button class="link-btn" id="view-achievements-btn">Achievements</button>
            </div>
         </div>
         <!-- ================= PAUSE ================= -->
         <div class="overlay hidden" id="pause-overlay">
            <h2>⏸️ Taking a Rest</h2>
            <p class="subtitle">Paused</p>
            <button class="btn" id="resume-btn">Resume</button>
            <button class="btn btn-secondary" id="quit-btn">Return to Menu</button>
         </div>
         <!-- ================= HELP ================= -->
         <div class="overlay hidden" id="help-overlay">
            <h2>How to Play</h2>
            <p class="subtitle">
               Drag Pooh to catch honey.<br>
               Avoid bees.
            </p>
            <button class="btn btn-secondary" id="close-help-btn">Back</button>
         </div>
         <!-- ================= GAME OVER ================= -->
         <div class="overlay hidden" id="gameover-overlay">
            <h2>Oh Bother!</h2>
            <div class="final-score" id="final-score">0</div>
            <button class="btn" id="restart-btn">Play Again 🍯</button>
         </div>
         <!-- ================= CHARACTER SELECT ================= -->
         <div class="character-select-overlay hidden" id="character-select-overlay">
            <div class="char-shell">
               <div class="char-top">
                  <h2 class="char-title">Choose Your Character</h2>
                  <button class="char-x" id="back-to-menu-btn">✕</button>
               </div>
               <div class="char-grid">
                  <button class="character-card" data-character="pooh">🐻 Pooh</button>
                  <button class="character-card" data-character="piglet">🐷 Piglet</button>
                  <button class="character-card" data-character="tigger">🐯 Tigger</button>
                  <button class="character-card" data-character="rabbit">🐰 Rabbit</button>
               </div>
               <div class="char-bottom">
                  <button class="btn" id="start-with-character-btn">Start 🍯</button>
               </div>
            </div>
         </div>
         <!-- ================= ACHIEVEMENTS ================= -->
         <div class="achievements-overlay hidden" id="achievements-overlay">
            <div class="achievements-shell">
               <div class="achievements-top">
                  <h2 class="ach-title">Achievements</h2>
                  <button class="ach-x" id="close-achievements-btn">✕</button>
               </div>
               <div class="achievements-listWrap">
                  <div id="achievements-list"></div>
               </div>
               <div class="achievements-bottom">
                  <button class="btn btn-secondary" id="close-achievements-btn-2">Back</button>
               </div>
            </div>
         </div>
      </main>
<script>
(() => {
  "use strict";
  if (window.__POOH_HONEY_HUNT_REPLACE__) return;
  window.__POOH_HONEY_HUNT_REPLACE__ = true;

  /* ======================= DOM + UTILS ======================= */
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const now = () => (typeof performance !== "undefined" ? performance.now() : Date.now());

  // Rounded-rect path helper (cross-browser; avoids ctx.roundRect dependency)
  function rrPath(ctx, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // Small seeded RNG for stable “paper grain” without flicker
  function makeRng(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return (s & 0xfffffff) / 0xfffffff;
    };
  }

  // Smooth noise-ish helper (cheap “natural” drift)
  const n1 = (t, seed) => Math.sin((t * 0.0012) + seed) * 0.5 + Math.sin((t * 0.00053) + seed * 1.7) * 0.35 + Math.sin((t * 0.0019) + seed * 0.27) * 0.15;

  /* ======================= SAFE STORAGE ======================= */
  const Store = (() => {
    const mem = new Map();
    const hasLS = (() => {
      try {
        const t = "__t__";
        localStorage.setItem(t, "1");
        localStorage.removeItem(t);
        return true;
      } catch {
        return false;
      }
    })();

    return {
      get(k, fallback = null) {
        if (hasLS) {
          try {
            const v = localStorage.getItem(k);
            return v === null ? fallback : v;
          } catch {}
        }
        return mem.has(k) ? mem.get(k) : fallback;
      },
      set(k, v) {
        if (hasLS) {
          try {
            localStorage.setItem(k, String(v));
            return;
          } catch {}
        }
        mem.set(k, String(v));
      },
    };
  })();

  /* ======================= APP STATE ======================= */
  const AppState = {
    running: false,
    paused: false,

    score: 0,
    best: Number(Store.get("bestScore", "0") || 0),
    streak: 0,
    lives: 3,

    timeMs: 0,
    timeScale: 1,

    soundOn: Store.get("sound", "on") !== "off",
    hapticsOn: Store.get("haptics", "on") !== "off",
    character: Store.get("character", "pooh") || "pooh",

    combo: { mult: 1, timer: 0, tier: 0 },

    achievements: (() => {
      try {
        return JSON.parse(Store.get("achievements", "{}") || "{}");
      } catch {
        return {};
      }
    })(),

    stats: {
      maxStreak: 0,
      honeyCaught: 0,
      beesHit: 0,
      powerCollected: 0,
    },
  };

  const persistAchievements = () => {
    try {
      Store.set("achievements", JSON.stringify(AppState.achievements || {}));
    } catch {}
  };

  const vibrate = (pattern = 20) => {
    try {
      if (AppState.hapticsOn && navigator.vibrate) navigator.vibrate(pattern);
    } catch {}
  };

  /* ======================= AUDIO (tiny synth sfx) ======================= */
  const Audio = (() => {
    let ctx = null, master = null;

    function init() {
      if (!AppState.soundOn) return;
      if (ctx) return;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0.22;
        master.connect(ctx.destination);
      } catch {
        ctx = null;
        master = null;
      }
    }

    function beep(freq = 440, dur = 0.06, gain = 0.07, type = "sine") {
      if (!AppState.soundOn || !ctx || !master) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(master);
      o.start(t);
      o.stop(t + dur);
    }

    const sfx = {
      collect() { beep(740, 0.05, 0.085, "triangle"); },
      combo()  { beep(920, 0.08, 0.08, "sawtooth"); },
      hit()    { beep(160, 0.10, 0.10, "square"); },
      power()  { beep(520, 0.09, 0.08, "sine"); },
      ui()     { beep(420, 0.04, 0.05, "sine"); },
    };

    function toggle() {
      AppState.soundOn = !AppState.soundOn;
      Store.set("sound", AppState.soundOn ? "on" : "off");
      if (AppState.soundOn) init();
    }

    return { init, toggle, ...sfx };
  })();

  /* ======================= OVERLAYS ======================= */
  const Overlays = (() => {
    const map = {
      start: $("start-overlay"),
      pause: $("pause-overlay"),
      help: $("help-overlay"),
      character: $("character-select-overlay"),
      achievements: $("achievements-overlay"),
      gameover: $("gameover-overlay"),
    };

    const anyOpen = () => Object.values(map).some(el => el && !el.classList.contains("hidden"));
    const sync = () => document.body.classList.toggle("overlay-open", anyOpen());

    function open(name) {
      const el = map[name];
      if (!el) return;
      el.classList.remove("hidden");
      sync();
      if (name === "pause") AppState.paused = true;
    }
    function close(name) {
      const el = map[name];
      if (!el) return;
      el.classList.add("hidden");
      sync();
      if (name === "pause") AppState.paused = false;
    }
    function closeAll() {
      for (const el of Object.values(map)) el?.classList.add("hidden");
      AppState.paused = false;
      sync();
    }

    return { open, close, closeAll };
  })();

  /* ======================= HUD MICRO-INTERACTIONS ======================= */
  const HUDFX = (() => {
    const pulse = (id) => {
      const el = $(id);
      if (!el) return;
      el.classList.remove("hud-pop");
      void el.offsetWidth;
      el.classList.add("hud-pop");
      setTimeout(() => el.classList.remove("hud-pop"), 250);
    };

    const shake = (id) => {
      const el = $(id);
      if (!el) return;
      el.classList.remove("hud-shake");
      void el.offsetWidth;
      el.classList.add("hud-shake");
      setTimeout(() => el.classList.remove("hud-shake"), 380);
    };

    return { pulse, shake };
  })();

  /* ======================= UI BINDINGS ======================= */
  const UI = (() => {
    function setText(id, v) {
      const el = $(id);
      if (el) el.textContent = String(v);
    }

    function setSoundIcon() {
      const icon = $("sound-toggle-btn")?.querySelector("i");
      if (!icon) return;
      icon.className = AppState.soundOn ? "fas fa-volume-up" : "fas fa-volume-mute";
    }

    function updateHUD(prev = null) {
      setText("score", Math.floor(AppState.score));
      setText("streak", Math.floor(AppState.streak));
      setText("lives", Math.floor(AppState.lives));

      const defsCount = 10;
      const got = Object.values(AppState.achievements || {}).filter(Boolean).length;
      setText("achievements-count", `${got}/${defsCount}`);

      if (prev) {
        if (AppState.score !== prev.score) HUDFX.pulse("score");
        if (AppState.streak !== prev.streak && AppState.streak > prev.streak) HUDFX.pulse("streak");
        if (AppState.lives < prev.lives) HUDFX.shake("lives");
      }
    }

    const ACH_DEFS = [
      { key:"firstHoney", title:"First Honey", desc:"Catch any honey." },
      { key:"streak10",  title:"Sticky Streak", desc:"Reach a 10 streak." },
      { key:"survive60", title:"Steady Paws", desc:"Survive 60 seconds." },
      { key:"score1k",   title:"Honey Hoarder", desc:"Reach 1000 score." },
      { key:"beeDodger", title:"Bee Dodger", desc:"30s with full lives." },
      { key:"combo2x",   title:"Combo Craze", desc:"Hit 2.0× combo." },
      { key:"powerFan",  title:"Powered Up", desc:"Collect 3 power-ups." },
      { key:"noMiss20",  title:"Perfect Flow", desc:"20 streak without a miss." },
      { key:"survive120",title:"Long Walk", desc:"Survive 120 seconds." },
      { key:"score3k",   title:"Legend", desc:"Reach 3000 score." },
    ];

    function renderAchievements() {
      const list = $("achievements-list");
      if (!list) return;

      const unlocked = (k) => !!AppState.achievements?.[k];

      list.innerHTML = ACH_DEFS.map(d => {
        const ok = unlocked(d.key);
        return `
          <div class="achievement-item ${ok ? "unlocked" : ""}">
            <div class="achievement-icon">${ok ? "🏆" : "🔒"}</div>
            <div class="achievement-details">
              <div class="achievement-name">${d.title}</div>
              <div class="achievement-desc">${d.desc}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openAchievements() {
      renderAchievements();
      Overlays.open("achievements");
    }

    function bind() {
      if (bind._did) return;
      bind._did = true;

      const on = (id, ev, fn, opts) => $(id)?.addEventListener(ev, fn, opts);

      on("start-btn", "click", () => { Audio.init(); Overlays.closeAll(); Game.start(); });
      on("pause-btn", "click", () => { if (AppState.running) Overlays.open("pause"); });
      on("resume-btn", "click", () => Overlays.close("pause"));
      on("restart-btn", "click", () => { Game.reset(); Overlays.closeAll(); Game.start(); });

      on("quit-btn", "click", () => { Game.reset(); Overlays.closeAll(); Overlays.open("start"); });

      on("help-btn", "click", () => Overlays.open("help"));
      on("close-help-btn", "click", () => Overlays.close("help"));

      on("sound-toggle-btn", "click", () => { Audio.toggle(); setSoundIcon(); Audio.ui(); });

      on("achievements-btn", "click", () => { Audio.ui(); openAchievements(); });
      on("view-achievements-btn", "click", () => { Audio.ui(); openAchievements(); });

      on("close-achievements-btn", "click", () => Overlays.close("achievements"));
      on("close-achievements-btn-2", "click", () => Overlays.close("achievements"));

      on("select-character-btn", "click", () => { Audio.ui(); Overlays.open("character"); });
      on("back-to-menu-btn", "click", () => Overlays.close("character"));
      on("start-with-character-btn", "click", () => { Audio.init(); Overlays.closeAll(); Game.start(); });

      // Character cards
      const cards = Array.from(document.querySelectorAll(".character-card[data-character]"));
      const applyCharActive = () => {
        cards.forEach(btn => btn.classList.toggle("active", btn.getAttribute("data-character") === AppState.character));
      };
      cards.forEach(btn => {
        btn.addEventListener("click", () => {
          const c = btn.getAttribute("data-character");
          if (!c) return;
          AppState.character = c;
          Store.set("character", c);
          applyCharActive();
          Audio.ui();
        });
      });
      applyCharActive();

      // Weather drawer wiring
      const drawer = $("weather-drawer");
      const setDrawer = (open) => drawer?.classList.toggle("open", !!open);

      const setWeather = (w) => {
        Store.set("weather", w);
        document.querySelectorAll(".weather-btn[data-weather]").forEach(b => {
          b.classList.toggle("active", b.getAttribute("data-weather") === w);
        });
        WeatherFX.setMode(w);
      };

      on("weather-toggle", "click", () => setDrawer(true));
      on("weather-close", "click", () => setDrawer(false));

      document.querySelectorAll(".weather-btn[data-weather]").forEach(btn => {
        btn.addEventListener("click", () => {
          const w = btn.getAttribute("data-weather");
          if (w) setWeather(w);
        });
      });

      setWeather(Store.get("weather", "clear"));

      // Share
      on("share-btn", "click", async () => {
        const t = `I scored ${Math.floor(AppState.score)} in Pooh’s Honey Hunt 🍯`;
        try {
          if (navigator.share) await navigator.share({ text: t });
          else if (navigator.clipboard) await navigator.clipboard.writeText(t);
        } catch {}
      });

      // Keyboard shortcuts
      window.addEventListener("keydown", (e) => {
        if (e.repeat) return;

        if (e.code === "Space") {
          e.preventDefault();
          if (!AppState.running) return;
          if (!document.body.classList.contains("overlay-open")) Overlays.open("pause");
          else Overlays.close("pause");
        }

        if (e.code === "Escape") {
          Overlays.close("help");
          Overlays.close("achievements");
          Overlays.close("character");
          Overlays.close("pause");
        }
      });

      setSoundIcon();
      updateHUD();
    }

    return { bind, updateHUD, openAchievements, renderAchievements };
  })();

  /* ======================= WEATHER EFFECTS (DOM overlay) ======================= */
  const WeatherFX = (() => {
    let host = $("weather-effects");
    if (!host) {
      host = document.createElement("div");
      host.id = "weather-effects";
      host.setAttribute("aria-hidden", "true");
      document.body.appendChild(host);
    }

    let mode = Store.get("weather", "clear") || "clear";
    let raf = 0;
    let lastT = 0;
    const bits = [];

    function reset() {
      bits.length = 0;
      host.innerHTML = "";
    }

    function spawn() {
      if (mode === "clear") return;

      const el = document.createElement("div");
      el.style.position = "absolute";
      el.style.left = (Math.random() * 100) + "vw";
      el.style.top = "-8vh";
      el.style.pointerEvents = "none";
      el.style.willChange = "transform, opacity";
      el.style.opacity = "0.95";

      let emoji = "•";
      if (mode === "rain") emoji = "💧";
      if (mode === "snow") emoji = "❄️";
      if (mode === "leaves") emoji = "🍂";
      if (mode === "blossoms") emoji = "🌸";

      el.textContent = emoji;
      el.style.fontSize = (18 + Math.random() * 18) + "px";

      host.appendChild(el);

      bits.push({
        el,
        x: parseFloat(el.style.left),
        y: -10,
        vy: (mode === "rain" ? 90 : 40) + Math.random() * 60,
        vx: (Math.random() * 20 - 10),
        rot: Math.random() * 360,
        vr: (Math.random() * 80 - 40),
      });

      if (bits.length > 60) {
        const a = bits.shift();
        a?.el?.remove();
      }
    }

    function tick(t) {
      const dt = Math.min(50, t - lastT);
      lastT = t;

      if (mode !== "clear") {
        const chance = mode === "rain" ? 0.55 : 0.22;
        if (Math.random() < chance) spawn();
      }

      for (let i = bits.length - 1; i >= 0; i--) {
        const b = bits[i];
        b.y += (b.vy * dt) / 1000;
        b.x += (b.vx * dt) / 1000;
        b.rot += (b.vr * dt) / 1000;

        b.el.style.transform = `translate(${b.x}vw, ${b.y}vh) rotate(${b.rot}deg)`;

        if (b.y > 115) {
          b.el.remove();
          bits.splice(i, 1);
        }
      }

      raf = requestAnimationFrame(tick);
    }

    function setMode(m) {
      mode = m || "clear";
      reset();
      if (!raf) {
        lastT = now();
        raf = requestAnimationFrame(tick);
      }
    }

    setMode(mode);

    return { setMode };
  })();

  /* ======================= CANVAS ======================= */
  const canvas = $("honey-game");
  const ctx = canvas?.getContext("2d", { alpha: true, desynchronized: true });

  if (!canvas || !ctx) {
    console.error("Canvas not found or 2D context failed.");
    return;
  }

  const BASE_W = 420, BASE_H = 700;
  canvas.width = BASE_W;
  canvas.height = BASE_H;

  /* ======================= LAYOUT (make play area taller) ======================= */
  const Layout = (() => {
    const root = $("game-root");
    const hud = document.querySelector(".hud");

  const Input = (() => {
    let down = false;
    let tx = BASE_W / 2;
    let x = BASE_W / 2;
    let vx = 0;

    const setTarget = (clientX) => {
      const rect = canvas.getBoundingClientRect();
      const nx = (clientX - rect.left) / rect.width;
      tx = clamp(nx * BASE_W, 52, BASE_W - 52);
    };

    const downAt = (clientX) => {
      down = true;
      setTarget(clientX);
      Audio.init();
    };

    canvas.addEventListener("mousedown", (e) => downAt(e.clientX));
    window.addEventListener("mousemove", (e) => { if (down) setTarget(e.clientX); });
    window.addEventListener("mouseup", () => (down = false));

    canvas.addEventListener("touchstart", (e) => {
      const t = e.touches?.[0];
      if (!t) return;
      if (e.cancelable) e.preventDefault();
      downAt(t.clientX);
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      if (!down) return;
      const t = e.touches?.[0];
      if (!t) return;
      if (e.cancelable) e.preventDefault();
      setTarget(t.clientX);
    }, { passive: false });

    canvas.addEventListener("touchend", () => (down = false), { passive: true });
    canvas.addEventListener("touchcancel", () => (down = false), { passive: true });

    function update(dt) {
      const t = Math.min(40, dt) / 1000;
      const k = 26;  // stiffness
      const d = 12;  // damping
      const ax = (tx - x) * k - vx * d;
      vx += ax * t;
      x += vx * t;
      x = clamp(x, 52, BASE_W - 52);
      return x;
    }

    return { update };
  })();

  const Particles = (() => {
    const p = [];
    const MAX = 220;

    function emit(x, y, color, count = 10, spread = 1) {
      for (let i = 0; i < count; i++) {
        if (p.length >= MAX) p.shift();
        const a = Math.random() * Math.PI * 2;
        const sp = (1 + Math.random() * 2.6) * spread;
        p.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - (1.5 + Math.random() * 2),
          life: 1,
          r: 2 + Math.random() * 3,
          color,
        });
      }
    }

    function update(dt) {
      const t = Math.min(32, dt) / 1000;
      for (let i = p.length - 1; i >= 0; i--) {
        const a = p[i];
        a.x += a.vx * (60 * t);
        a.y += a.vy * (60 * t);
        a.vy += 0.12 * (60 * t);
        a.life -= 1.35 * t;
        if (a.life <= 0) p.splice(i, 1);
      }
    }

    function render(ctx) {
      if (!p.length) return;
      ctx.save();
      for (const a of p) {
        ctx.globalAlpha = Math.max(0, a.life);
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    return { emit, update, render };
  })();

        ctx.save();
        ctx.globalAlpha = 0.32 + 0.12 * Math.sin(b.flap * 1.6 + sx);
        const wg = ctx.createRadialGradient(sx * r * 0.25, -r * 0.7, r * 0.2, sx * r * 0.45, -r * 0.55, r * 1.05);
        wg.addColorStop(0, "rgba(255,255,255,0.95)");
        wg.addColorStop(0.6, "rgba(255,255,255,0.35)");
        wg.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = wg;
        ctx.beginPath();
        ctx.ellipse(sx * r * 0.75, -r * 0.6, r * 0.78, r * 0.46, sx * 0.25 + Math.sin(b.flap) * 0.35, 0, Math.PI * 2);
        ctx.fill();
        inkStroke(2.2, 0.18);
        ctx.stroke();
        ctx.restore();
      };
      wing(-1); wing(1);

      // body gradient
      const bg = ctx.createRadialGradient(-r * 0.35, -r * 0.25, r * 0.25, 0, 0, r * 1.25);
      bg.addColorStop(0, "#fff3b8");
      bg.addColorStop(0.35, "#ffd86a");
      bg.addColorStop(0.75, "#f2b93a");
      bg.addColorStop(1, "#c27a12");

      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.05, r * 0.82, 0, 0, Math.PI * 2);
      ctx.fill();

      inkStroke(3.0, 0.48);
      ctx.stroke();

      const stripe = (y, w, h, a = 0.62) => {
        ctx.save();
        ctx.globalAlpha = a;
        const sg = ctx.createLinearGradient(0, y - h, 0, y + h);
        sg.addColorStop(0, "rgba(40,28,18,0.15)");
        sg.addColorStop(0.45, "rgba(35,25,17,0.85)");
        sg.addColorStop(1, "rgba(40,28,18,0.20)");
        ctx.fillStyle = sg;
        rrPath(ctx, -r * w, y - h, r * w * 2, h * 2, h * 0.9);
        ctx.fill();
        ctx.restore();
      };
      stripe(-r * 0.22, 0.92, r * 0.17);
      stripe( r * 0.10, 0.98, r * 0.18);

      // face + stinger
      ctx.save();
      ctx.fillStyle = "rgba(25,18,12,0.75)";
      ctx.beginPath(); ctx.arc(-r * 0.22, -r * 0.10, r * 0.08, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( r * 0.22, -r * 0.10, r * 0.08, 0, Math.PI * 2); ctx.fill();

      ctx.globalAlpha = 0.18;
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.28, r * 0.28, r * 0.14, -0.3, 0, Math.PI * 2); ctx.fill();

      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "rgba(35,25,17,0.85)";
      ctx.beginPath();
      ctx.moveTo(0, r * 0.78);
      ctx.lineTo(-r * 0.12, r * 1.02);
      ctx.lineTo( r * 0.12, r * 1.02);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // shadow
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(0, r * 0.98, r * 0.95, r * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      paperNoise(b.seed, 0, 0, r * 1.05, 0.045);

      ctx.restore();
    }

    function drawPower(p) {
      if (p.trail?.length) {
        for (let i = 0; i < p.trail.length; i++) {
          const pos = p.trail[i];
          const alpha = 0.5 * (1 - i / p.trail.length);
          ctx.fillStyle =
            p.type === "shield" ? `rgba(77,150,255,${alpha})` :
            `rgba(157,78,221,${alpha})`;
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, p.r * (0.75 - i * 0.05), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = p.type === "shield" ? "#4a9eff" : "#9d4edd";
      inkStroke(2.8, 0.35);
      ctx.beginPath();
      ctx.arc(0, 0, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.font = '900 14px "Fredoka One", system-ui';
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(p.type === "shield" ? "S" : "⏳", 0, 1);

      ctx.restore();
    }

    function drawPlayer() {
      const r = player.r;

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(player.scale, player.scale);

      // shadow
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.ellipse(0, r * 0.72, r * 0.95, r * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      // body
      ctx.fillStyle = "#f6c44f";
      inkStroke(3.0, 0.40);
      ctx.beginPath();
      ctx.ellipse(0, 10, r * 0.82, r * 0.66, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // shirt
      ctx.fillStyle = "#d64b3c";
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.88, r * 0.44, 0, 0, Math.PI * 2);
      ctx.fill();

      // head
      ctx.fillStyle = "#f7cc63";
      ctx.beginPath();
      ctx.arc(0, -r * 0.62, r * 0.52, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // ears
      ctx.beginPath();
      ctx.arc(-r * 0.32, -r * 1.02, r * 0.20, 0, Math.PI * 2);
      ctx.arc( r * 0.32, -r * 1.02, r * 0.20, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // face
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.beginPath(); ctx.arc(-r * 0.15, -r * 0.70, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc( r * 0.15, -r * 0.70, r * 0.06, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -r * 0.57, r * 0.07, 0, Math.PI * 2); ctx.fill();

      // character accents
      if (AppState.character === "piglet") {
        ctx.fillStyle = "rgba(255,183,197,0.85)";
        ctx.beginPath();
        ctx.arc(-r * 0.32, -r * 1.02, r * 0.18, 0, Math.PI * 2);
        ctx.arc( r * 0.32, -r * 1.02, r * 0.18, 0, Math.PI * 2);
        ctx.fill();
      } else if (AppState.character === "tigger") {
        ctx.fillStyle = "rgba(0,0,0,0.18)";
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.sin(i) * r * 0.18, 12 + i * r * 0.12, r * 0.14, r * 0.06, Math.PI / 4, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (AppState.character === "rabbit") {
        ctx.fillStyle = "rgba(100,190,120,0.22)";
        ctx.beginPath();
        ctx.ellipse(0, 12, r * 0.65, r * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // shield ring
      if (buffs.shield > 0) {
        const pulse = 0.65 + 0.35 * Math.sin(AppState.timeMs / 180);
        ctx.strokeStyle = `rgba(77,150,255,${pulse})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.06, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderCombo() {
      if (AppState.combo.timer <= 0 || AppState.streak < 4) return;
      const a = 0.25 + (AppState.combo.timer / 2000) * 0.75;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '900 34px "Fredoka One", system-ui';
      ctx.textAlign = "center";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "rgba(93,78,55,0.35)";
      ctx.fillStyle = "rgba(255,165,0,0.95)";
      const msg = `COMBO x${AppState.combo.mult.toFixed(1)}`;
      ctx.strokeText(msg, BASE_W / 2, 150);
      ctx.fillText(msg, BASE_W / 2, 150);
      ctx.restore();
    }

    function update(dt) {
      if (!running || AppState.paused) return;

      // timescale easing
      if (microSlow > 0) {
        microSlow = Math.max(0, microSlow - dt);
        AppState.timeScale += (1 - AppState.timeScale) * 0.08;
      } else {
        AppState.timeScale += (1 - AppState.timeScale) * 0.12;
      }
      AppState.timeScale = clamp(AppState.timeScale, 0.70, 1);

      dt = Math.min(dt, 50) * AppState.timeScale;
      AppState.timeMs += dt;

      // combo decay
      if (AppState.combo.timer > 0) {
        AppState.combo.timer = Math.max(0, AppState.combo.timer - dt);
        if (AppState.combo.timer === 0) AppState.combo = { mult: 1, timer: 0, tier: 0 };
      }

      // buffs decay
      if (buffs.shield > 0) buffs.shield = Math.max(0, buffs.shield - dt);
      if (buffs.slow > 0) buffs.slow = Math.max(0, buffs.slow - dt);

      updateDifficulty();

      // player movement + spring scale
      player.x = Input.update(dt);
      player.sv += (1 - player.scale) * 0.18;
      player.sv *= 0.72;
      player.scale += player.sv;
      player.scale = clamp(player.scale, 0.88, 1.25);

      const slowFactor = buffs.slow > 0 ? 0.58 : 1;

      // spawn (with grace period)
      honeyTimer += dt;
      beeTimer += dt;
      powerTimer += dt;

      if (honeyTimer >= baseHoneyRate) { honeyTimer = 0; spawnHoney(); }

      if (AppState.timeMs > GRACE_MS) {
        if (beeTimer >= baseBeeRate) { beeTimer = 0; spawnBee(); }
      } else {
        if (AppState.timeMs > GRACE_MS * 0.85 && bees.length === 0) {
          beeTimer = 0;
          spawnBee();
        }
      }

      if (powerTimer >= powerRate) { powerTimer = 0; spawnPower(); }

      // honeys
      for (let i = honeys.length - 1; i >= 0; i--) {
        const h = honeys[i];
        h.y += (h.vy * slowFactor) * (dt / 1000);

        if (h.y > BASE_H + 60) {
          honeys.splice(i, 1);
          AppState.streak = 0;
          AppState.combo = { mult: 1, timer: 0, tier: 0 };
          continue;
        }

        if (hitCircle(player.x, player.y, player.r, h.x, h.y, h.r)) {
          awardHoney(h);
          honeys.splice(i, 1);
        }
      }

      // bees (natural motion)
      for (let i = bees.length - 1; i >= 0; i--) {
        const b = bees[i];
        b.flap += dt / 120;

        b.y += (b.vy * slowFactor) * (dt / 1000);

        const drift = n1(AppState.timeMs * b.wFreq, b.wSeed) * b.wAmp;
        const wanderVx = (drift * 0.9);

        b.steerTimer -= dt;
        if (b.steerTimer <= 0) {
          b.steerTimer = 260 + Math.random() * 520;
          b.interest = Math.random();
          b.steerX = clamp(player.x + (Math.random() * 140 - 70), 45, BASE_W - 45);
        }

        let targetVx = wanderVx;

        if (b.type === "curious" && b.interest > 0.35) {
          const dx = (b.steerX - b.x);
          targetVx += clamp(dx * 1.2, -140, 140);
        }

        if (b.type === "pounce") {
          const dx = (player.x - b.x);
          targetVx += clamp(dx * 1.8, -190, 190);
        }

        targetVx *= (1 - directorEase * 0.28);

        b.vx += (targetVx - b.vx) * 0.06;

        b.x += (b.vx * slowFactor) * (dt / 1000);

        if (b.x < 34) { b.x = 34; b.vx *= -0.75; }
        if (b.x > BASE_W - 34) { b.x = BASE_W - 34; b.vx *= -0.75; }

        if (b.y > BASE_H + 80) { bees.splice(i, 1); continue; }

        const beePlayerR = player.r * 0.78;
        if (hitCircle(player.x, player.y, beePlayerR, b.x, b.y, b.r)) {
          takeHit(b);
          bees.splice(i, 1);
        }
      }

      // powers
      for (let i = powers.length - 1; i >= 0; i--) {
        const p = powers[i];
        p.y += p.vy * (dt / 1000);
        p.trail.unshift({ x: p.x, y: p.y });
        if (p.trail.length > 8) p.trail.pop();

        if (p.y > BASE_H + 80) { powers.splice(i, 1); continue; }

        if (hitCircle(player.x, player.y, player.r, p.x, p.y, p.r)) {
          takePower(p);
          powers.splice(i, 1);
        }
      }

      Particles.update(dt);
      Achievements.check();
    }

    function render() {
      ctx.clearRect(0, 0, BASE_W, BASE_H);

      const mf = 1 - AppState.timeScale;
      ctx.save();

      if (shake > 0.01) {
        const dx = (Math.random() - 0.5) * shake;
        const dy = (Math.random() - 0.5) * shake;
        ctx.translate(dx, dy);
        shake *= 0.88;
      }

      if (mf > 0.01) {
        ctx.globalAlpha = clamp(mf * 1.8, 0, 0.22);
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, BASE_W, BASE_H);
        ctx.globalAlpha = 1;
      }

      for (const h of honeys) drawHoney(h);
      for (const p of powers) drawPower(p);
      for (const b of bees) drawBee(b);

      drawPlayer();

      Particles.render(ctx);
      renderCombo();

      ctx.save();
      ctx.globalAlpha = 0.03;
      ctx.fillStyle = "#000";
      for (let i = 0; i < 60; i++) {
        ctx.fillRect(Math.random() * BASE_W, Math.random() * BASE_H, 1, 1);
      }
      ctx.restore();

      if (AppState.timeMs < GRACE_MS) {
        const a = clamp(1 - (AppState.timeMs / GRACE_MS), 0, 1);
        ctx.save();
        ctx.globalAlpha = 0.18 * a;
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, BASE_W, 62);
        ctx.globalAlpha = 0.85 * a;
        ctx.font = '900 18px "Fredoka One", system-ui';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255,232,170,0.95)";
        ctx.fillText("Warm-up… (bees chill for a moment)", BASE_W / 2, 30);
        ctx.restore();
      }

      ctx.restore();
    }

    function tick(ts) {
      const dt = ts - last;
      last = ts;

      update(dt);
      render();
      requestAnimationFrame(tick);
    }

    function bootLoop() {
      last = now();
      requestAnimationFrame(tick);
    }

    return { reset, start, bootLoop };
  })();

  /* ======================= BOOT ======================= */
  function boot() {
    UI.bind();
    Layout.bind();
    Game.reset();
    Game.bootLoop();
    Overlays.open("start");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
})();
</script>
