<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pooh's Enhanced Honey Hunt - Complete Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#d4a574" />
  <meta name="description" content="Help Pooh catch honey pots in the Hundred Acre Wood! Now with achievements, character selection, weather effects, and more!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    /* Brand palette */
    --pooh-bear:#d4a574; --pooh-light:#e8c9a3; --pooh-red:#e63946;
    --honey-pot:#8b4513; --honey-gold:#ffa500; --honey-shine:#ffd700;
    --wood-brown:#5d4e37; --wood-light:#8b7355;
    --grass-green:#7cb342; --grass-dark:#558b2f;
    --sky-blue:#87ceeb; --sky-light:#b0e0e6;
    --bee-yellow:#ffd700; --bee-black:#1a1a1a;
    --cloud-white:rgba(255,255,255,.95);
    --blossom-pink:#ffb7c5; --blossom-light:#ffd7dd;
    --powerup-blue:#4d96ff; --powerup-purple:#9d4edd;
    --danger-red:#e63946; --success-green:#06d6a0; --warning-orange:#ff9e00;

    /* Surfaces & elevation */
    --ink:#2b2418;
    --paper:rgba(255,248,225,.92);
    --paper-strong:rgba(255,248,225,.97);
    --glass:rgba(255,255,255,.16);
    --stroke:rgba(93,78,55,.85);

    --shadow-soft:0 10px 26px rgba(0,0,0,.14);
    --shadow-strong:0 18px 55px rgba(0,0,0,.28);
    --shadow-inset-light:inset 0 3px 0 rgba(255,255,255,.62);
    --shadow-inset-dark:inset 0 -4px 0 rgba(0,0,0,.10);

    --transition-speed:.22s;
    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:16px;

    /* Safe area */
    --safe-top:env(safe-area-inset-top, 10px);
    --safe-right:env(safe-area-inset-right, 10px);
    --safe-bottom:env(safe-area-inset-bottom, 10px);
    --safe-left:env(safe-area-inset-left, 10px);

    /* Layout tuning */
    --hud-gap:10px;
    --hud-top:calc(var(--safe-top) + 10px);
    --hud-side:calc(var(--safe-left) + 12px);
    --hud-side-r:calc(var(--safe-right) + 12px);

    --board-max-w:540px;
    --board-min-w:300px;

    /* Reserve space above canvas for HUD */
    --hud-reserve:112px;

    /* Control cluster spacing */
    --controls-bottom:calc(var(--safe-bottom) + 14px);
    --weather-bottom:calc(var(--safe-bottom) + 84px);

    /* Typography */
    --font-body:"Patrick Hand","Comic Sans MS",cursive,system-ui;
    --font-display:"Fredoka One",cursive;
  }

  /* ---------- Motion ---------- */
  @keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.6deg)}}
  @keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(110vw)}}
  @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes scorePopIn{0%{transform:scale(.35) rotate(-10deg);opacity:0}55%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
  @keyframes twinkle{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  @keyframes honeyDrip{0%{transform:translateY(0) scaleY(1)}50%{transform:translateY(4px) scaleY(1.15)}100%{transform:translateY(0) scaleY(1)}}
  @keyframes blossomFall{0%{transform:translateY(-50px) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
  @keyframes butterflyFlutter{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(10deg)}}
  @keyframes popupFloat{0%{opacity:1;transform:translate(-50%,0) scale(.6) rotate(-12deg)}45%{transform:translate(-50%,-58px) scale(1.25) rotate(7deg)}100%{opacity:0;transform:translate(-50%,-120px) scale(1) rotate(0)}}
  @keyframes floatWord{0%{opacity:0;transform:translateY(0) scale(.35) rotate(-8deg)}30%{opacity:1;transform:translateY(-34px) scale(1.2) rotate(4deg)}100%{opacity:0;transform:translateY(-94px) scale(.9) rotate(0)}}
  @keyframes fadeOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(-16px)}}

  @keyframes rainFall{0%{transform:translate3d(0,-60px,0) rotate(0deg)}100%{transform:translate3d(0,115vh,0) rotate(360deg)}}
  @keyframes snowFall{0%{transform:translate3d(0,-60px,0) rotate(0)}100%{transform:translate3d(120px,115vh,0) rotate(360deg)}}
  @keyframes leafFall{0%{transform:translate3d(0,-60px,0) rotate(0) scale(1)}50%{transform:translate3d(40px,56vh,0) rotate(180deg) scale(.82)}100%{transform:translate3d(-30px,115vh,0) rotate(360deg) scale(1)}}
  @keyframes petalFall{0%{transform:translate3d(0,-60px,0) rotate(0)}100%{transform:translate3d(60px,115vh,0) rotate(720deg)}}

  /* ---------- Reset / Base ---------- */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;
    background:
      radial-gradient(1200px 600px at 85% 15%, rgba(255,224,138,.55) 0%, rgba(255,224,138,0) 55%),
      linear-gradient(180deg,#0a3d62 0%,#2d7db2 28%,#87ceeb 48%,#b0e0e6 70%,#a8d5a3 86%,#7cb342 100%);
    font-family:var(--font-body);
    color:var(--wood-brown);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    text-rendering:optimizeLegibility;
  }

  /* Better focus for keyboard users */
  :focus{outline:none}
  :focus-visible{
    outline:4px solid rgba(255,165,0,.85);
    outline-offset:3px;
    border-radius:14px;
  }

  main#game-root{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    position:relative;
    z-index:1;
  }

  /* ---------- Background Layer ---------- */
  .background-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .cloud{
    position:absolute;
    background:white;
    border-radius:100px;
    opacity:.82;
    animation:cloudDrift linear infinite;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.08));
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:white;border-radius:100px}
  .cloud-1{width:120px;height:50px;top:14%;left:-140px;animation-duration:42s}
  .cloud-1::before{width:60px;height:60px;top:-30px;left:15px}
  .cloud-1::after{width:70px;height:50px;top:-20px;right:15px}
  .cloud-2{width:180px;height:70px;top:30%;left:-200px;animation-duration:64s;animation-delay:10s}
  .cloud-2::before{width:80px;height:80px;top:-40px;left:20px}
  .cloud-2::after{width:90px;height:70px;top:-30px;right:20px}
  .cloud-3{width:140px;height:55px;top:8%;left:-160px;animation-duration:54s;animation-delay:4s}
  .cloud-3::before{width:70px;height:70px;top:-35px;left:18px}
  .cloud-3::after{width:80px;height:55px;top:-22px;right:18px}

  .blossom{
    position:absolute;
    width:12px;height:12px;
    background:linear-gradient(135deg,var(--blossom-pink) 0%,var(--blossom-light) 100%);
    border-radius:50% 50% 50% 0;
    opacity:.65;
    animation:blossomFall linear infinite;
    filter:drop-shadow(0 4px 10px rgba(255,183,197,.18));
  }
  .butterfly{
    position:absolute;
    width:24px;height:16px;
    background:linear-gradient(135deg,#ff6b6b 0%,#ffd93d 100%);
    border-radius:50%;
    opacity:.85;
    animation:butterflyFlutter 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.12));
  }
  .butterfly::before,.butterfly::after{content:"";position:absolute;width:16px;height:24px;background:inherit;border-radius:50%;top:-4px}
  .butterfly::before{left:-8px;transform:rotate(45deg)}
  .butterfly::after{right:-8px;transform:rotate(-45deg)}

  /* ---------- HUD (Top Bar) ---------- */
  .hud{
    position:fixed;
    top:var(--hud-top);
    left:50%;
    transform:translateX(-50%);
    width:min(980px, calc(100vw - 24px - var(--safe-left) - var(--safe-right)));
    z-index:1200;
    pointer-events:none;
  }

  .hud-wrap{
    pointer-events:auto;
    display:grid;
    grid-template-columns: 1fr auto 1fr auto 1fr auto;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:999px;
    background:
      radial-gradient(800px 220px at 50% 0%, rgba(255,215,0,.18) 0%, rgba(255,215,0,0) 55%),
      linear-gradient(135deg, rgba(255,248,225,.92) 0%, rgba(255,232,184,.90) 100%);
    border:3px solid rgba(93,78,55,.85);
    box-shadow: var(--shadow-soft), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.08);
    backdrop-filter: blur(10px);
  }

  .hud-item{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }

  .hud-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.35rem;
    background:rgba(255,255,255,.55);
    border:2px solid rgba(93,78,55,.45);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.6);
  }

  .hud-meta{min-width:0; line-height:1;}
  .hud-label{
    font-family:"Patrick Hand",cursive;
    font-size:.92rem;
    letter-spacing:.6px;
    color:rgba(43,36,24,.85);
    text-transform:uppercase;
  }
  .hud-value{
    font-family:"Fredoka One",cursive;
    font-size:2.0rem;
    color:var(--pooh-red);
    text-shadow:2px 2px 0 rgba(0,0,0,.12);
    margin-top:2px;
    font-variant-numeric: tabular-nums;
  }

  .hud-score .hud-value{
    color:var(--honey-gold);
    text-shadow: 3px 3px 0 rgba(93,78,55,.35), 0 0 22px rgba(255,165,0,.35);
  }

  .hud-sep{
    width:1px;
    height:44px;
    background:linear-gradient(180deg, rgba(93,78,55,0) 0%, rgba(93,78,55,.28) 40%, rgba(93,78,55,.28) 60%, rgba(93,78,55,0) 100%);
  }

  /* Achievements "pill button" inside HUD */
  .hud-actions{
    grid-column: 6 / 7;
    justify-self:end;
    display:flex;
    align-items:center;
  }

  .hud-ach{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(135deg, rgba(77,150,255,.92) 0%, rgba(42,110,255,.92) 100%);
    border:2px solid rgba(255,255,255,.82);
    box-shadow: 0 10px 22px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25);
    color:white;
    font-family:"Fredoka One",cursive;
    pointer-events:auto;
    transition: transform var(--transition-speed) ease, filter var(--transition-speed) ease;
  }
  .hud-ach:hover{transform:translateY(-2px);filter:saturate(1.05)}
  .hud-ach:active{transform:translateY(1px)}

  .hud-ach-icon{font-size:1.25rem}
  .hud-ach-text{display:flex; flex-direction:column; align-items:flex-start; line-height:1.05}
  .hud-ach-label{
    font-size:.75rem;
    letter-spacing:1.1px;
    text-transform:uppercase;
    opacity:.92;
    font-family:"Patrick Hand",cursive;
  }
  .hud-ach-value{
    font-size:1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .hud-ach-caret{font-size:1.5rem; opacity:.9}

  /* ---------- Canvas Container ---------- */
  .game-container{
    position:relative;
    margin-top:calc(var(--hud-reserve) + var(--safe-top));
    width:clamp(var(--board-min-w), 92vw, var(--board-max-w));
    aspect-ratio:420/700;
    height:auto;
    max-height:calc(100dvh - (var(--hud-reserve) + 170px + var(--safe-top) + var(--safe-bottom)));
    animation:float 6.3s ease-in-out infinite;
    filter:drop-shadow(0 24px 52px rgba(0,0,0,.26)) drop-shadow(0 0 22px rgba(255,215,0,.18));
    transition:filter var(--transition-speed) ease, transform var(--transition-speed) ease;
    z-index:10;
    contain:layout paint style;
    border-radius:var(--radius-xl);
  }
  .game-container::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:calc(var(--radius-xl) + 10px);
    background:radial-gradient(800px 420px at 50% 0%, rgba(255,215,0,.22) 0%, rgba(255,215,0,0) 55%);
    filter:blur(1px);
    z-index:0;
    pointer-events:none;
  }

  #honey-game{
    width:100%;
    height:100%;
    display:block;
    background:linear-gradient(180deg,#0a3d62 0%,#1e6fa8 22%,#87ceeb 42%,#b0e0e6 62%,#a8d5a3 82%,#7cb342 100%);
    border-radius:var(--radius-xl);
    border:7px solid var(--wood-brown);
    box-shadow:
      0 0 0 4px rgba(139,115,85,.75),
      var(--shadow-strong),
      inset 0 -10px 26px rgba(0,0,0,.22),
      inset 0 10px 24px rgba(255,255,255,.12);
    touch-action:none;
    cursor:grab;
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  #honey-game:active{cursor:grabbing}

  /* ---------- Utility ---------- */
  .hidden{display:none!important}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- Honey Cursor ---------- */
  .honey-cursor{
    position:fixed;
    width:46px;height:46px;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:transform .08s ease;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));
    display:none;
    mix-blend-mode:multiply;
  }
  .honey-cursor.active{display:block}
  .honey-cursor .spoon{
    width:100%;
    height:100%;
    background:radial-gradient(circle at 30% 30%, #ffd700 0%, #ffa500 62%, #da9100 100%);
    clip-path:polygon(0% 45%, 62% 45%, 62% 30%, 100% 50%, 62% 70%, 62% 55%, 0% 55%);
    transform-origin:60% 50%;
    animation:honeyDrip 2s infinite;
    border-radius:10px;
  }

  /* ---------- Floating UI popups ---------- */
  .score-popup{
    position:absolute;
    font-weight:900;
    font-size:2.2rem;
    color:var(--honey-gold);
    pointer-events:none;
    text-shadow:4px 4px 0 var(--wood-brown), -2px -2px 0 rgba(255,255,255,.9), 0 0 30px rgba(255,165,0,.8);
    animation:popupFloat 1.45s ease-out forwards;
    z-index:100;
    font-family:var(--font-display);
    letter-spacing:1px;
    background:rgba(255,255,255,.06);
    padding:6px 12px;
    border-radius:14px;
    backdrop-filter:blur(6px);
  }
  .honey-word{
    position:absolute;
    font-size:1.55rem;
    font-weight:900;
    color:var(--honey-gold);
    text-shadow:3px 3px 0 var(--wood-brown), -1px -1px 0 rgba(255,255,255,.9), 0 0 22px rgba(255,165,0,.75);
    pointer-events:none;
    animation:floatWord 2.45s ease-out forwards;
    z-index:101;
    font-family:var(--font-body);
    text-align:center;
    padding:8px 14px;
    background:rgba(255,255,255,.12);
    border-radius:14px;
    border:2px solid rgba(255,255,255,.18);
    backdrop-filter:blur(7px);
  }

  /* ---------- Overlays ---------- */
  .character-select-overlay,.achievements-overlay,.overlay{
    position:absolute;
    inset:0;
    background:
      radial-gradient(900px 520px at 50% 0%, rgba(255,215,0,.22) 0%, rgba(255,215,0,0) 55%),
      linear-gradient(135deg, rgba(255,248,225,.97) 0%, rgba(255,232,184,.97) 55%, rgba(255,216,155,.97) 100%);
    backdrop-filter:blur(18px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    text-align:center;
    z-index:5000;
    animation:slideIn .55s ease-out;
    border:10px solid var(--wood-brown);
    box-shadow:
      inset 0 0 90px rgba(212,165,116,.28),
      0 0 70px rgba(0,0,0,.20);
    padding:calc(28px + var(--safe-top)) 28px calc(24px + var(--safe-bottom)) 28px;
    overflow:hidden;
  }

  /* Allow scroll for long overlays without blowing up layout */
  .achievements-overlay{padding:calc(20px + var(--safe-top)) 18px calc(18px + var(--safe-bottom)) 18px}
  .achievements-content{
    background:linear-gradient(135deg, rgba(255,248,225,.985) 0%, rgba(255,232,184,.985) 100%);
    border-radius:24px;
    padding:18px;
    max-width:580px;
    width:min(94vw, 580px);
    max-height:min(78vh, 720px);
    overflow:auto;
    border:7px solid var(--wood-brown);
    box-shadow:0 20px 60px rgba(0,0,0,.42);
    -webkit-overflow-scrolling:touch;
  }
  .achievements-content::-webkit-scrollbar{width:10px}
  .achievements-content::-webkit-scrollbar-thumb{background:rgba(93,78,55,.35);border-radius:10px}

  .overlay h1{
    font-size:3.7rem;
    font-weight:900;
    color:var(--pooh-red);
    text-shadow:5px 5px 0 var(--pooh-bear), 7px 7px 0 var(--wood-brown);
    letter-spacing:1.8px;
    line-height:1.05;
    animation:bounce 3.2s ease-in-out infinite;
    font-family:var(--font-display);
    margin-bottom:6px;
  }
  .overlay h2{
    font-size:2.2rem;
    color:var(--wood-brown);
    font-family:var(--font-display);
    margin-bottom:8px
  }
  .subtitle{
    font-size:1.22rem;
    color:var(--ink);
    text-shadow:1px 1px 0 rgba(255,255,255,.55);
    font-family:var(--font-body);
    max-width:560px;
    line-height:1.35;
    opacity:.92;
  }

  /* ---------- Buttons ---------- */
  .btn{
    background:linear-gradient(135deg,var(--pooh-red) 0%,#c62828 100%);
    border:5px solid var(--wood-brown);
    padding:16px 38px;
    font-size:1.18rem;
    font-weight:900;
    border-radius:60px;
    cursor:pointer;
    box-shadow:0 8px 0 #8b2020, 0 16px 30px rgba(0,0,0,.28), inset 0 4px 0 rgba(255,255,255,.35);
    color:white;
    text-transform:uppercase;
    letter-spacing:1.8px;
    transition:transform var(--transition-speed) ease, filter var(--transition-speed) ease;
    position:relative;
    font-family:var(--font-display);
    text-shadow:2px 2px 0 rgba(0,0,0,.25);
    overflow:hidden;
    min-height:56px;
  }
  .btn:hover{transform:translateY(-3px);filter:saturate(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn-secondary{
    background:linear-gradient(135deg,var(--wood-light) 0%,var(--wood-brown) 100%);
    box-shadow:0 8px 0 #4a3a24, 0 16px 28px rgba(0,0,0,.24), inset 0 4px 0 rgba(255,255,255,.22);
    padding:14px 28px;
    font-size:1.05rem;
    letter-spacing:1.2px;
  }

  .final-score{
    font-size:4.6rem;
    font-weight:900;
    color:var(--honey-gold);
    text-shadow:6px 6px 0 var(--wood-brown), -3px -3px 0 rgba(255,255,255,.95), 0 0 40px rgba(255,165,0,.75);
    animation:bounce 2.4s ease-in-out infinite;
    margin:10px 0;
    font-family:var(--font-display);
  }

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin:18px 0 10px;
    width:100%;
    max-width:560px
  }
  .stat-box{
    background:rgba(255,255,255,.88);
    border:4px solid var(--wood-brown);
    padding:14px;
    border-radius:18px;
    box-shadow:var(--shadow-soft);
  }
  .stat-box-label{
    font-size:.9rem;
    opacity:.9;
    margin-bottom:6px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--wood-brown);
    font-family:var(--font-body);
  }
  .stat-box-value{
    font-size:2rem;
    font-weight:900;
    color:var(--pooh-red);
    line-height:1;
    font-family:var(--font-display);
  }

  /* ---------- Character Select ---------- */
  .character-select-title{
    font-size:2.25rem;
    font-weight:900;
    color:var(--pooh-red);
    text-shadow:3px 3px 0 var(--pooh-bear);
    font-family:var(--font-display);
  }
  .character-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    max-width:560px;
    width:100%;
  }
  .character-card{
    background:rgba(255,255,255,.88);
    border:4px solid var(--wood-brown);
    border-radius:20px;
    padding:14px;
    cursor:pointer;
    transition:transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease, border-color var(--transition-speed) ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;

 <script>
(() => {
  "use strict";
  if (window.__POOH_HONEY_HUNT__) return;
  window.__POOH_HONEY_HUNT__ = true;

  /* ================================
     Safe storage (sandbox-safe)
  ================================= */
  const Store = (() => {
    const mem = new Map();
    const hasLS = (() => {
      try {
        const k = "__t__";
        localStorage.setItem(k, "1");
        localStorage.removeItem(k);
        return true;
      } catch { return false; }
    })();

    const get = (k, fallback = null) => {
      if (hasLS) { try { const v = localStorage.getItem(k); return (v ?? fallback); } catch {} }
      return mem.has(k) ? mem.get(k) : fallback;
    };
    const set = (k, v) => {
      const sv = String(v);
      if (hasLS) { try { localStorage.setItem(k, sv); return; } catch {} }
      mem.set(k, sv);
    };
    return { get, set };
  })();

  /* ================================
     DOM helpers
  ================================= */
  const $ = (id) => document.getElementById(id);
  const qsa = (sel) => Array.from(document.querySelectorAll(sel));
  const on = (id, evt, fn, opts) => { const el = $(id); if (el) el.addEventListener(evt, fn, opts); };

  /* ================================
     Overlay helpers
  ================================= */
  const overlaySelectors = ".overlay, .character-select-overlay, .achievements-overlay";
  const anyOverlayOpen = () => qsa(overlaySelectors).some(x => !x.classList.contains("hidden"));

  const openOverlay = (id) => {
    const el = $(id);
    if (!el) return;
    el.classList.remove("hidden");
    document.body.classList.add("overlay-open");
    // Focus something sensible
    const focusable = el.querySelector("button, [href], input, [tabindex]:not([tabindex='-1'])");
    if (focusable) setTimeout(() => focusable.focus(), 0);
  };

  const closeOverlay = (id) => {
    const el = $(id);
    if (!el) return;
    el.classList.add("hidden");
    if (!anyOverlayOpen()) document.body.classList.remove("overlay-open");
  };

  const closeAllOverlays = () => {
    qsa(overlaySelectors).forEach(x => x.classList.add("hidden"));
    document.body.classList.remove("overlay-open");
  };

  /* ================================
     Tiny Audio (no external assets)
  ================================= */
  const Audio = (() => {
    let ctx = null;
    let enabled = true;

    const ensure = async () => {
      if (!enabled) return null;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === "suspended") {
        try { await ctx.resume(); } catch {}
      }
      return ctx;
    };

    const tone = async (freq = 440, dur = 0.08, type = "sine", vol = 0.06) => {
      const c = await ensure();
      if (!c) return;

      const t0 = c.currentTime;
      const o = c.createOscillator();
      const g = c.createGain();

      o.type = type;
      o.frequency.setValueAtTime(freq, t0);

      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

      o.connect(g).connect(c.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    };

    const sfx = {
      catch: () => Promise.all([tone(740, 0.07, "triangle", 0.05), tone(1040, 0.06, "sine", 0.04)]),
      gold:  () => Promise.all([tone(880, 0.09, "triangle", 0.06), tone(1320, 0.08, "sine", 0.05), tone(1760, 0.06, "sine", 0.035)]),
      hit:   () => Promise.all([tone(180, 0.10, "sawtooth", 0.04), tone(120, 0.12, "square", 0.03)]),
      click: () => tone(520, 0.05, "square", 0.03),
      win:   () => Promise.all([tone(660, 0.10, "triangle", 0.05), tone(990, 0.11, "triangle", 0.05), tone(1320, 0.12, "triangle", 0.045)]),
    };

    const setEnabled = (v) => {
      enabled = !!v;
      Store.set("soundEnabled", enabled ? "1" : "0");
    };

    const getEnabled = () => enabled;

    // restore pref
    enabled = Store.get("soundEnabled", "1") !== "0";

    return { ensure, sfx, setEnabled, getEnabled };
  })();

  /* ================================
     Main
  ================================= */
  window.addEventListener("DOMContentLoaded", () => {
    const canvas = $("honey-game") || $("game-canvas");
    if (!canvas) { console.error("Canvas not found (#honey-game)."); return; }

    const ctx = canvas.getContext("2d");
    if (!ctx) { console.error("2D context unavailable."); return; }

    /* ---------- DPR / resize (fix clear + coordinate space) ---------- */
    let cssW = 420, cssH = 700, dpr = 1;

    const resizeCanvas = () => {
      dpr = Math.max(1, window.devicePixelRatio || 1);
      const rect = canvas.getBoundingClientRect();

      cssW = Math.max(1, rect.width);
      cssH = Math.max(1, rect.height);

      canvas.width  = Math.max(1, Math.floor(cssW * dpr));
      canvas.height = Math.max(1, Math.floor(cssH * dpr));

      // Draw in CSS pixels
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Re-clamp player on resize
      player.y = cssH - 92;
      player.x = clamp(player.x, player.r, cssW - player.r);
      player.targetX = clamp(player.targetX, player.r, cssW - player.r);
    };

    window.addEventListener("resize", resizeCanvas, { passive: true });

    /* ---------- State ---------- */
    const state = {
      score: 0,
      streak: 0,
      bestStreak: 0,
      lives: 3,
      time: 0,
      honeyCaught: 0,
      character: Store.get("character", "pooh") || "pooh",
      weather: Store.get("weather", "clear") || "clear",
      hi: Number(Store.get("hi", "0")) || 0,
      hitsTaken: 0,
      goldCaught: 0,
    };

    const CHAR_MODS = {
      pooh:   { r: 1.35, s: 1.00, label: "Big catch radius" },
      piglet: { r: 0.95, s: 1.25, label: "Fast movement" },
      tigger: { r: 1.08, s: 1.12, label: "Bouncy speed" },
      rabbit: { r: 1.02, s: 1.06, label: "Steady control" }
    };

    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const rand = (a, b) => a + Math.random() * (b - a);

    const player = {
      x: 210,
      y: 610,
      r: 34,
      targetX: 210
    };

    const honeys = [];
    const bees = [];

    const spawnHoney = () => {
      honeys.push({
        x: rand(18, cssW - 18),
        y: -30,
        r: 16,
        v: rand(170, 290),
        gold: Math.random() < 0.15
      });
    };

    const spawnBee = () => {
      bees.push({
        x: rand(18, cssW - 18),
        y: -30,
        r: 16,
        v: rand(220, 340)
      });
    };

    /* ---------- HUD sync ---------- */
    const syncHUD = () => {
      const s = $("score"); if (s) s.textContent = String(state.score);
      const st = $("streak"); if (st) st.textContent = String(state.streak);
      const l = $("lives"); if (l) l.textContent = String(state.lives);
      updateAchievementCount();
    };

    /* ================================
       Honey Cursor (desktop only-ish)
    ================================= */
    const cursor = $("honey-cursor");
    const setCursor = (x, y, on) => {
      if (!cursor) return;
      if (on) cursor.classList.add("active"); else cursor.classList.remove("active");
      cursor.style.left = x + "px";
      cursor.style.top  = y + "px";
    };

    window.addEventListener("pointermove", (e) => {
      if (!cursor) return;
      // only show when not overlay and using mouse/pen
      const ok = !anyOverlayOpen() && (e.pointerType === "mouse" || e.pointerType === "pen");
      setCursor(e.clientX, e.clientY, ok);
    }, { passive: true });

    /* ================================
       Weather system (real effects)
    ================================= */
    let weatherLayer = $("weather-effects");
    if (!weatherLayer) {
      weatherLayer = document.createElement("div");
      weatherLayer.id = "weather-effects";
      document.body.appendChild(weatherLayer);
    }

    let weatherTimer = null;

    const clearWeatherParticles = () => {
      if (weatherTimer) { clearInterval(weatherTimer); weatherTimer = null; }
      weatherLayer.innerHTML = "";
      weatherLayer.dataset.weather = "clear";
    };

    const makeParticle = (kind) => {
      const el = document.createElement("div");
      el.style.position = "absolute";
      el.style.left = rand(-20, window.innerWidth + 20) + "px";
      el.style.top = rand(-80, -20) + "px";
      el.style.opacity = String(rand(0.35, 0.95));
      el.style.transform = "translate3d(0,0,0)";
      el.style.pointerEvents = "none";
      el.style.willChange = "transform, opacity";

      const dur = rand(2.4, 5.6);

      if (kind === "rain") {
        el.style.width = "2px";
        el.style.height = rand(14, 26) + "px";
        el.style.borderRadius = "2px";
        el.style.background = "rgba(77,150,255,.85)";
        el.style.animation = `rainFall ${dur}s linear forwards`;
      } else if (kind === "snow") {
        const s = rand(4, 9);
        el.style.width = s + "px";
        el.style.height = s + "px";
        el.style.borderRadius = "999px";
        el.style.background = "rgba(255,255,255,.92)";
        el.style.filter = "drop-shadow(0 6px 12px rgba(0,0,0,.08))";
        el.style.animation = `snowFall ${dur}s linear forwards`;
      } else if (kind === "leaves") {
        const s = rand(10, 18);
        el.style.width = s + "px";
        el.style.height = s + "px";
        el.style.borderRadius = "6px 14px 6px 14px";
        el.style.background = "linear-gradient(135deg, rgba(139,115,85,.95), rgba(124,179,66,.75))";
        el.style.filter = "drop-shadow(0 10px 16px rgba(0,0,0,.12))";
        el.style.animation = `leafFall ${dur}s linear forwards`;
      } else if (kind === "blossoms") {
        const s = rand(8, 14);
        el.style.width = s + "px";
        el.style.height = s + "px";
        el.style.borderRadius = "50% 50% 50% 0";
        el.style.background = "linear-gradient(135deg, rgba(255,183,197,.95), rgba(255,215,221,.95))";
        el.style.filter = "drop-shadow(0 6px 14px rgba(255,183,197,.18))";
        el.style.animation = `petalFall ${dur}s linear forwards`;
      }

      weatherLayer.appendChild(el);
      // cleanup
      setTimeout(() => el.remove(), (dur + 0.2) * 1000);
    };

    const applyWeather = (weather) => {
      state.weather = weather || "clear";
      Store.set("weather", state.weather);

      clearWeatherParticles();
      weatherLayer.dataset.weather = state.weather;

      if (state.weather === "clear") return;

      const kind = state.weather; // rain/snow/leaves/blossoms
      const rateMs = (kind === "rain") ? 90 : (kind === "snow") ? 160 : 140;

      weatherTimer = setInterval(() => {
        // spawn a few per tick to look “alive”
        const n = (kind === "rain") ? 3 : 2;
        for (let i = 0; i < n; i++) makeParticle(kind);
      }, rateMs);
    };

    /* ================================
       Weather drawer wiring
    ================================= */
    const weatherDrawer = $("weather-drawer");
    const weatherToggle = $("weather-toggle");
    const weatherClose  = $("weather-close");

    const setWeatherDrawerOpen = (open) => {
      if (!weatherDrawer) return;
      weatherDrawer.classList.toggle("open", !!open);
      if (!!open) document.body.classList.add("overlay-open"); // prevents stray clicks behind
      else if (!anyOverlayOpen()) document.body.classList.remove("overlay-open");
    };

    if (weatherToggle && weatherDrawer) {
      weatherToggle.addEventListener("click", async () => {
        await Audio.sfx.click();
        setWeatherDrawerOpen(!weatherDrawer.classList.contains("open"));
      });
    }
    if (weatherClose && weatherDrawer) {
      weatherClose.addEventListener("click", async () => {
        await Audio.sfx.click();
        setWeatherDrawerOpen(false);
      });
    }

    qsa(".weather-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        await Audio.sfx.click();
        const w = btn.dataset.weather || "clear";
        qsa(".weather-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        applyWeather(w);
      });
    });

    /* ================================
       Achievements (real + rendered)
    ================================= */
    const ACH_KEY = "achievements_v1";

    const ACH = [
      { id:"first_honey", name:"First Taste", desc:"Catch your first honey.", icon:"🍯", test:(g)=>g.honeyCaught >= 1 },
      { id:"score_100",  name:"Sticky Start", desc:"Reach 100 points.", icon:"✨", test:(g)=>g.score >= 100 },
      { id:"score_500",  name:"Honey Hoarder", desc:"Reach 500 points.", icon:"🏺", test:(g)=>g.score >= 500 },
      { id:"streak_10",  name:"No Miss Zone", desc:"Get a 10 streak.", icon:"🔥", test:(g)=>g.bestStreak >= 10 },
      { id:"gold_1",     name:"Liquid Gold", desc:"Catch a golden honey.", icon:"🌟", test:(g)=>g.goldCaught >= 1 },
      { id:"survive_60", name:"Steady Paws", desc:"Survive 60 seconds.", icon:"⏱️", test:(g)=>g.time >= 60 },
      { id:"clean_run",  name:"Bee Dodger", desc:"Finish a run with no hits.", icon:"🛡️", test:(g)=>!g.running && g.lastRunHadNoHits === true },
      { id:"streak_20",  name:"Legendary Streak", desc:"Get a 20 streak.", icon:"🏆", test:(g)=>g.bestStreak >= 20 },
      { id:"score_1000", name:"Honey Tycoon", desc:"Reach 1000 points.", icon:"👑", test:(g)=>g.score >= 1000 },
      { id:"play_3",     name:"One More Round", desc:"Play 3 runs.", icon:"🎮", test:(g)=>g.runsPlayed >= 3 },
    ];

    const loadUnlocked = () => {
      try { return new Set(JSON.parse(Store.get(ACH_KEY, "[]")) || []); }
      catch { return new Set(); }
    };
    const saveUnlocked = (set) => {
      Store.set(ACH_KEY, JSON.stringify(Array.from(set)));
    };

    const unlocked = loadUnlocked();

    const achievementsList = $("achievements-list");
    const achievementsCount = $("achievements-count");

    const renderAchievements = () => {
      if (!achievementsList) return;
      achievementsList.innerHTML = "";

      for (const a of ACH) {
        const isOn = unlocked.has(a.id);
        const row = document.createElement("div");
        row.className = "achievement-item" + (isOn ? " unlocked" : "");
        row.innerHTML = `
          <div class="achievement-icon">${a.icon}</div>
          <div class="achievement-text">
            <div class="achievement-name">${a.name}${isOn ? " ✅" : ""}</div>
            <div class="achievement-desc">${a.desc}</div>
          </div>
        `;
        achievementsList.appendChild(row);
      }
      updateAchievementCount();
    };

    const updateAchievementCount = () => {
      if (!achievementsCount) return;
      achievementsCount.textContent = `${unlocked.size}/${ACH.length}`;
    };

    const showAchievementPopup = (title, icon) => {
      const p = document.createElement("div");
      p.className = "achievement-popup";
      p.innerHTML = `<div style="font-size:1.4rem">${icon || "🏆"}</div><div style="margin-top:6px">Unlocked: <strong>${title}</strong></div>`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2600);
    };

    const checkAchievements = (context = "tick") => {
      // context used for future tuning if needed
      let newly = 0;
      for (const a of ACH) {
        if (unlocked.has(a.id)) continue;
        if (a.test(gamePublic)) {
          unlocked.add(a.id);
          newly++;
          showAchievementPopup(a.name, a.icon);
          Audio.sfx.win().catch(()=>{});
        }
      }
      if (newly) {
        saveUnlocked(unlocked);
        renderAchievements();
      }
    };

    /* ================================
       Share button
    ================================= */
    const doShare = async () => {
      await Audio.sfx.click();
      const text = `🍯 Pooh’s Honey Hunt\nScore: ${state.score}\nHigh Score: ${state.hi}\nBest Streak: ${state.bestStreak}`;
      try {
        if (navigator.share) {
          await navigator.share({ title: "Pooh’s Honey Hunt", text });
        } else if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          showAchievementPopup("Copied to clipboard!", "📋");
        } else {
          // last resort
          prompt("Copy this:", text);
        }
      } catch {
        // user cancelled or share failed; no drama
      }
    };
    on("share-btn", "click", doShare);

    /* ================================
       Sound toggle button
    ================================= */
    const soundBtn = $("sound-toggle-btn");
    const syncSoundIcon = () => {
      if (!soundBtn) return;
      const icon = soundBtn.querySelector("i");
      if (!icon) return;
      const on = Audio.getEnabled();
      icon.className = on ? "fas fa-volume-up" : "fas fa-volume-mute";
      soundBtn.setAttribute("aria-label", on ? "Mute sound" : "Unmute sound");
    };

    if (soundBtn) {
      soundBtn.addEventListener("click", async () => {
        const next = !Audio.getEnabled();
        Audio.setEnabled(next);
        syncSoundIcon();
        if (next) { await Audio.ensure(); await Audio.sfx.click(); }
      });
    }

    /* ================================
       Input (smooth)
    ================================= */
    let dragging = false;

    const pointerToX = (e) => {
      const rect = canvas.getBoundingClientRect();
      return clamp(e.clientX - rect.left, 0, rect.width);
    };

    canvas.addEventListener("pointerdown", async (e) => {
      dragging = true;
      canvas.setPointerCapture?.(e.pointerId);
      player.targetX = pointerToX(e);
      await Audio.ensure();

      // If start overlay exists, don't auto-start unless you click Start;
      // if you removed start overlay, you can still auto-start by clicking canvas.
      if (!running && !$("start-overlay")) startGame();
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      player.targetX = pointerToX(e);
    });

    const stopDrag = () => { dragging = false; };
    canvas.addEventListener("pointerup", stopDrag);
    canvas.addEventListener("pointercancel", stopDrag);
    canvas.addEventListener("lostpointercapture", stopDrag);

    /* ================================
       Game loop + logic
    ================================= */
    let running = false;
    let paused = false;
    let lastTime = 0;
    let runsPlayed = Number(Store.get("runsPlayed", "0")) || 0;

    const resetRun = () => {
      state.score = 0;
      state.streak = 0;
      state.bestStreak = 0;
      state.lives = 3;
      state.time = 0;
      state.honeyCaught = 0;
      state.hitsTaken = 0;
      state.goldCaught = 0;
      honeys.length = 0;
      bees.length = 0;

      const m = CHAR_MODS[state.character] || CHAR_MODS.pooh;
      player.r = 34 * m.r;

      player.x = cssW / 2;
      player.targetX = player.x;
      player.y = cssH - 92;

      syncHUD();
      renderAchievements();
    };

    const update = (dt) => {
      state.time += dt;

      // Smooth “springy” follow (fast but not jerky)
      const m = CHAR_MODS[state.character] || CHAR_MODS.pooh;
      const speed = 18 * m.s;
      player.x += (player.targetX - player.x) * Math.min(1, dt * speed);
      player.x = clamp(player.x, player.r, cssW - player.r);

      // spawn rates (slightly scale up with time)
      const t = state.time;
      const honeyRate = 0.028 + Math.min(0.020, t * 0.00035);
      const beeRate   = 0.012 + Math.min(0.018, t * 0.00030);

      if (Math.random() < honeyRate) spawnHoney();
      if (Math.random() < beeRate) spawnBee();

      for (const h of honeys) h.y += h.v * dt;
      for (const b of bees)  b.y += b.v * dt;

      // honey collisions
      for (let i = honeys.length - 1; i >= 0; i--) {
        const h = honeys[i];
        const hit = Math.hypot(h.x - player.x, h.y - player.y) < (player.r + h.r);
        if (hit) {
          honeys.splice(i, 1);
          state.honeyCaught++;
          state.streak++;
          state.bestStreak = Math.max(state.bestStreak, state.streak);

          if (h.gold) {
            state.score += 30;
            state.goldCaught++;
            Audio.sfx.gold().catch(()=>{});
          } else {
            state.score += 10;
            Audio.sfx.catch().catch(()=>{});
          }
          checkAchievements("catch");
          continue;
        }
        if (h.y > cssH + 60) {
          honeys.splice(i, 1);
          state.streak = 0;
        }
      }

      // bee collisions
      for (let i = bees.length - 1; i >= 0; i--) {
        const b = bees[i];
        const hit = Math.hypot(b.x - player.x, b.y - player.y) < (player.r + b.r);
        if (hit) {
          bees.splice(i, 1);
          state.lives--;
          state.streak = 0;
          state.hitsTaken++;
          Audio.sfx.hit().catch(()=>{});
          if (state.lives <= 0) { endGame(); return; }
          continue;
        }
        if (b.y > cssH + 60) bees.splice(i, 1);
      }

      syncHUD();
      checkAchievements("tick");
    };

    const draw = () => {
      // IMPORTANT: because we draw in CSS pixels, clear using cssW/cssH
      ctx.clearRect(0, 0, cssW, cssH);

      // Pooh (placeholder circle for now)
      ctx.beginPath();
      ctx.fillStyle = "#d4a574";
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();

      // Honey
      for (const h of honeys) {
        ctx.fillStyle = h.gold ? "#ffd700" : "#ffa500";
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Bees
      for (const b of bees) {
        ctx.fillStyle = "#222";
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    const loop = (t) => {
      if (!running) return;
      const dt = Math.min(0.05, (t - lastTime) / 1000);
      lastTime = t;
      if (!paused) update(dt);
      draw();
      requestAnimationFrame(loop);
    };

    const startGame = async () => {
      await Audio.ensure();
      closeAllOverlays();
      setWeatherDrawerOpen(false);
      resetRun();

      running = true;
      paused = false;
      lastTime = performance.now();

      // mark run played
      runsPlayed++;
      Store.set("runsPlayed", String(runsPlayed));

      requestAnimationFrame(loop);
    };

    const endGame = () => {
      running = false;

      // high score
      if (state.score > state.hi) {
        state.hi = state.score;
        Store.set("hi", String(state.hi));
      }

      // For achievements that depend on end-of-run
      gamePublic.lastRunHadNoHits = (state.hitsTaken === 0);
      gamePublic.running = false;
      checkAchievements("end");

      const fs = $("final-score"); if (fs) fs.textContent = String(state.score);
      syncHUD();
      openOverlay("gameover-overlay");
    };

    const togglePause = async () => {
      if (!running) return;
      await Audio.sfx.click();
      paused = !paused;
      if (paused) openOverlay("pause-overlay");
      else closeOverlay("pause-overlay");
    };

    /* ================================
       Buttons wiring
    ================================= */
    on("start-btn", "click", startGame);
    on("restart-btn", "click", startGame);

    on("pause-btn", "click", togglePause);
    on("resume-btn", "click", togglePause);

    on("quit-btn", "click", async () => {
      await Audio.sfx.click();
      running = false;
      paused = false;
      closeAllOverlays();
      setWeatherDrawerOpen(false);
      // keep start overlay if it exists
      if ($("start-overlay")) openOverlay("start-overlay");
    });

    on("help-btn", "click", async () => { await Audio.sfx.click(); openOverlay("help-overlay"); });
    on("close-help-btn", "click", async () => { await Audio.sfx.click(); closeOverlay("help-overlay"); });

    on("view-achievements-btn", "click", async () => { await Audio.sfx.click(); renderAchievements(); openOverlay("achievements-overlay"); });
    on("achievements-btn", "click", async () => { await Audio.sfx.click(); renderAchievements(); openOverlay("achievements-overlay"); });

    on("close-achievements-btn", "click", async () => { await Audio.sfx.click(); closeOverlay("achievements-overlay"); });
    on("close-achievements-btn-2", "click", async () => { await Audio.sfx.click(); closeOverlay("achievements-overlay"); });

    on("select-character-btn", "click", async () => { await Audio.sfx.click(); openOverlay("character-select-overlay"); });
    on("back-to-menu-btn", "click", async () => { await Audio.sfx.click(); closeOverlay("character-select-overlay"); });

    // Character selection: use `.selected` (your CSS), persist choice
    const syncCharacterCards = () => {
      qsa(".character-card").forEach(b => {
        const c = b.dataset.character || "";
        b.classList.toggle("selected", c === state.character);
      });
    };

    qsa(".character-card").forEach(btn => {
      btn.addEventListener("click", async () => {
        await Audio.sfx.click();
        state.character = btn.dataset.character || "pooh";
        Store.set("character", state.character);
        syncCharacterCards();
      });
    });

    on("start-with-character-btn", "click", startGame);

    /* ================================
       Keyboard: Esc closes drawers/overlays
    ================================= */
    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;

      if (weatherDrawer?.classList.contains("open")) {
        setWeatherDrawerOpen(false);
        return;
      }
      if (anyOverlayOpen()) {
        // close topmost-ish: achievements > character > help > pause > gameover > start
        const order = ["achievements-overlay","character-select-overlay","help-overlay","pause-overlay","gameover-overlay","start-overlay"];
        for (const id of order) {
          const el = $(id);
          if (el && !el.classList.contains("hidden")) { closeOverlay(id); break; }
        }
      } else if (running) {
        // quick pause on Esc
        togglePause().catch(()=>{});
      }
    });

    /* ================================
       Public-ish object for achievements tests
    ================================= */
    const gamePublic = {
      get score(){ return state.score; },
      get bestStreak(){ return state.bestStreak; },
      get honeyCaught(){ return state.honeyCaught; },
      get goldCaught(){ return state.goldCaught; },
      get time(){ return state.time; },
      get running(){ return running; },
      set running(v){ /* ignored */ },
      get runsPlayed(){ return runsPlayed; },
      lastRunHadNoHits: false
    };

    /* ================================
       Initial boot
    ================================= */
    resizeCanvas();

    // UI prefs
    syncSoundIcon();
    syncCharacterCards();

    // Weather: set active button + apply
    const initialWeatherBtn = qsa(".weather-btn").find(b => (b.dataset.weather || "clear") === state.weather);
    qsa(".weather-btn").forEach(b => b.classList.remove("active"));
    if (initialWeatherBtn) initialWeatherBtn.classList.add("active");
    applyWeather(state.weather);

    renderAchievements();
    syncHUD();

    // Start overlay behavior
    if ($("start-overlay")) openOverlay("start-overlay");
    else startGame();
  });
})();
</script>



</body>
</html>
