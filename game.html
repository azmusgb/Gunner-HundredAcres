<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pooh's Enhanced Honey Hunt - Complete Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#d4a574" />
  <meta name="description" content="Help Pooh catch honey pots in the Hundred Acre Wood! Now with achievements, character selection, weather effects, and more!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    /* Brand palette */
    --pooh-bear:#d4a574; --pooh-light:#e8c9a3; --pooh-red:#e63946;
    --honey-pot:#8b4513; --honey-gold:#ffa500; --honey-shine:#ffd700;
    --wood-brown:#5d4e37; --wood-light:#8b7355;
    --grass-green:#7cb342; --grass-dark:#558b2f;
    --sky-blue:#87ceeb; --sky-light:#b0e0e6;
    --bee-yellow:#ffd700; --bee-black:#1a1a1a;
    --cloud-white:rgba(255,255,255,.95);
    --blossom-pink:#ffb7c5; --blossom-light:#ffd7dd;
    --powerup-blue:#4d96ff; --powerup-purple:#9d4edd;
    --danger-red:#e63946; --success-green:#06d6a0; --warning-orange:#ff9e00;

    /* Surfaces & elevation */
    --ink:#2b2418;
    --paper:rgba(255,248,225,.92);
    --paper-strong:rgba(255,248,225,.97);
    --glass:rgba(255,255,255,.16);
    --stroke:rgba(93,78,55,.85);

    --shadow-soft:0 10px 26px rgba(0,0,0,.14);
    --shadow-strong:0 18px 55px rgba(0,0,0,.28);
    --shadow-inset-light:inset 0 3px 0 rgba(255,255,255,.62);
    --shadow-inset-dark:inset 0 -4px 0 rgba(0,0,0,.10);

    --transition-speed:.22s;
    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:16px;

    /* Safe area */
    --safe-top:env(safe-area-inset-top, 10px);
    --safe-right:env(safe-area-inset-right, 10px);
    --safe-bottom:env(safe-area-inset-bottom, 10px);
    --safe-left:env(safe-area-inset-left, 10px);

    /* Layout tuning */
    --hud-gap:10px;
    --hud-top:calc(var(--safe-top) + 10px);
    --hud-side:calc(var(--safe-left) + 12px);
    --hud-side-r:calc(var(--safe-right) + 12px);

    --board-max-w:540px;
    --board-min-w:300px;

    /* Reserve space above canvas for HUD */
    --hud-reserve:112px;

    /* Control cluster spacing */
    --controls-bottom:calc(var(--safe-bottom) + 14px);
    --weather-bottom:calc(var(--safe-bottom) + 84px);

    /* Typography */
    --font-body:"Patrick Hand","Comic Sans MS",cursive,system-ui;
    --font-display:"Fredoka One",cursive;
  }

  /* ---------- Motion ---------- */
  @keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.6deg)}}
  @keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(110vw)}}
  @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes scorePopIn{0%{transform:scale(.35) rotate(-10deg);opacity:0}55%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
  @keyframes twinkle{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  @keyframes honeyDrip{0%{transform:translateY(0) scaleY(1)}50%{transform:translateY(4px) scaleY(1.15)}100%{transform:translateY(0) scaleY(1)}}
  @keyframes blossomFall{0%{transform:translateY(-50px) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
  @keyframes butterflyFlutter{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(10deg)}}
  @keyframes popupFloat{0%{opacity:1;transform:translate(-50%,0) scale(.6) rotate(-12deg)}45%{transform:translate(-50%,-58px) scale(1.25) rotate(7deg)}100%{opacity:0;transform:translate(-50%,-120px) scale(1) rotate(0)}}
  @keyframes floatWord{0%{opacity:0;transform:translateY(0) scale(.35) rotate(-8deg)}30%{opacity:1;transform:translateY(-34px) scale(1.2) rotate(4deg)}100%{opacity:0;transform:translateY(-94px) scale(.9) rotate(0)}}
  @keyframes fadeOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(-16px)}}

  @keyframes rainFall{0%{transform:translate3d(0,-60px,0) rotate(0deg)}100%{transform:translate3d(0,115vh,0) rotate(360deg)}}
  @keyframes snowFall{0%{transform:translate3d(0,-60px,0) rotate(0)}100%{transform:translate3d(120px,115vh,0) rotate(360deg)}}
  @keyframes leafFall{0%{transform:translate3d(0,-60px,0) rotate(0) scale(1)}50%{transform:translate3d(40px,56vh,0) rotate(180deg) scale(.82)}100%{transform:translate3d(-30px,115vh,0) rotate(360deg) scale(1)}}
  @keyframes petalFall{0%{transform:translate3d(0,-60px,0) rotate(0)}100%{transform:translate3d(60px,115vh,0) rotate(720deg)}}

  /* ---------- Reset / Base ---------- */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;
    background:
      radial-gradient(1200px 600px at 85% 15%, rgba(255,224,138,.55) 0%, rgba(255,224,138,0) 55%),
      linear-gradient(180deg,#0a3d62 0%,#2d7db2 28%,#87ceeb 48%,#b0e0e6 70%,#a8d5a3 86%,#7cb342 100%);
    font-family:var(--font-body);
    color:var(--wood-brown);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    text-rendering:optimizeLegibility;
  }

  /* Better focus for keyboard users */
  :focus{outline:none}
  :focus-visible{
    outline:4px solid rgba(255,165,0,.85);
    outline-offset:3px;
    border-radius:14px;
  }

  main#game-root{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    position:relative;
    z-index:1;
  }

  /* ---------- Background Layer ---------- */
  .background-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .cloud{
    position:absolute;
    background:white;
    border-radius:100px;
    opacity:.82;
    animation:cloudDrift linear infinite;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.08));
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:white;border-radius:100px}
  .cloud-1{width:120px;height:50px;top:14%;left:-140px;animation-duration:42s}
  .cloud-1::before{width:60px;height:60px;top:-30px;left:15px}
  .cloud-1::after{width:70px;height:50px;top:-20px;right:15px}
  .cloud-2{width:180px;height:70px;top:30%;left:-200px;animation-duration:64s;animation-delay:10s}
  .cloud-2::before{width:80px;height:80px;top:-40px;left:20px}
  .cloud-2::after{width:90px;height:70px;top:-30px;right:20px}
  .cloud-3{width:140px;height:55px;top:8%;left:-160px;animation-duration:54s;animation-delay:4s}
  .cloud-3::before{width:70px;height:70px;top:-35px;left:18px}
  .cloud-3::after{width:80px;height:55px;top:-22px;right:18px}

  .blossom{
    position:absolute;
    width:12px;height:12px;
    background:linear-gradient(135deg,var(--blossom-pink) 0%,var(--blossom-light) 100%);
    border-radius:50% 50% 50% 0;
    opacity:.65;
    animation:blossomFall linear infinite;
    filter:drop-shadow(0 4px 10px rgba(255,183,197,.18));
  }
  .butterfly{
    position:absolute;
    width:24px;height:16px;
    background:linear-gradient(135deg,#ff6b6b 0%,#ffd93d 100%);
    border-radius:50%;
    opacity:.85;
    animation:butterflyFlutter 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.12));
  }
  .butterfly::before,.butterfly::after{content:"";position:absolute;width:16px;height:24px;background:inherit;border-radius:50%;top:-4px}
  .butterfly::before{left:-8px;transform:rotate(45deg)}
  .butterfly::after{right:-8px;transform:rotate(-45deg)}

  /* ---------- HUD (Top Bar) ---------- */
  .hud{
    position:fixed;
    top:var(--hud-top);
    left:50%;
    transform:translateX(-50%);
    width:min(980px, calc(100vw - 24px - var(--safe-left) - var(--safe-right)));
    z-index:1200;
    pointer-events:none;
  }

  .hud-wrap{
    pointer-events:auto;
    display:grid;
    grid-template-columns: 1fr auto 1fr auto 1fr auto;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:999px;
    background:
      radial-gradient(800px 220px at 50% 0%, rgba(255,215,0,.18) 0%, rgba(255,215,0,0) 55%),
      linear-gradient(135deg, rgba(255,248,225,.92) 0%, rgba(255,232,184,.90) 100%);
    border:3px solid rgba(93,78,55,.85);
    box-shadow: var(--shadow-soft), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.08);
    backdrop-filter: blur(10px);
  }

  .hud-item{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }

  .hud-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.35rem;
    background:rgba(255,255,255,.55);
    border:2px solid rgba(93,78,55,.45);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.6);
  }

  .hud-meta{min-width:0; line-height:1;}
  .hud-label{
    font-family:"Patrick Hand",cursive;
    font-size:.92rem;
    letter-spacing:.6px;
    color:rgba(43,36,24,.85);
    text-transform:uppercase;
  }
  .hud-value{
    font-family:"Fredoka One",cursive;
    font-size:2.0rem;
    color:var(--pooh-red);
    text-shadow:2px 2px 0 rgba(0,0,0,.12);
    margin-top:2px;
    font-variant-numeric: tabular-nums;
  }

  .hud-score .hud-value{
    color:var(--honey-gold);
    text-shadow: 3px 3px 0 rgba(93,78,55,.35), 0 0 22px rgba(255,165,0,.35);
  }

  .hud-sep{
    width:1px;
    height:44px;
    background:linear-gradient(180deg, rgba(93,78,55,0) 0%, rgba(93,78,55,.28) 40%, rgba(93,78,55,.28) 60%, rgba(93,78,55,0) 100%);
  }

  /* Achievements "pill button" inside HUD */
  .hud-actions{
    grid-column: 6 / 7;
    justify-self:end;
    display:flex;
    align-items:center;
  }

  .hud-ach{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(135deg, rgba(77,150,255,.92) 0%, rgba(42,110,255,.92) 100%);
    border:2px solid rgba(255,255,255,.82);
    box-shadow: 0 10px 22px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25);
    color:white;
    font-family:"Fredoka One",cursive;
    pointer-events:auto;
    transition: transform var(--transition-speed) ease, filter var(--transition-speed) ease;
  }
  .hud-ach:hover{transform:translateY(-2px);filter:saturate(1.05)}
  .hud-ach:active{transform:translateY(1px)}

  .hud-ach-icon{font-size:1.25rem}
  .hud-ach-text{display:flex; flex-direction:column; align-items:flex-start; line-height:1.05}
  .hud-ach-label{
    font-size:.75rem;
    letter-spacing:1.1px;
    text-transform:uppercase;
    opacity:.92;
    font-family:"Patrick Hand",cursive;
  }
  .hud-ach-value{
    font-size:1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .hud-ach-caret{font-size:1.5rem; opacity:.9}

  /* ---------- Canvas Container ---------- */
  .game-container{
    position:relative;
    margin-top:calc(var(--hud-reserve) + var(--safe-top));
    width:clamp(var(--board-min-w), 92vw, var(--board-max-w));
    aspect-ratio:420/700;
    height:auto;
    max-height:calc(100dvh - (var(--hud-reserve) + 170px + var(--safe-top) + var(--safe-bottom)));
    animation:float 6.3s ease-in-out infinite;
    filter:drop-shadow(0 24px 52px rgba(0,0,0,.26)) drop-shadow(0 0 22px rgba(255,215,0,.18));
    transition:filter var(--transition-speed) ease, transform var(--transition-speed) ease;
    z-index:10;
    contain:layout paint style;
    border-radius:var(--radius-xl);
  }
  .game-container::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:calc(var(--radius-xl) + 10px);
    background:radial-gradient(800px 420px at 50% 0%, rgba(255,215,0,.22) 0%, rgba(255,215,0,0) 55%);
    filter:blur(1px);
    z-index:0;
    pointer-events:none;
  }

  #honey-game{
    width:100%;
    height:100%;
    display:block;
    background:linear-gradient(180deg,#0a3d62 0%,#1e6fa8 22%,#87ceeb 42%,#b0e0e6 62%,#a8d5a3 82%,#7cb342 100%);
    border-radius:var(--radius-xl);
    border:7px solid var(--wood-brown);
    box-shadow:
      0 0 0 4px rgba(139,115,85,.75),
      var(--shadow-strong),
      inset 0 -10px 26px rgba(0,0,0,.22),
      inset 0 10px 24px rgba(255,255,255,.12);
    touch-action:none;
    cursor:grab;
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  #honey-game:active{cursor:grabbing}

  /* ---------- Utility ---------- */
  .hidden{display:none!important}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- Honey Cursor ---------- */
  .honey-cursor{
    position:fixed;
    width:46px;height:46px;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:transform .08s ease;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));
    display:none;
    mix-blend-mode:multiply;
  }
  .honey-cursor.active{display:block}
  .honey-cursor .spoon{
    width:100%;
    height:100%;
    background:radial-gradient(circle at 30% 30%, #ffd700 0%, #ffa500 62%, #da9100 100%);
    clip-path:polygon(0% 45%, 62% 45%, 62% 30%, 100% 50%, 62% 70%, 62% 55%, 0% 55%);
    transform-origin:60% 50%;
    animation:honeyDrip 2s infinite;
    border-radius:10px;
  }

  /* ---------- Floating UI popups ---------- */
  .score-popup{
    position:absolute;
    font-weight:900;
    font-size:2.2rem;
    color:var(--honey-gold);
    pointer-events:none;
    text-shadow:4px 4px 0 var(--wood-brown), -2px -2px 0 rgba(255,255,255,.9), 0 0 30px rgba(255,165,0,.8);
    animation:popupFloat 1.45s ease-out forwards;
    z-index:100;
    font-family:var(--font-display);
    letter-spacing:1px;
    background:rgba(255,255,255,.06);
    padding:6px 12px;
    border-radius:14px;
    backdrop-filter:blur(6px);
  }
  .honey-word{
    position:absolute;
    font-size:1.55rem;
    font-weight:900;
    color:var(--honey-gold);
    text-shadow:3px 3px 0 var(--wood-brown), -1px -1px 0 rgba(255,255,255,.9), 0 0 22px rgba(255,165,0,.75);
    pointer-events:none;
    animation:floatWord 2.45s ease-out forwards;
    z-index:101;
    font-family:var(--font-body);
    text-align:center;
    padding:8px 14px;
    background:rgba(255,255,255,.12);
    border-radius:14px;
    border:2px solid rgba(255,255,255,.18);
    backdrop-filter:blur(7px);
  }

  /* ---------- Overlays ---------- */
  .character-select-overlay,.achievements-overlay,.overlay{
    position:absolute;
    inset:0;
    background:
      radial-gradient(900px 520px at 50% 0%, rgba(255,215,0,.22) 0%, rgba(255,215,0,0) 55%),
      linear-gradient(135deg, rgba(255,248,225,.97) 0%, rgba(255,232,184,.97) 55%, rgba(255,216,155,.97) 100%);
    backdrop-filter:blur(18px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    text-align:center;
    z-index:5000;
    animation:slideIn .55s ease-out;
    border:10px solid var(--wood-brown);
    box-shadow:
      inset 0 0 90px rgba(212,165,116,.28),
      0 0 70px rgba(0,0,0,.20);
    padding:calc(28px + var(--safe-top)) 28px calc(24px + var(--safe-bottom)) 28px;
    overflow:hidden;
  }

  /* Allow scroll for long overlays without blowing up layout */
  .achievements-overlay{padding:calc(20px + var(--safe-top)) 18px calc(18px + var(--safe-bottom)) 18px}
  .achievements-content{
    background:linear-gradient(135deg, rgba(255,248,225,.985) 0%, rgba(255,232,184,.985) 100%);
    border-radius:24px;
    padding:18px;
    max-width:580px;
    width:min(94vw, 580px);
    max-height:min(78vh, 720px);
    overflow:auto;
    border:7px solid var(--wood-brown);
    box-shadow:0 20px 60px rgba(0,0,0,.42);
    -webkit-overflow-scrolling:touch;
  }
  .achievements-content::-webkit-scrollbar{width:10px}
  .achievements-content::-webkit-scrollbar-thumb{background:rgba(93,78,55,.35);border-radius:10px}

  .overlay h1{
    font-size:3.7rem;
    font-weight:900;
    color:var(--pooh-red);
    text-shadow:5px 5px 0 var(--pooh-bear), 7px 7px 0 var(--wood-brown);
    letter-spacing:1.8px;
    line-height:1.05;
    animation:bounce 3.2s ease-in-out infinite;
    font-family:var(--font-display);
    margin-bottom:6px;
  }
  .overlay h2{
    font-size:2.2rem;
    color:var(--wood-brown);
    font-family:var(--font-display);
    margin-bottom:8px
  }
  .subtitle{
    font-size:1.22rem;
    color:var(--ink);
    text-shadow:1px 1px 0 rgba(255,255,255,.55);
    font-family:var(--font-body);
    max-width:560px;
    line-height:1.35;
    opacity:.92;
  }

  /* ---------- Buttons ---------- */
  .btn{
    background:linear-gradient(135deg,var(--pooh-red) 0%,#c62828 100%);
    border:5px solid var(--wood-brown);
    padding:16px 38px;
    font-size:1.18rem;
    font-weight:900;
    border-radius:60px;
    cursor:pointer;
    box-shadow:0 8px 0 #8b2020, 0 16px 30px rgba(0,0,0,.28), inset 0 4px 0 rgba(255,255,255,.35);
    color:white;
    text-transform:uppercase;
    letter-spacing:1.8px;
    transition:transform var(--transition-speed) ease, filter var(--transition-speed) ease;
    position:relative;
    font-family:var(--font-display);
    text-shadow:2px 2px 0 rgba(0,0,0,.25);
    overflow:hidden;
    min-height:56px;
  }
  .btn:hover{transform:translateY(-3px);filter:saturate(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn-secondary{
    background:linear-gradient(135deg,var(--wood-light) 0%,var(--wood-brown) 100%);
    box-shadow:0 8px 0 #4a3a24, 0 16px 28px rgba(0,0,0,.24), inset 0 4px 0 rgba(255,255,255,.22);
    padding:14px 28px;
    font-size:1.05rem;
    letter-spacing:1.2px;
  }

  .final-score{
    font-size:4.6rem;
    font-weight:900;
    color:var(--honey-gold);
    text-shadow:6px 6px 0 var(--wood-brown), -3px -3px 0 rgba(255,255,255,.95), 0 0 40px rgba(255,165,0,.75);
    animation:bounce 2.4s ease-in-out infinite;
    margin:10px 0;
    font-family:var(--font-display);
  }

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin:18px 0 10px;
    width:100%;
    max-width:560px
  }
  .stat-box{
    background:rgba(255,255,255,.88);
    border:4px solid var(--wood-brown);
    padding:14px;
    border-radius:18px;
    box-shadow:var(--shadow-soft);
  }
  .stat-box-label{
    font-size:.9rem;
    opacity:.9;
    margin-bottom:6px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--wood-brown);
    font-family:var(--font-body);
  }
  .stat-box-value{
    font-size:2rem;
    font-weight:900;
    color:var(--pooh-red);
    line-height:1;
    font-family:var(--font-display);
  }

  /* ---------- Character Select ---------- */
  .character-select-title{
    font-size:2.25rem;
    font-weight:900;
    color:var(--pooh-red);
    text-shadow:3px 3px 0 var(--pooh-bear);
    font-family:var(--font-display);
  }
  .character-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    max-width:560px;
    width:100%;
  }
  .character-card{
    background:rgba(255,255,255,.88);
    border:4px solid var(--wood-brown);
    border-radius:20px;
    padding:14px;
    cursor:pointer;
    transition:transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease, border-color var(--transition-speed) ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;

<script>
(() => {
  "use strict";

  /* ============================================================
     INIT GUARD
  ============================================================ */
  if (window.__POOH_HONEY_HUNT__) return;
  window.__POOH_HONEY_HUNT__ = true;

  /* ============================================================
     SAFE STORAGE (SANDBOX SAFE)
  ============================================================ */
  const Store = (() => {
    const mem = new Map();
    let hasLS = false;
    try {
      localStorage.setItem("__t__", "1");
      localStorage.removeItem("__t__");
      hasLS = true;
    } catch {}

    return {
      get(k, d = null) {
        if (hasLS) { try { return localStorage.getItem(k) ?? d; } catch {} }
        return mem.has(k) ? mem.get(k) : d;
      },
      set(k, v) {
        const sv = String(v);
        if (hasLS) { try { localStorage.setItem(k, sv); return; } catch {} }
        mem.set(k, sv);
      }
    };
  })();

  /* ============================================================
     DOM HELPERS
  ============================================================ */
  const $ = id => document.getElementById(id);
  const on = (id, ev, fn, opts) => { const el = $(id); el && el.addEventListener(ev, fn, opts); };

  /* ============================================================
     SETTINGS / FLAGS
  ============================================================ */
  const Motion = (() => {
    const mq = window.matchMedia?.("(prefers-reduced-motion: reduce)");
    let reduced = !!mq?.matches;
    mq?.addEventListener?.("change", () => { reduced = !!mq.matches; });
    return { get reduced() { return reduced; } };
  })();

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ============================================================
     APP STATE (SINGLE SOURCE OF TRUTH)
  ============================================================ */
  const AppState = {
    overlay: "start",
    paused: true,          // logical pause (overlays, user pause)
    hiddenPaused: false,   // page/tab hidden pause
    score: 0,
    streak: 0,
    lives: 3,
    character: Store.get("character", "pooh"),
    soundOn: Store.get("sound", "on") === "on",
    weather: Store.get("weather", "clear") || "clear"
  };

  /* ============================================================
     OVERLAY CONTROLLER (DETERMINISTIC)
  ============================================================ */
  const Overlays = (() => {
    const map = {
      start: $("start-overlay"),
      pause: $("pause-overlay"),
      help: $("help-overlay"),
      gameover: $("gameover-overlay"),
      achievements: $("achievements-overlay"),
      character: $("character-select-overlay")
    };

    function closeAll() {
      Object.values(map).forEach(o => o && o.classList.add("hidden"));
      document.body.classList.remove("overlay-open");
      AppState.overlay = null;
    }

    function open(name) {
      closeAll();
      const el = map[name];
      if (!el) return;

      AppState.overlay = name;
      AppState.paused = true;

      el.classList.remove("hidden");
      document.body.classList.add("overlay-open");

      // Pause heavy systems while overlays are open
      Weather.setEnabled(false);

      const f = el.querySelector("button,[href],input,[tabindex]:not([tabindex='-1'])");
      f && requestAnimationFrame(() => f.focus());
    }

    function close(name) {
      const el = map[name];
      if (!el) return;

      el.classList.add("hidden");
      AppState.overlay = null;
      document.body.classList.remove("overlay-open");

      // If nothing else opened, re-enable ambient systems
      if (!AppState.paused && !AppState.hiddenPaused) Weather.setEnabled(!Motion.reduced);
    }

    return { open, close, closeAll };
  })();

  /* ============================================================
     AUDIO CONTROLLER (SAFE STUB)
  ============================================================ */
  const Audio = (() => {
    function syncButton() {
      const btn = $("sound-toggle-btn");
      if (!btn) return;
      btn.innerHTML = AppState.soundOn
        ? '<i class="fas fa-volume-up"></i>'
        : '<i class="fas fa-volume-mute"></i>';
    }
    function toggle() {
      AppState.soundOn = !AppState.soundOn;
      Store.set("sound", AppState.soundOn ? "on" : "off");
      syncButton();
    }
    return { toggle, syncButton };
  })();

  /* ============================================================
     HUD / UI
  ============================================================ */
  const UI = (() => {
    function updateHUD() {
      $("score").textContent = AppState.score;
      $("streak").textContent = AppState.streak;
      $("lives").textContent = AppState.lives;
      const ac = $("achievements-count");
      if (ac) ac.textContent = "0/10"; // placeholder until ach system is wired
    }

    function setWeatherActive() {
      document.querySelectorAll(".weather-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.weather === AppState.weather);
      });
    }

    function bind() {
      on("start-btn", "click", () => { Overlays.close("start"); Game.start(); });
      on("pause-btn", "click", () => Overlays.open("pause"));
      on("resume-btn", "click", () => { Overlays.close("pause"); Game.resume(); });
      on("quit-btn", "click", () => { Game.reset(); Overlays.open("start"); });
      on("restart-btn", "click", () => { Game.reset(); Game.start(); });

      on("help-btn", "click", () => Overlays.open("help"));
      on("close-help-btn", "click", () => Overlays.close("help"));

      on("achievements-btn", "click", () => Overlays.open("achievements"));
      on("view-achievements-btn", "click", () => Overlays.open("achievements"));
      on("close-achievements-btn", "click", () => Overlays.close("achievements"));
      on("close-achievements-btn-2", "click", () => Overlays.close("achievements"));

      on("select-character-btn", "click", () => Overlays.open("character"));
      on("back-to-menu-btn", "click", () => Overlays.open("start"));

      on("sound-toggle-btn", "click", Audio.toggle);

      // Character selection
      document.querySelectorAll(".character-card").forEach(btn => {
        btn.addEventListener("click", () => {
          AppState.character = btn.dataset.character || "pooh";
          Store.set("character", AppState.character);
          document.querySelectorAll(".character-card").forEach(b => b.classList.remove("selected"));
          btn.classList.add("selected");
        }, { passive: true });
      });

      on("start-with-character-btn", "click", () => {
        Overlays.close("character");
        Game.start();
      });

      // Weather drawer + buttons
      document.querySelectorAll(".weather-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          AppState.weather = btn.dataset.weather || "clear";
          Store.set("weather", AppState.weather);
          setWeatherActive();
          Weather.setMode(AppState.weather);
        }, { passive: true });
      });

      on("weather-toggle", "click", () => $("weather-drawer")?.classList.add("open"));
      on("weather-close", "click", () => $("weather-drawer")?.classList.remove("open"));

      // Share (safe no-op with feedback)
      on("share-btn", "click", async () => {
        const text = `I scored ${AppState.score} in Pooh’s Honey Hunt! 🍯`;
        try {
          if (navigator.share) await navigator.share({ text });
          else if (navigator.clipboard) await navigator.clipboard.writeText(text);
        } catch {}
      });

      // Escape closes overlays (except start)
      window.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (AppState.overlay && AppState.overlay !== "start") Overlays.closeAll();
      });
    }

    return { bind, updateHUD, setWeatherActive };
  })();

  /* ============================================================
     WEATHER PARTICLE SYSTEM (POOLED, FAST)
  ============================================================ */
  const Weather = (() => {
    const root = $("weather-effects") || (() => {
      // If your HTML doesn't include it, create it silently (no CSS changes required)
      const d = document.createElement("div");
      d.id = "weather-effects";
      document.body.appendChild(d);
      return d;
    })();

    let enabled = !Motion.reduced;
    let mode = AppState.weather;

    // Pool
    const MAX = 70; // keep this modest for mobile
    const pool = [];
    const active = [];

    function makeParticle() {
      const el = document.createElement("div");
      el.style.position = "absolute";
      el.style.left = "0px";
      el.style.top = "-60px";
      el.style.willChange = "transform, opacity";
      el.style.pointerEvents = "none";
      el.style.opacity = "0";
      root.appendChild(el);
      return { el, x:0, y:0, vx:0, vy:0, rot:0, vr:0, life:0, max:0, s:1 };
    }

    for (let i=0;i<MAX;i++) pool.push(makeParticle());

    function styleFor(p) {
      // minimal, consistent styling; no expensive filters
      const el = p.el;
      const m = mode;

      el.style.borderRadius = "999px";
      el.style.width = "6px";
      el.style.height = "14px";
      el.style.background = "rgba(255,255,255,.75)";

      if (m === "snow") {
        el.style.width = "8px";
        el.style.height = "8px";
        el.style.borderRadius = "50%";
        el.style.background = "rgba(255,255,255,.85)";
      } else if (m === "leaves") {
        el.style.width = "10px";
        el.style.height = "14px";
        el.style.borderRadius = "6px 10px 6px 10px";
        el.style.background = "rgba(255,165,0,.7)";
      } else if (m === "blossoms") {
        el.style.width = "10px";
        el.style.height = "10px";
        el.style.borderRadius = "50% 50% 50% 0";
        el.style.background = "rgba(255,183,197,.75)";
      } else if (m === "rain") {
        el.style.width = "5px";
        el.style.height = "16px";
        el.style.borderRadius = "999px";
        el.style.background = "rgba(255,255,255,.65)";
      } else {
        // clear
        el.style.opacity = "0";
      }
    }

    function spawn() {
      if (!enabled) return;
      if (mode === "clear") return;
      if (!pool.length) return;

      const p = pool.pop();
      styleFor(p);

      const w = window.innerWidth;
      p.x = Math.random() * w;
      p.y = -60;
      p.rot = Math.random() * 360;
      p.vr = (Math.random() * 120 - 60);

      if (mode === "rain") {
        p.vx = (Math.random() * 10 - 5);
        p.vy = 900 + Math.random() * 600;
        p.s = 1;
        p.max = 0.9 + Math.random() * 0.5;
      } else if (mode === "snow") {
        p.vx = (Math.random() * 80 - 40);
        p.vy = 160 + Math.random() * 130;
        p.s = 0.7 + Math.random() * 0.8;
        p.max = 0.6 + Math.random() * 0.5;
      } else if (mode === "leaves") {
        p.vx = (Math.random() * 160 - 80);
        p.vy = 240 + Math.random() * 180;
        p.s = 0.7 + Math.random() * 0.8;
        p.max = 0.5 + Math.random() * 0.5;
      } else if (mode === "blossoms") {
        p.vx = (Math.random() * 120 - 60);
        p.vy = 220 + Math.random() * 160;
        p.s = 0.7 + Math.random() * 0.8;
        p.max = 0.5 + Math.random() * 0.5;
      }

      p.life = 0;
      p.el.style.opacity = String(p.max);
      active.push(p);
    }

    function update(dt) {
      if (!enabled || mode === "clear") return;

      // Spawn rate tuned by mode
      const spawnCount =
        mode === "rain" ? 4 :
        mode === "snow" ? 2 :
        mode === "leaves" ? 2 :
        mode === "blossoms" ? 2 : 0;

      for (let i=0;i<spawnCount;i++) spawn();

      const h = window.innerHeight;

      for (let i=active.length - 1; i>=0; i--) {
        const p = active[i];

        p.life += dt;
        p.x += p.vx * (dt / 1000);
        p.y += p.vy * (dt / 1000);
        p.rot += p.vr * (dt / 1000);

        // gentle drift for snow/petals/leaves
        if (mode !== "rain") {
          p.x += Math.sin((p.life / 700) + p.rot) * (dt / 1000) * 30;
        }

        p.el.style.transform = `translate3d(${p.x}px, ${p.y}px, 0) rotate(${p.rot}deg) scale(${p.s})`;

        if (p.y > h + 80) {
          p.el.style.opacity = "0";
          active.splice(i, 1);
          pool.push(p);
        }
      }
    }

    function setMode(m) {
      mode = m || "clear";
      // Clear existing particles fast
      for (let i=active.length - 1; i>=0; i--) {
        const p = active[i];
        p.el.style.opacity = "0";
        active.splice(i, 1);
        pool.push(p);
      }
    }

    function setEnabled(v) {
      enabled = !!v && !Motion.reduced;
      if (!enabled) setMode("clear");
      else setMode(AppState.weather);
    }

    // Expose update hook for the game loop
    return { update, setMode, setEnabled };
  })();

  /* ============================================================
     GAME ENGINE (STABLE LOOP + SMOOTH INPUT + DPR SCALING)
  ============================================================ */
  const Game = (() => {
    const canvas = $("honey-game");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });

    // logical size (CSS/HTML uses 420x700)
    const BASE_W = 420;
    const BASE_H = 700;

    let running = false;
    let last = 0;

    // Pooh movement smoothing
    let poohTargetX = BASE_W / 2;
    let poohX = BASE_W / 2;
    const poohY = BASE_H - 90;
    let dragging = false;

    // DPS / performance throttles
    let accumulated = 0;

    function setPaused(v) {
      AppState.paused = !!v;
      if (AppState.paused) Weather.setEnabled(false);
      else Weather.setEnabled(!AppState.hiddenPaused && !Motion.reduced);
    }

    function resizeCanvas() {
      // Keep game logic in BASE coords; scale by DPR for crispness
      const dpr = clamp(window.devicePixelRatio || 1, 1, 2); // cap DPR to avoid overwork
      canvas.width = Math.floor(BASE_W * dpr);
      canvas.height = Math.floor(BASE_H * dpr);
      canvas.style.width = BASE_W + "px";
      canvas.style.height = BASE_H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function reset() {
      AppState.score = 0;
      AppState.streak = 0;
      AppState.lives = 3;
      UI.updateHUD();
    }

    function start() {
      setPaused(false);
      running = true;
      last = performance.now();
      requestAnimationFrame(loop);
    }

    function resume() {
      setPaused(false);
      last = performance.now();
    }

    function stop() {
      running = false;
      setPaused(true);
    }

    function loop(ts) {
      if (!running) return;

      const dt = Math.min(32, ts - last);
      last = ts;

      // If tab hidden, do minimal work
      if (!AppState.paused && !AppState.hiddenPaused) {
        update(dt);
        render();
      } else {
        // still allow overlay/hidden to keep canvas stable but avoid heavy updates
        accumulated += dt;
        if (accumulated > 250) {
          accumulated = 0;
          render(); // occasional render (keeps it from looking dead after resize)
        }
      }

      requestAnimationFrame(loop);
    }

    function update(dt) {
      // Smooth Pooh movement (lerp speed tuned for responsiveness)
      const t = 1 - Math.pow(0.001, dt / 16); // framerate-independent smoothing
      poohX = lerp(poohX, poohTargetX, clamp(t, 0.08, 0.28));

      // Weather update (pooled, light)
      Weather.update(dt);

      // TODO Phase 3: honey + bees spawn/update/collisions
    }

    function render() {
      // Clear
      ctx.clearRect(0, 0, BASE_W, BASE_H);

      // Simple ground shading (cheap, gives depth)
      ctx.fillStyle = "rgba(0,0,0,0.06)";
      ctx.fillRect(0, BASE_H - 140, BASE_W, 140);

      // Pooh placeholder (bigger + more “present” than Phase 1)
      // (Phase 3 will replace with proper storybook art, but this already feels better.)
      const bodyR = 54;
      const headR = 42;

      // Body
      ctx.fillStyle = "#d4a574";
      ctx.beginPath();
      ctx.arc(poohX, poohY, bodyR, 0, Math.PI * 2);
      ctx.fill();

      // Head
      ctx.beginPath();
      ctx.arc(poohX, poohY - 70, headR, 0, Math.PI * 2);
      ctx.fill();

      // Ears
      ctx.beginPath();
      ctx.arc(poohX - 26, poohY - 104, 16, 0, Math.PI * 2);
      ctx.arc(poohX + 26, poohY - 104, 16, 0, Math.PI * 2);
      ctx.fill();

      // Shirt hint (Pooh red)
      ctx.fillStyle = "#e63946";
      ctx.beginPath();
      ctx.ellipse(poohX, poohY - 6, 56, 30, 0, 0, Math.PI);
      ctx.fill();

      // Outline (cheap, helps cohesion)
      ctx.strokeStyle = "rgba(93,78,55,.45)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(poohX, poohY, bodyR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(poohX, poohY - 70, headR, 0, Math.PI * 2);
      ctx.stroke();
    }

    /* ---------- INPUT: pointer capture + minimal work ---------- */
    function pointerToGameX(e) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * (BASE_W / r.width);
      return clamp(x, 60, BASE_W - 60);
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (AppState.paused || AppState.hiddenPaused) return;
      dragging = true;
      canvas.setPointerCapture?.(e.pointerId);
      poohTargetX = pointerToGameX(e);
    }, { passive: true });

    canvas.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      poohTargetX = pointerToGameX(e);
    }, { passive: true });

    const endDrag = (e) => {
      dragging = false;
      try { canvas.releasePointerCapture?.(e.pointerId); } catch {}
    };
    canvas.addEventListener("pointerup", endDrag, { passive: true });
    canvas.addEventListener("pointercancel", endDrag, { passive: true });

    window.addEventListener("resize", () => {
      resizeCanvas();
      render();
    }, { passive: true });

    // Visibility pause (big perf win)
    document.addEventListener("visibilitychange", () => {
      AppState.hiddenPaused = document.hidden;
      if (document.hidden) {
        Weather.setEnabled(false);
      } else {
        Weather.setEnabled(!AppState.paused && !Motion.reduced);
        last = performance.now();
      }
    });

    // init
    resizeCanvas();

    return { start, resume, reset, stop, setPaused };
  })();

  /* ============================================================
     BOOT
  ============================================================ */
  document.addEventListener("DOMContentLoaded", () => {
    // Sync UI defaults
    Audio.syncButton();
    UI.bind();
    UI.updateHUD();

    // Apply stored character selection styling
    document.querySelectorAll(".character-card").forEach(b => {
      b.classList.toggle("selected", (b.dataset.character || "pooh") === AppState.character);
    });

    // Weather stored state
    UI.setWeatherActive();
    Weather.setMode(AppState.weather);
    Weather.setEnabled(!Motion.reduced); // ambient enabled only when not reduced-motion

    // Start at menu overlay
    Overlays.open("start");
  });

})();
</script>
