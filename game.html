<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <title>Pooh's Enhanced Honey Hunt - Complete Edition</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
      <meta name="theme-color" content="#d4a574" />
      <meta name="description" content="Help Pooh catch honey pots in the Hundred Acre Wood! Now with achievements, character selection, weather effects, and more!" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet" />
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
      <link rel="stylesheet" href="styles-game.css">
   </head>
   <body>
      <!-- Background -->
      <div class="background-layer" aria-hidden="true">
         <div class="cloud cloud-1"></div>
         <div class="cloud cloud-2"></div>
         <div class="cloud cloud-3"></div>
      </div>
      <!-- Honey Cursor -->
      <div class="honey-cursor" id="honey-cursor">
         <div class="spoon"></div>
      </div>
      <main id="game-root">
         <!-- Sound -->
         <div class="sound-controls">
            <button class="sound-btn" id="sound-toggle-btn" aria-label="Toggle sound">
            <i class="fas fa-volume-up"></i>
            </button>
         </div>
         <!-- Share -->
         <button class="share-btn" id="share-btn" aria-label="Share score">
         <i class="fas fa-share-alt"></i>
         </button>
         <!-- Game Controls -->
         <div class="game-controls">
            <button class="control-btn pause" id="pause-btn"><i class="fas fa-pause"></i></button>
            <button class="control-btn help" id="help-btn"><i class="fas fa-question"></i></button>
         </div>
         <!-- Weather Toggle -->
         <button class="weather-toggle" id="weather-toggle">🌦️</button>
         <!-- Weather Drawer -->
         <aside class="weather-drawer" id="weather-drawer">
            <div class="weather-drawer-header">
               <span class="weather-title">Weather</span>
               <button class="weather-close" id="weather-close">✕</button>
            </div>
            <div class="weather-drawer-buttons">
               <button class="weather-btn" data-weather="clear">☀️</button>
               <button class="weather-btn" data-weather="rain">🌧️</button>
               <button class="weather-btn" data-weather="snow">❄️</button>
               <button class="weather-btn" data-weather="leaves">🍂</button>
               <button class="weather-btn" data-weather="blossoms">🌸</button>
            </div>
         </aside>
         <!-- HUD -->
         <header class="hud">
            <div class="hud-wrap">
               <div class="hud-item hud-score">
                  <div class="hud-icon">🍯</div>
                  <div class="hud-meta">
                     <div class="hud-label">Score</div>
                     <div class="hud-value" id="score">0</div>
                  </div>
               </div>
               <div class="hud-sep"></div>
               <div class="hud-item">
                  <div class="hud-icon">🔥</div>
                  <div class="hud-meta">
                     <div class="hud-label">Streak</div>
                     <div class="hud-value" id="streak">0</div>
                  </div>
               </div>
               <div class="hud-sep"></div>
               <div class="hud-item">
                  <div class="hud-icon">❤️</div>
                  <div class="hud-meta">
                     <div class="hud-label">Lives</div>
                     <div class="hud-value" id="lives">3</div>
                  </div>
               </div>
               <div class="hud-actions">
                  <button class="hud-ach" id="achievements-btn">
                  <span class="hud-ach-icon">🏆</span>
                  <span class="hud-ach-text">
                  <span class="hud-ach-label">Achievements</span>
                  <span class="hud-ach-value" id="achievements-count">0/10</span>
                  </span>
                  <span class="hud-ach-caret">›</span>
                  </button>
               </div>
            </div>
         </header>
         <!-- Game Canvas -->
         <div class="game-container">
            <canvas id="honey-game" width="420" height="700"></canvas>
         </div>
         <!-- ================= START ================= -->
         <div class="overlay" id="start-overlay">
            <div class="pooh-intro"></div>
            <p class="story-line">Pooh is waiting for honey…</p>
            <button class="btn" id="start-btn">
            🍯 Start Collecting Honey
            </button>
            <div class="start-links">
               <button class="link-btn" id="select-character-btn">Choose Character</button>
               <button class="link-btn" id="view-achievements-btn">Achievements</button>
            </div>
         </div>
         <!-- ================= PAUSE ================= -->
         <div class="overlay hidden" id="pause-overlay">
            <h2>⏸️ Taking a Rest</h2>
            <p class="subtitle">Paused</p>
            <button class="btn" id="resume-btn">Resume</button>
            <button class="btn btn-secondary" id="quit-btn">Return to Menu</button>
         </div>
         <!-- ================= HELP ================= -->
         <div class="overlay hidden" id="help-overlay">
            <h2>How to Play</h2>
            <p class="subtitle">
               Drag Pooh to catch honey.<br>
               Avoid bees.
            </p>
            <button class="btn btn-secondary" id="close-help-btn">Back</button>
         </div>
         <!-- ================= GAME OVER ================= -->
         <div class="overlay hidden" id="gameover-overlay">
            <h2>Oh Bother!</h2>
            <div class="final-score" id="final-score">0</div>
            <button class="btn" id="restart-btn">Play Again 🍯</button>
         </div>
         <!-- ================= CHARACTER SELECT ================= -->
         <div class="character-select-overlay hidden" id="character-select-overlay">
            <div class="char-shell">
               <div class="char-top">
                  <h2 class="char-title">Choose Your Character</h2>
                  <button class="char-x" id="back-to-menu-btn">✕</button>
               </div>
               <div class="char-grid">
                  <button class="character-card" data-character="pooh">🐻 Pooh</button>
                  <button class="character-card" data-character="piglet">🐷 Piglet</button>
                  <button class="character-card" data-character="tigger">🐯 Tigger</button>
                  <button class="character-card" data-character="rabbit">🐰 Rabbit</button>
               </div>
               <div class="char-bottom">
                  <button class="btn" id="start-with-character-btn">Start 🍯</button>
               </div>
            </div>
         </div>
         <!-- ================= ACHIEVEMENTS ================= -->
         <div class="achievements-overlay hidden" id="achievements-overlay">
            <div class="achievements-shell">
               <div class="achievements-top">
                  <h2 class="ach-title">Achievements</h2>
                  <button class="ach-x" id="close-achievements-btn">✕</button>
               </div>
               <div class="achievements-listWrap">
                  <div id="achievements-list"></div>
               </div>
               <div class="achievements-bottom">
                  <button class="btn btn-secondary" id="close-achievements-btn-2">Back</button>
               </div>
            </div>
         </div>
      </main>

  <script>
(() => {
  "use strict";
  if (window.__POOH_HONEY_HUNT_VNEXT__) return;
  window.__POOH_HONEY_HUNT_VNEXT__ = true;

  /* ======================= DOM HELPERS ======================= */
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ======================= SAFE STORAGE ======================= */
  const Store = (() => {
    const mem = new Map();
    const hasLS = (() => {
      try {
        const t="__t__";
        localStorage.setItem(t,"1"); localStorage.removeItem(t);
        return true;
      } catch { return false; }
    })();

    return {
      get(k, fallback=null){
        if (hasLS) { try { const v = localStorage.getItem(k); return v===null ? fallback : v; } catch {} }
        return mem.has(k) ? mem.get(k) : fallback;
      },
      set(k, v){
        if (hasLS) { try { localStorage.setItem(k, String(v)); return; } catch {} }
        mem.set(k, String(v));
      }
    };
  })();

  /* ======================= APP STATE ======================= */
  const AppState = {
    running: false,
    paused: false,

    score: 0,
    best: Number(Store.get("bestScore","0")||0),
    streak: 0,
    lives: 3,

    // time
    timeMs: 0,

    // prefs
    soundOn: Store.get("sound","on") !== "off",
    hapticsOn: Store.get("haptics","on") !== "off",
    character: Store.get("character","pooh") || "pooh",

    // combo
    combo: { mult: 1, timer: 0, tier: 0 },

    // achievements
    achievements: (() => {
      try { return JSON.parse(Store.get("achievements","{}")||"{}"); }
      catch { return {}; }
    })(),

    // moment framing
    timeScale: 1,

    // stats
    maxStreak: 0,
    honeyCaught: 0,
    beesHit: 0
  };

  const persistAchievements = () => {
    try { Store.set("achievements", JSON.stringify(AppState.achievements||{})); } catch {}
  };

  const vibrate = (pattern=20) => {
    try { if (AppState.hapticsOn && navigator.vibrate) navigator.vibrate(pattern); } catch {}
  };

  /* ======================= AUDIO ======================= */
  const Audio = (() => {
    let ctx=null, master=null;

    function init() {
      if (!AppState.soundOn) return;
      if (ctx) return;
      try{
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = 0.22;
        master.connect(ctx.destination);
      } catch {
        ctx=null; master=null;
      }
    }

    function beep(freq=440, dur=0.06, gain=0.07, type="sine") {
      if (!AppState.soundOn || !ctx || !master) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur);
    }

    const sfx = {
      collect() { beep(680, 0.05, 0.08, "triangle"); },
      combo() { beep(880, 0.08, 0.08, "sawtooth"); },
      hit() { beep(160, 0.10, 0.09, "square"); },
      power() { beep(520, 0.08, 0.08, "sine"); }
    };

    function toggle(){
      AppState.soundOn = !AppState.soundOn;
      Store.set("sound", AppState.soundOn ? "on" : "off");
      if (AppState.soundOn) init();
    }

    return { init, toggle, ...sfx };
  })();

  /* ======================= OVERLAYS ======================= */
  const Overlays = (() => {
    const map = {
      start: $("start-overlay"),
      pause: $("pause-overlay"),
      help: $("help-overlay"),
      character: $("character-overlay"),
      achievements: $("achievements-overlay")
    };

    const anyOpen = () => Object.values(map).some(el => el && !el.classList.contains("hidden"));

    const sync = () => document.body.classList.toggle("overlay-open", anyOpen());

    function open(name){
      const el = map[name];
      if (!el) return;
      el.classList.remove("hidden");
      sync();
      if (name === "pause") AppState.paused = true;
    }
    function close(name){
      const el = map[name];
      if (!el) return;
      el.classList.add("hidden");
      sync();
      if (name === "pause") AppState.paused = false;
    }
    function closeAll(){
      Object.keys(map).forEach(close);
      sync();
    }
    return { open, close, closeAll };
  })();

  /* ======================= UI (HUD + BIND) ======================= */
  const UI = (() => {
    function setText(id, v){ const el=$(id); if (el) el.textContent = String(v); }

    function updateHUD(){
      setText("score", Math.floor(AppState.score));
      setText("streak", Math.floor(AppState.streak));
      setText("lives", Math.floor(AppState.lives));
      // achievements-count exists (0/10) in your HUD
      const defsCount = 10;
      const got = Object.values(AppState.achievements||{}).filter(Boolean).length;
      setText("achievements-count", `${got}/${defsCount}`);
    }

    function setSoundIcon(){
      const icon = $("sound-toggle-btn")?.querySelector("i");
      if (!icon) return;
      icon.className = AppState.soundOn ? "fas fa-volume-up" : "fas fa-volume-mute";
    }

    function openAchievements(){
      // If your achievements overlay exists, populate list if container present
      const list = $("achievements-list");
      if (list) {
        const defs = [
          { key:"firstHoney", title:"First Honey", desc:"Catch any honey." },
          { key:"streak10", title:"Sticky Streak", desc:"Reach a 10 streak." },
          { key:"survive60", title:"Steady Paws", desc:"Survive 60 seconds." },
          { key:"score1k", title:"Honey Hoarder", desc:"Reach 1000 score." },
          { key:"beeDodger", title:"Bee Dodger", desc:"30s with full lives." },
          { key:"combo2x", title:"Combo Craze", desc:"Hit 2.0× combo." },
          { key:"powerFan", title:"Powered Up", desc:"Collect 3 power-ups." },
          { key:"noMiss20", title:"Perfect Flow", desc:"20 streak without a miss." },
          { key:"survive120", title:"Long Walk", desc:"Survive 120 seconds." },
          { key:"score3k", title:"Legend", desc:"Reach 3000 score." }
        ];
        const unlocked = (k)=>!!AppState.achievements?.[k];
        list.innerHTML = defs.map(d=>{
          const ok = unlocked(d.key);
          return `
            <div class="ach-row" style="display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:16px;border:2px solid rgba(93,78,55,.25);background:rgba(255,255,255,.65);margin-bottom:10px">
              <div style="font-size:1.35rem;line-height:1">${ok?"🏆":"🔒"}</div>
              <div style="flex:1;min-width:0">
                <div style="font-family:'Fredoka One',cursive;color:#5d4e37">${d.title} ${ok?"":"<span style='opacity:.65'>(locked)</span>"}</div>
                <div style="opacity:.78;margin-top:2px">${d.desc}</div>
              </div>
            </div>`;
        }).join("");
      }
      Overlays.open("achievements");
    }

    function bind(){
      if (bind._did) return;
      bind._did = true;

      const on = (id, ev, fn, opts) => $(id)?.addEventListener(ev, fn, opts);

      on("start-btn","click",()=>{ Audio.init(); Overlays.closeAll(); Game.start(); });
      on("pause-btn","click",()=>Overlays.open("pause"));
      on("resume-btn","click",()=>Overlays.close("pause"));
      on("restart-btn","click",()=>{ Game.reset(); Game.start(); });

      on("share-btn","click", async ()=>{
        const t = `I scored ${Math.floor(AppState.score)} in Pooh’s Honey Hunt 🍯`;
        try { navigator.share ? await navigator.share({ text:t }) : await navigator.clipboard.writeText(t); } catch {}
      });

      on("quit-btn","click",()=>{ Game.reset(); Overlays.closeAll(); Overlays.open("start"); });

      on("help-btn","click",()=>Overlays.open("help"));
      on("close-help-btn","click",()=>Overlays.close("help"));

      on("sound-toggle-btn","click",()=>{ Audio.toggle(); setSoundIcon(); });

      on("achievements-btn","click", openAchievements);
      on("view-achievements-btn","click", openAchievements);
      on("close-achievements-btn","click", ()=>Overlays.close("achievements"));
      on("close-achievements-btn-2","click", ()=>Overlays.close("achievements"));

      on("select-character-btn","click", ()=>Overlays.open("character"));
      on("back-to-menu-btn","click", ()=>Overlays.close("character"));
      on("start-with-character-btn","click", ()=>{ Audio.init(); Overlays.closeAll(); Game.start(); });

      // Character cards (optional)
      document.querySelectorAll(".character-card[data-character]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const c = btn.getAttribute("data-character");
          if (!c) return;
          AppState.character = c;
          Store.set("character", c);
          document.querySelectorAll(".character-card[data-character]").forEach(b=>b.classList.toggle("active", b===btn));
        });
      });

      // Weather drawer wiring (optional)
      const drawer = $("weather-drawer");
      const setDrawer = (open)=>drawer?.classList.toggle("open", !!open);
      const setWeather = (w)=>{
        Store.set("weather", w);
        document.querySelectorAll(".weather-btn[data-weather]").forEach(b=>{
          b.classList.toggle("active", b.getAttribute("data-weather")===w);
        });
      };

      on("weather-toggle","click",()=>setDrawer(true));
      on("weather-close","click",()=>setDrawer(false));
      document.querySelectorAll(".weather-btn[data-weather]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const w = btn.getAttribute("data-weather");
          if (w) setWeather(w);
        });
      });
      setWeather(Store.get("weather","clear"));

      // Keyboard shortcuts
      window.addEventListener("keydown",(e)=>{
        if (e.repeat) return;
        if (e.code==="Space"){
          e.preventDefault();
          if (!AppState.running) return;
          if (!document.body.classList.contains("overlay-open")) Overlays.open("pause");
          else Overlays.close("pause");
        }
        if (e.code==="Escape"){
          Overlays.close("help");
          Overlays.close("achievements");
          Overlays.close("character");
          Overlays.close("pause");
        }
      });

      setSoundIcon();
      updateHUD();
    }

    return { bind, updateHUD, setSoundIcon, openAchievements };
  })();

  /* ======================= CANVAS ======================= */
  const canvas = $("honey-game");
  const ctx = canvas?.getContext("2d", { alpha:true, desynchronized:true });

  if (!canvas || !ctx) {
    console.error("Canvas not found or 2D context failed.");
    return;
  }

  // Your CSS already sizes the canvas; keep logical render at 420x700 for consistent gameplay
  const BASE_W = 420, BASE_H = 700;
  canvas.width = BASE_W;
  canvas.height = BASE_H;

  /* ======================= INPUT (SMOOTH + RIPPLE) ======================= */
  const TouchRipples = (() => {
    const r = [];
    function add(x,y){
      r.push({x,y,rad:0,life:1});
      if (r.length>14) r.shift();
    }
    function update(dt){
      const t = Math.min(32,dt)/16;
      for (let i=r.length-1;i>=0;i--){
        r[i].rad += 2.2*t;
        r[i].life -= 0.04*t;
        if (r[i].life<=0) r.splice(i,1);
      }
    }
    function render(ctx){
      if (!r.length) return;
      ctx.save();
      for (const a of r){
        ctx.globalAlpha = a.life*0.55;
        ctx.strokeStyle = "rgba(255,255,255,0.9)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.rad, 0, Math.PI*2);
        ctx.stroke();
      }
      ctx.restore();
    }
    return { add, update, render };
  })();

  const Input = (() => {
    let down=false;
    let tx = BASE_W/2;
    let x = BASE_W/2;
    let vx = 0;

    const setTarget = (clientX) => {
      const rect = canvas.getBoundingClientRect();
      const nx = (clientX - rect.left) / rect.width;
      tx = clamp(nx * BASE_W, 50, BASE_W-50);
    };

    const downAt = (clientX, clientY) => {
      down = true;
      setTarget(clientX);
      Audio.init();

      // ripple in canvas-space
      const rect = canvas.getBoundingClientRect();
      const nx = (clientX - rect.left) / rect.width;
      const ny = (clientY - rect.top) / rect.height;
      TouchRipples.add(clamp(nx*BASE_W,0,BASE_W), clamp(ny*BASE_H,0,BASE_H));
    };

    canvas.addEventListener("mousedown",(e)=>downAt(e.clientX,e.clientY));
    window.addEventListener("mousemove",(e)=>{ if(down) setTarget(e.clientX); });
    window.addEventListener("mouseup",()=>down=false);

    canvas.addEventListener("touchstart",(e)=>{
      const t=e.touches?.[0]; if(!t) return;
      if(e.cancelable) e.preventDefault();
      downAt(t.clientX,t.clientY);
    },{passive:false});
    canvas.addEventListener("touchmove",(e)=>{
      if(!down) return;
      const t=e.touches?.[0]; if(!t) return;
      if(e.cancelable) e.preventDefault();
      setTarget(t.clientX);
    },{passive:false});
    canvas.addEventListener("touchend",()=>down=false,{passive:true});
    canvas.addEventListener("touchcancel",()=>down=false,{passive:true});

    function update(dt){
      const t = Math.min(40,dt)/1000;
      const k = 24;   // stiffness
      const d = 11;   // damping
      const ax = (tx - x)*k - vx*d;
      vx += ax*t;
      x += vx*t;
      x = clamp(x, 50, BASE_W-50);
      return x;
    }

    return { update };
  })();

  /* ======================= PARTICLES ======================= */
  const Particles = (() => {
    const p=[];
    const MAX=220;

    function emit(x,y,color,count=10,spread=1){
      for(let i=0;i<count;i++){
        if(p.length>=MAX) p.shift();
        const a=Math.random()*Math.PI*2;
        const sp=(1+Math.random()*2.6)*spread;
        p.push({
          x,y,
          vx:Math.cos(a)*sp,
          vy:Math.sin(a)*sp-(1.5+Math.random()*2),
          life:1,
          r:2+Math.random()*3,
          color
        });
      }
    }

    function update(dt){
      const t=Math.min(32,dt)/1000;
      for(let i=p.length-1;i>=0;i--){
        const a=p[i];
        a.x += a.vx*(60*t);
        a.y += a.vy*(60*t);
        a.vy += 0.12*(60*t);
        a.life -= 1.35*t;
        if(a.life<=0) p.splice(i,1);
      }
    }

    function render(ctx){
      if(!p.length) return;
      ctx.save();
      for(const a of p){
        ctx.globalAlpha = Math.max(0,a.life);
        ctx.fillStyle = a.color;
        ctx.beginPath();
        ctx.arc(a.x,a.y,a.r,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }

    return { emit, update, render };
  })();

  /* ======================= SCORE POPUPS (DOM, uses your CSS) ======================= */
  function spawnScorePopup(text, x, y){
    const host = document.querySelector(".game-container");
    if(!host) return;

    const el = document.createElement("div");
    el.className = "score-popup";
    el.textContent = text;

    // place in host space (host matches 420x700 aspect; map canvas coords -> %)
    const px = (x/BASE_W)*100;
    const py = (y/BASE_H)*100;
    el.style.left = `${px}%`;
    el.style.top = `${py}%`;

    host.appendChild(el);
    el.addEventListener("animationend",()=>el.remove(),{once:true});
  }

  /* ======================= ACHIEVEMENTS ======================= */
  const Achievements = (() => {
    const unlock = (k)=>{
      if (AppState.achievements[k]) return false;
      AppState.achievements[k]=true;
      persistAchievements();
      UI.updateHUD();
      return true;
    };

    function check(){
      if (AppState.score > 0) unlock("firstHoney");
      if (AppState.streak >= 10) unlock("streak10");
      if (AppState.timeMs >= 60000) unlock("survive60");
      if (AppState.timeMs >= 120000) unlock("survive120");
      if (AppState.score >= 1000) unlock("score1k");
      if (AppState.score >= 3000) unlock("score3k");
      if (AppState.timeMs >= 30000 && AppState.lives >= 3) unlock("beeDodger");
      if (AppState.combo.mult >= 2.0) unlock("combo2x");
      if (AppState.streak >= 20) unlock("noMiss20");
      if (Game.getPowerCount && Game.getPowerCount() >= 3) unlock("powerFan");
    }

    return { check };
  })();

  /* ======================= GAME (POLISH-FIRST) ======================= */
  const Game = (() => {
    // entities
    const honeys=[];
    const bees=[];
    const powers=[];

    // player
    const player={
      x: BASE_W/2,
      y: BASE_H-86,
      r: 46,

      // punch/bounce
      scale: 1,
      sv: 0
    };

    // buffs
    const buffs = { shield: 0, slow: 0 };
    let powerCollected = 0;

    // pacing
    let running=false;
    let last=0;

    let honeyTimer=0, beeTimer=0, powerTimer=0;
    let baseHoneyRate=520;
    let baseBeeRate=880;
    let powerRate=7000;

    // difficulty
    let honeyFall=165, beeFall=195, beeDrift=85;

    // screen shake
    let shake=0;

    // moment framing
    let microSlow=0; // ms

    const hitCircle=(ax,ay,ar,bx,by,br)=>{
      const dx=ax-bx, dy=ay-by, rr=ar+br;
      return dx*dx+dy*dy <= rr*rr;
    };

    function momentSlow(amount=0.15, dur=160){
      // amount=0..1 slower, dur ms
      microSlow = Math.max(microSlow, dur);
      AppState.timeScale = Math.min(AppState.timeScale, 1 - amount);
    }

    function screenShake(intensity=10){
      shake = Math.max(shake, intensity);
    }

    function punchScale(amount=0.25){
      player.sv -= amount;
    }

    function reset(){
      honeys.length=0; bees.length=0; powers.length=0;
      running=false;
      AppState.running=false;
      AppState.paused=false;

      AppState.score=0;
      AppState.streak=0;
      AppState.lives=3;
      AppState.timeMs=0;
      AppState.combo={ mult:1, timer:0, tier:0 };

      AppState.maxStreak=0;
      AppState.honeyCaught=0;
      AppState.beesHit=0;

      buffs.shield=0;
      buffs.slow=0;
      powerCollected=0;

      honeyTimer=beeTimer=powerTimer=0;

      honeyFall=165; beeFall=195; beeDrift=85;

      player.x=BASE_W/2;
      player.y=BASE_H-86;
      player.scale=1;
      player.sv=0;

      shake=0;
      microSlow=0;
      AppState.timeScale=1;

      UI.updateHUD();
    }

    function start(){
      AppState.running=true;
      AppState.paused=false;
      running=true;
      last=performance.now();
    }

    function gameOver(){
      running=false;
      AppState.running=false;
      AppState.paused=false;

      if (AppState.score > AppState.best) {
        AppState.best = AppState.score;
        Store.set("bestScore", String(AppState.best));
      }

      UI.updateHUD();
      Overlays.open("start");
    }

    function spawnHoney(){
      honeys.push({
        x: 60 + Math.random()*(BASE_W-120),
        y: -30,
        r: 22,
        vy: honeyFall*(0.9+Math.random()*0.25)
      });
    }

    function spawnBee(){
      bees.push({
        x: 60 + Math.random()*(BASE_W-120),
        y: -40,
        r: 22,
        vy: beeFall*(0.9+Math.random()*0.25),
        vx: (Math.random()*2-1)*beeDrift,
        flap: Math.random()*10
      });
    }

    function spawnPower(){
      const type = Math.random() < 0.5 ? "shield" : "slow";
      powers.push({
        x: 60 + Math.random()*(BASE_W-120),
        y: -40,
        r: 18,
        vy: 175,
        type,
        trail: []
      });
    }

    function updateDifficulty(){
      const t = AppState.timeMs/1000;
      honeyFall = 165 + t*1.05;
      beeFall   = 195 + t*1.35;
      beeDrift  =  85 + t*0.18;
    }

    function setComboFromStreak(){
      const tier = Math.min(6, Math.floor(AppState.streak/5)); // 0..6
      const mult = Math.min(2.2, 1 + tier*0.2);
      AppState.combo.mult = mult;
      AppState.combo.timer = 2000;
      if (tier !== AppState.combo.tier && tier >= 2) {
        // tier-up moment framing
        Audio.combo();
        momentSlow(0.10, 140);
        spawnScorePopup(`COMBO x${mult.toFixed(1)}`, player.x, 120);
      }
      AppState.combo.tier = tier;
    }

    function awardHoney(h){
      AppState.honeyCaught++;
      AppState.streak++;
      AppState.maxStreak = Math.max(AppState.maxStreak, AppState.streak);

      setComboFromStreak();

      // points
      const base = 10;
      const pts = Math.round(base*AppState.combo.mult);
      AppState.score += pts;

      // juice
      Particles.emit(h.x, h.y, "rgba(255,165,0,1)", 12 + Math.floor(AppState.combo.mult*5), 1);
      spawnScorePopup(`+${pts}`, h.x, h.y);
      punchScale(0.22);
      vibrate(15);
      Audio.collect();

      // micro slow on reward (subtle)
      momentSlow(0.06, 90);

      UI.updateHUD();
    }

    function takeHit(b){
      AppState.beesHit++;

      if (buffs.shield > 0){
        buffs.shield = 0;
        Particles.emit(b.x, b.y, "rgba(77,150,255,1)", 18, 1.1);
        spawnScorePopup("🛡️", b.x, b.y);
        Audio.power();
        vibrate([20,20,20]);
        momentSlow(0.10, 120);
        screenShake(10);
        return;
      }

      AppState.lives = Math.max(0, AppState.lives-1);
      AppState.streak = 0;
      AppState.combo = { mult:1, timer:0, tier:0 };

      Particles.emit(b.x, b.y, "rgba(201,76,76,1)", 22, 1.2);
      spawnScorePopup("OUCH!", player.x, player.y-40);
      Audio.hit();
      vibrate([35,25,35]);

      // big moment framing on damage
      momentSlow(0.22, 180);
      screenShake(16);

      UI.updateHUD();
      if (AppState.lives <= 0) gameOver();
    }

    function takePower(p){
      powerCollected++;
      if (p.type === "shield") {
        buffs.shield = 12000;
        spawnScorePopup("🛡️ Shield", p.x, p.y);
        Particles.emit(p.x, p.y, "rgba(77,150,255,1)", 18, 1.1);
      } else {
        buffs.slow = 7000;
        spawnScorePopup("⏳ Slow", p.x, p.y);
        Particles.emit(p.x, p.y, "rgba(157,78,221,1)", 18, 1.05);
      }
      Audio.power();
      vibrate(20);
      momentSlow(0.12, 140);
    }

    function update(dt){
      if (!running || AppState.paused) return;

      // apply moment framing timescale
      if (microSlow > 0) {
        microSlow = Math.max(0, microSlow - dt);
        // ease back to 1
        AppState.timeScale += (1 - AppState.timeScale) * 0.08;
      } else {
        AppState.timeScale += (1 - AppState.timeScale) * 0.12;
      }
      AppState.timeScale = clamp(AppState.timeScale, 0.70, 1);

      dt = Math.min(dt, 50) * AppState.timeScale;

      AppState.timeMs += dt;

      // combo decay
      if (AppState.combo.timer > 0) {
        AppState.combo.timer = Math.max(0, AppState.combo.timer - dt);
        if (AppState.combo.timer === 0) AppState.combo = { mult:1, timer:0, tier:0 };
      }

      // buffs decay
      if (buffs.shield > 0) buffs.shield = Math.max(0, buffs.shield - dt);
      if (buffs.slow > 0) buffs.slow = Math.max(0, buffs.slow - dt);

      updateDifficulty();

      // player movement + springy scale
      player.x = Input.update(dt);
      player.sv += (1 - player.scale) * 0.18;
      player.sv *= 0.72;
      player.scale += player.sv;
      player.scale = clamp(player.scale, 0.88, 1.25);

      const slowFactor = buffs.slow > 0 ? 0.58 : 1;

      // spawn
      honeyTimer += dt;
      beeTimer += dt;
      powerTimer += dt;

      if (honeyTimer >= baseHoneyRate) { honeyTimer = 0; spawnHoney(); }
      if (beeTimer >= baseBeeRate) { beeTimer = 0; spawnBee(); }
      if (powerTimer >= powerRate) { powerTimer = 0; spawnPower(); }

      // move honeys
      for (let i=honeys.length-1;i>=0;i--){
        const h=honeys[i];
        h.y += (h.vy*slowFactor)*(dt/1000);
        if (h.y > BASE_H + 60) {
          honeys.splice(i,1);
          AppState.streak = 0;
          AppState.combo = { mult:1, timer:0, tier:0 };
          continue;
        }
        if (hitCircle(player.x, player.y, player.r, h.x, h.y, h.r)) {
          awardHoney(h);
          honeys.splice(i,1);
        }
      }

      // move bees
      for (let i=bees.length-1;i>=0;i--){
        const b=bees[i];
        b.flap += dt/120;
        b.y += (b.vy*slowFactor)*(dt/1000);
        b.x += (b.vx*slowFactor)*(dt/1000);
        if (b.x < 40 || b.x > BASE_W-40) b.vx *= -1;
        if (b.y > BASE_H + 80) { bees.splice(i,1); continue; }

        if (hitCircle(player.x, player.y, player.r, b.x, b.y, b.r)) {
          takeHit(b);
          bees.splice(i,1);
        }
      }

      // move powers + trails
      for (let i=powers.length-1;i>=0;i--){
        const p=powers[i];
        p.y += p.vy*(dt/1000);
        p.trail.unshift({x:p.x,y:p.y});
        if (p.trail.length>8) p.trail.pop();
        if (p.y > BASE_H + 80) { powers.splice(i,1); continue; }
        if (hitCircle(player.x, player.y, player.r, p.x, p.y, p.r)) {
          takePower(p);
          powers.splice(i,1);
        }
      }

      Particles.update(dt);
      TouchRipples.update(dt);
      Achievements.check();
    }

    /* ======================= RENDERING ======================= */
    function drawGroundWash(){
      ctx.save();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = "#000";
      ctx.fillRect(0, BASE_H-140, BASE_W, 140);
      ctx.restore();
    }

    function drawHoney(h){
      ctx.save();
      ctx.translate(h.x,h.y);
      ctx.fillStyle="#f4b400";
      ctx.strokeStyle="rgba(93,78,55,0.35)";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.roundRect(-h.r,-h.r,h.r*2,h.r*2,10);
      ctx.fill(); ctx.stroke();

      ctx.globalAlpha=0.22;
      ctx.fillStyle="#fff";
      ctx.beginPath();
      ctx.ellipse(-h.r*0.25,-h.r*0.25,h.r*0.45,h.r*0.25,-0.4,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    function drawBee(b){
      const r=b.r;
      const flap=Math.sin(b.flap)*0.35;

      ctx.save();
      ctx.translate(b.x,b.y);

      // wings
      ctx.globalAlpha=0.35;
      ctx.fillStyle="#fff";
      ctx.beginPath();
      ctx.ellipse(-r*0.6,-r*0.6,r*0.6,r*0.4,flap,0,Math.PI*2);
      ctx.ellipse(r*0.6,-r*0.6,r*0.6,r*0.4,-flap,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;

      // body
      ctx.fillStyle="#ffd86a";
      ctx.strokeStyle="rgba(93,78,55,0.4)";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.ellipse(0,0,r,r*0.8,0,0,Math.PI*2);
      ctx.fill(); ctx.stroke();

      // stripes
      ctx.fillStyle="rgba(0,0,0,0.65)";
      ctx.fillRect(-r*0.8,-r*0.22,r*1.6,r*0.30);
      ctx.fillRect(-r*0.8,r*0.18,r*1.6,r*0.30);

      ctx.restore();
    }

    function drawPower(p){
      // trail
      if (p.trail?.length) {
        for (let i=0;i<p.trail.length;i++){
          const pos=p.trail[i];
          const alpha=0.5*(1-i/p.trail.length);
          ctx.fillStyle =
            p.type==="shield" ? `rgba(77,150,255,${alpha})` :
            p.type==="slow" ? `rgba(157,78,221,${alpha})` :
            `rgba(255,165,0,${alpha})`;
          ctx.beginPath();
          ctx.arc(pos.x,pos.y,p.r*(0.75-i*0.05),0,Math.PI*2);
          ctx.fill();
        }
      }

      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.fillStyle = p.type==="shield" ? "#4a9eff" : "#9d4edd";
      ctx.strokeStyle="rgba(93,78,55,0.35)";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,0,p.r,0,Math.PI*2);
      ctx.fill(); ctx.stroke();

      ctx.fillStyle="rgba(255,255,255,0.9)";
      ctx.font='900 14px "Fredoka One", system-ui';
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.fillText(p.type==="shield" ? "S" : "⏳", 0, 1);
      ctx.restore();
    }

    function drawPlayer(){
      const r=player.r;
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.scale(player.scale, player.scale);

      // shadow
      ctx.globalAlpha=0.22;
      ctx.fillStyle="#000";
      ctx.beginPath();
      ctx.ellipse(0, r*0.72, r*0.88, r*0.28, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;

      // body
      ctx.fillStyle="#f6c44f";
      ctx.strokeStyle="rgba(93,78,55,0.35)";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.ellipse(0, 10, r*0.78, r*0.62, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();

      // shirt
      ctx.fillStyle="#d64b3c";
      ctx.beginPath();
      ctx.ellipse(0, 0, r*0.82, r*0.42, 0, 0, Math.PI*2);
      ctx.fill();

      // head
      ctx.fillStyle="#f7cc63";
      ctx.beginPath();
      ctx.arc(0, -r*0.62, r*0.48, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();

      // ears
      ctx.beginPath();
      ctx.arc(-r*0.3, -r*0.98, r*0.18, 0, Math.PI*2);
      ctx.arc(r*0.3, -r*0.98, r*0.18, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();

      // face
      ctx.fillStyle="rgba(0,0,0,0.65)";
      ctx.beginPath(); ctx.arc(-r*0.14,-r*0.68,r*0.05,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(r*0.14,-r*0.68,r*0.05,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(0,-r*0.56,r*0.06,0,Math.PI*2); ctx.fill();

      // character “value” (tiny but visible)
      if (AppState.character === "piglet") {
        ctx.fillStyle="rgba(255,183,197,0.85)";
        ctx.beginPath();
        ctx.arc(-r*0.3,-r*0.98,r*0.16,0,Math.PI*2);
        ctx.arc(r*0.3,-r*0.98,r*0.16,0,Math.PI*2);
        ctx.fill();
      } else if (AppState.character === "tigger") {
        ctx.fillStyle="rgba(0,0,0,0.18)";
        for (let i=0;i<4;i++){
          ctx.beginPath();
          ctx.ellipse(Math.sin(i)*r*0.18, 12 + i*r*0.12, r*0.12, r*0.05, Math.PI/4, 0, Math.PI*2);
          ctx.fill();
        }
      }

      // shield ring
      if (buffs.shield > 0) {
        const pulse = 0.65 + 0.35*Math.sin(AppState.timeMs/180);
        ctx.strokeStyle = `rgba(77,150,255,${pulse})`;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.arc(0,0,r*1.02,0,Math.PI*2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function renderCombo(){
      if (AppState.combo.timer <= 0 || AppState.streak < 4) return;
      const a = 0.25 + (AppState.combo.timer/2000)*0.75;
      ctx.save();
      ctx.globalAlpha=a;
      ctx.font='900 34px "Fredoka One", system-ui';
      ctx.textAlign="center";
      ctx.lineWidth=6;
      ctx.strokeStyle="rgba(93,78,55,0.35)";
      ctx.fillStyle="rgba(255,165,0,0.95)";
      const msg=`COMBO x${AppState.combo.mult.toFixed(1)}`;
      ctx.strokeText(msg, BASE_W/2, 150);
      ctx.fillText(msg, BASE_W/2, 150);
      ctx.restore();
    }

    function render(){
      ctx.clearRect(0,0,BASE_W,BASE_H);

      // moment framing: slightly boost contrast when slowed
      const mf = 1 - AppState.timeScale;

      // apply screen shake
      ctx.save();
      if (shake > 0.01) {
        const dx=(Math.random()-0.5)*shake;
        const dy=(Math.random()-0.5)*shake;
        ctx.translate(dx,dy);
        shake *= 0.88;
      }

      // background wash overlay (lets your CSS gradient show through + adds depth)
      if (mf > 0.01) {
        ctx.globalAlpha = clamp(mf*1.8, 0, 0.22);
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0,0,BASE_W,BASE_H);
        ctx.globalAlpha = 1;
      }

      drawGroundWash();

      // entities
      for (const h of honeys) drawHoney(h);
      for (const p of powers) drawPower(p);
      for (const b of bees) drawBee(b);

      // player
      drawPlayer();

      // overlays
      Particles.render(ctx);
      TouchRipples.render(ctx);
      renderCombo();

      ctx.restore();
    }

    function tick(ts){
      const dt = ts - last;
      last = ts;

      update(dt);
      render();

      requestAnimationFrame(tick);
    }

    function bootLoop(){
      last = performance.now();
      requestAnimationFrame(tick);
    }

    function getPowerCount(){ return powerCollected; }

    return { reset, start, bootLoop, getPowerCount };
  })();

  /* ======================= BOOT ======================= */
  function boot(){
    UI.bind();
    Game.reset();
    Game.bootLoop();
    Overlays.open("start");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once:true });
  } else {
    boot();
  }
})();
</script>
