<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pooh's Enhanced Honey Hunt - Definitive Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#d4a574" />
  <meta name="description" content="Help Pooh catch honey pots! Now optimized for all devices with High DPI support." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
    /* ===============================
       CORE VARIABLES
    ================================ */
    :root {
      --pooh-bear: #d4a574;
      --pooh-red: #e63946;
      --honey-gold: #ffa500;
      --wood-brown: #5d4e37;
      --wood-light: #8b7355;
      
      /* Safe area variables */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      
      /* Layout Config */
      --header-height: 90px;
      --game-max-width: 500px;
      --game-margin-top: 110px;
      --game-margin-bottom: 150px;
    }

    /* ===============================
       BASE & RESET
    ================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      height: 100%;
      background: linear-gradient(180deg, #0a3d62 0%, #87ceeb 40%, #b0e0e6 100%);
      font-family: 'Patrick Hand', cursive, system-ui;
      overflow: hidden;
      touch-action: none;
    }

    main {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      /* PERFORMANCE FIX: Removed heavy drop-shadow filter on main container */
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      padding-right: var(--safe-right);
    }

    /* ===============================
       BACKGROUND DECORATIONS
    ================================ */
    .background-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ===============================
       UI: TOP BAR (HUD)
    ================================ */
    .top-bar {
      position: fixed;
      top: calc(10px + var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(95%, 600px);
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 3px solid var(--wood-brown);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      z-index: 10; /* HUD Layer */
      pointer-events: auto;
      transition: all 0.3s ease;
    }

    .stat-card {
      background: linear-gradient(135deg, #fff8e1 0%, #ffe8b8 100%);
      border: 2px solid var(--wood-brown);
      padding: 6px 10px;
      border-radius: 14px;
      flex: 1;
      text-align: center;
      position: relative;
      font-family: 'Fredoka One', cursive;
      min-width: 0; /* Flexbox fix */
    }

    .stat-card.special {
      background: linear-gradient(135deg, #9d4edd 0%, #7d5fff 100%);
      color: white;
      cursor: pointer;
    }
    
    .stat-card.special .stat-label { color: rgba(255,255,255,0.9); text-shadow: none; }
    .stat-card.special .stat-value { color: white; text-shadow: 0 2px 0 rgba(0,0,0,0.2); }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--wood-brown);
      font-family: 'Patrick Hand', cursive;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-value {
      font-size: 1.4rem;
      color: var(--pooh-red);
      line-height: 1.1;
      text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
    }

    /* ===============================
       GAME CONTAINER
    ================================ */
    .game-container {
      position: relative;
      margin-top: var(--game-margin-top);
      margin-bottom: var(--game-margin-bottom);
      width: 95%;
      max-width: var(--game-max-width);
      aspect-ratio: 3/4; /* Maintains Pooh's world shape */
      max-height: 65vh;
      
      /* PERFORMANCE FIX: Use box-shadow instead of filter: drop-shadow */
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.3),
        0 0 0 1px rgba(255,255,255,0.1);
        
      border-radius: 28px;
      z-index: 1; /* Game Layer */
      transition: transform 0.3s ease;
    }

    /* The actual canvas element */
    #honey-game {
      width: 100%;
      height: 100%;
      border-radius: 28px;
      border: 6px solid var(--wood-brown);
      background: #87ceeb; /* Fallback */
      
      /* Touch handling */
      touch-action: none;
      cursor: none; /* Hide default cursor */
      
      /* Crisp rendering for pixel art style if needed, though we use vector style */
      image-rendering: -webkit-optimize-contrast;
    }
    
    /* Subtle overlay reflection on the glass/screen */
    .game-container::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, transparent 40%);
      pointer-events: none;
    }

    /* ===============================
       CONTROLS (Floating Buttons)
    ================================ */
    .side-controls-group {
      position: fixed;
      display: flex;
      gap: 10px;
      z-index: 20; /* Controls Layer */
    }

    /* Top Left: Sound */
    .sound-controls { top: calc(10px + var(--safe-top)); left: calc(10px + var(--safe-left)); }
    
    /* Top Right: Share */
    .share-btn-container { top: calc(10px + var(--safe-top)); right: calc(10px + var(--safe-right)); }

    /* Bottom Center: Game Actions (Pause/Help) */
    .game-controls {
      position: fixed;
      bottom: calc(20px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 16px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px 20px;
      border-radius: 50px;
      border: 3px solid var(--wood-brown);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* Bottom Weather Bar */
    .weather-controls {
      position: fixed;
      bottom: calc(90px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 20;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 40px;
      border: 3px solid var(--wood-brown);
      backdrop-filter: blur(5px);
    }

    /* Standard Round Button Style */
    .round-btn {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 3px solid white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.2s, background 0.2s;
    }
    
    .round-btn:active { transform: scale(0.95); }
    
    .btn-green { background: #06d6a0; }
    .btn-blue { background: #4d96ff; }
    .btn-orange { background: var(--pooh-bear); border-color: var(--wood-brown); }
    
    .weather-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid var(--wood-brown);
      background: white;
      color: var(--wood-brown);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .weather-btn.active {
      background: var(--pooh-red);
      color: white;
      border-color: var(--pooh-red);
      transform: scale(1.1);
    }

    /* ===============================
       CUSTOM CURSOR (Spoon)
    ================================ */
    .honey-cursor {
      position: fixed;
      width: 60px;
      height: 60px;
      pointer-events: none; /* Critical: Click-through */
      z-index: 9999;
      transform: translate(-50%, -50%); /* Center on tip */
      display: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }
    
    .honey-cursor.active { display: block; }
    
    .honey-cursor .spoon-img {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 30%, #ffd700, #ffa500);
      /* Simple spoon shape */
      clip-path: polygon(20% 0%, 80% 0%, 100% 60%, 55% 100%, 45% 100%, 0% 60%);
    }

    /* ===============================
       OVERLAYS & MENUS
    ================================ */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 248, 225, 0.96);
      backdrop-filter: blur(15px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      text-align: center;
      transition: opacity 0.3s;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .main-title {
      font-family: 'Fredoka One', cursive;
      font-size: 3rem;
      color: var(--pooh-red);
      text-shadow: 4px 4px 0 var(--wood-brown);
      line-height: 1.1;
      margin-bottom: 20px;
      animation: float 4s ease-in-out infinite;
    }

    .menu-btn {
      background: linear-gradient(to bottom, #e63946, #c62828);
      color: white;
      border: 4px solid var(--wood-brown);
      padding: 15px 40px;
      font-size: 1.5rem;
      font-family: 'Fredoka One', cursive;
      border-radius: 50px;
      cursor: pointer;
      margin: 10px;
      box-shadow: 0 6px 0 #8b2020;
      transition: transform 0.1s;
      min-width: 200px;
    }

    .menu-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #8b2020;
    }

    .menu-btn.secondary {
      background: linear-gradient(to bottom, var(--wood-light), var(--wood-brown));
      font-size: 1.1rem;
      padding: 12px 30px;
      box-shadow: 0 6px 0 #4a3a24;
    }
    
    /* Character Selection Grid */
    .char-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
      width: 100%;
      max-width: 400px;
    }
    
    .char-card {
      background: white;
      border: 3px solid var(--wood-brown);
      border-radius: 15px;
      padding: 10px;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s;
    }
    
    .char-card.selected {
      opacity: 1;
      border-color: var(--pooh-red);
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    /* ===============================
       RESPONSIVE ADJUSTMENTS
    ================================ */
    
    /* Mobile Landscape Fix (The "Squish" Problem) */
    @media (orientation: landscape) and (max-height: 500px) {
      :root {
        --game-margin-top: 40px;
        --game-margin-bottom: 10px;
      }

      /* Shrink Header */
      .top-bar {
        top: 5px;
        padding: 4px 10px;
        width: auto;
        min-width: 300px;
      }
      .stat-value { font-size: 1.1rem; }
      .stat-label { font-size: 0.6rem; }

      /* Move Game Controls to Right Thumb Zone */
      .game-controls {
        top: 50%;
        right: calc(10px + var(--safe-right));
        bottom: auto;
        left: auto;
        transform: translateY(-50%);
        flex-direction: column;
        background: rgba(255,255,255,0.6);
        padding: 8px;
        border-radius: 30px;
      }

      /* Move Weather Controls to Left Thumb Zone */
      .weather-controls {
        top: 50%;
        left: calc(10px + var(--safe-left));
        right: auto;
        bottom: auto;
        transform: translateY(-50%);
        flex-direction: column;
        background: rgba(255,255,255,0.6);
        padding: 8px;
        border-radius: 30px;
        max-height: 80vh;
        overflow-y: auto;
      }

      /* Maximize Game Area */
      .game-container {
        height: 85vh;
        max-height: none;
        margin-top: 45px;
      }
    }

    /* Small Phones */
    @media (max-width: 380px) {
      .stat-label { display: none; } /* Hide labels to save space */
      .stat-card { padding: 4px; }
      .game-controls { padding: 8px 12px; gap: 10px; }
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes popupFloat {
      0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -100px) scale(1); opacity: 0; }
    }
    
    .score-popup {
      position: absolute;
      color: #ffd700;
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      text-shadow: 2px 2px 0 #000;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }
</style>
</head>
<body>

<div class="background-layer" id="background-layer"></div>

<div class="honey-cursor" id="honey-cursor">
  <div class="spoon-img"></div>
</div>

<main>
  <div class="side-controls-group sound-controls">
    <button class="round-btn btn-green" id="sound-btn" aria-label="Toggle Sound">
      <i class="fas fa-volume-up"></i>
    </button>
  </div>

  <div class="side-controls-group share-btn-container">
    <button class="round-btn btn-blue" id="share-btn" aria-label="Share">
      <i class="fas fa-share-alt"></i>
    </button>
  </div>

  <header class="top-bar">
    <div class="stat-card">
      <div class="stat-label">Honey</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Streak</div>
      <div class="stat-value" id="streak">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Lives</div>
      <div class="stat-value" id="lives">3</div>
    </div>
    <div class="stat-card special" id="achieve-btn">
      <div class="stat-label">Awards</div>
      <div class="stat-value" id="achievements-count">0/10</div>
    </div>
  </header>

  <div class="game-container">
    <canvas id="honey-game" role="img" aria-label="Game Canvas"></canvas>
  </div>

  <div class="weather-controls">
    <button class="weather-btn active" data-w="none"><i class="fas fa-sun"></i></button>
    <button class="weather-btn" data-w="rain"><i class="fas fa-cloud-rain"></i></button>
    <button class="weather-btn" data-w="snow"><i class="fas fa-snowflake"></i></button>
    <button class="weather-btn" data-w="leaves"><i class="fas fa-leaf"></i></button>
  </div>

  <div class="game-controls">
    <button class="round-btn btn-orange" id="pause-btn"><i class="fas fa-pause"></i></button>
    <button class="round-btn btn-green" id="help-btn"><i class="fas fa-question"></i></button>
  </div>

  <div class="overlay" id="start-overlay">
    <h1 class="main-title">Pooh's<br>Honey Hunt</h1>
    <p style="margin-bottom: 20px; font-size: 1.1rem; color: var(--wood-brown);">Complete Edition</p>
    
    <button class="menu-btn" id="start-btn">Play Now</button>
    <button class="menu-btn secondary" id="char-select-btn">Characters</button>
  </div>

  <div class="overlay hidden" id="char-overlay">
    <h2>Choose a Friend</h2>
    <div class="char-grid">
      <div class="char-card selected" data-char="pooh">
        <div style="font-size: 3rem;">🐻</div>
        <strong>Pooh</strong><br><small>Wide Reach</small>
      </div>
      <div class="char-card" data-char="piglet">
        <div style="font-size: 3rem;">🐷</div>
        <strong>Piglet</strong><br><small>Super Fast</small>
      </div>
      <div class="char-card" data-char="tigger">
        <div style="font-size: 3rem;">🐯</div>
        <strong>Tigger</strong><br><small>Bounce Safe</small>
      </div>
      <div class="char-card" data-char="rabbit">
        <div style="font-size: 3rem;">🐰</div>
        <strong>Rabbit</strong><br><small>Double Score</small>
      </div>
    </div>
    <button class="menu-btn" id="confirm-char-btn">Start!</button>
  </div>

  <div class="overlay hidden" id="gameover-overlay">
    <h2 style="font-size: 2.5rem; color: var(--pooh-red); font-family: 'Fredoka One';">Oh Bother!</h2>
    <div style="font-size: 4rem; color: var(--honey-gold); margin: 10px 0; font-family: 'Fredoka One';" id="final-score">0</div>
    <p>Honey Pots Collected</p>
    <button class="menu-btn" id="restart-btn">Try Again</button>
    <button class="menu-btn secondary" id="home-btn">Menu</button>
  </div>

</main>

<script>
(() => {
  'use strict';

  /* ===============================
     1. ENGINE SETUP & HIGH DPI FIX
  ================================ */
  const canvas = document.getElementById('honey-game');
  const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
  
  // Logical game resolution (The game "thinks" it is this size)
  const LOGICAL_WIDTH = 420;
  const LOGICAL_HEIGHT = 700;
  
  let dpr = 1;

  function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    
    // Set actual physical pixels
    canvas.width = LOGICAL_WIDTH * dpr;
    canvas.height = LOGICAL_HEIGHT * dpr;
    
    // Normalize context so drawing commands use logical coordinates (0-420)
    ctx.scale(dpr, dpr);
    
    // Note: CSS width/height are set to 100% in stylesheet to fill container
  }

  // Initial resize and listen for changes
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  /* ===============================
     2. INPUT HANDLING (LOGICAL MAPPING)
  ================================ */
  const honeyCursor = document.getElementById('honey-cursor');
  let targetX = LOGICAL_WIDTH / 2;
  let isDragging = false;

  // Converts a screen click (pixel) to game world X (0-420)
  function getLogicalX(clientX) {
    const rect = canvas.getBoundingClientRect();
    // 1. Get relative X inside the element (0 to rect.width)
    const relX = clientX - rect.left;
    // 2. Scale it to match the logical game width
    const scaleFactor = LOGICAL_WIDTH / rect.width;
    
    let logicalX = relX * scaleFactor;
    
    // Clamp to bounds
    return Math.max(0, Math.min(LOGICAL_WIDTH, logicalX));
  }

  function handleInput(x, y, show) {
    targetX = getLogicalX(x);
    
    // Visual cursor follows real screen pixels, not logical
    if (show) {
      honeyCursor.classList.add('active');
      honeyCursor.style.left = x + 'px';
      honeyCursor.style.top = y + 'px';
    } else {
      honeyCursor.classList.remove('active');
    }
  }

  // Touch Events
  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); // Prevent scrolling
    isDragging = true;
    handleInput(e.touches[0].clientX, e.touches[0].clientY, true);
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(isDragging) handleInput(e.touches[0].clientX, e.touches[0].clientY, true);
  }, { passive: false });

  canvas.addEventListener('touchend', () => { isDragging = false; honeyCursor.classList.remove('active'); });

  // Mouse Events
  canvas.addEventListener('mousemove', e => handleInput(e.clientX, e.clientY, true));
  canvas.addEventListener('mouseleave', () => honeyCursor.classList.remove('active'));

  // Keyboard
  window.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft') targetX = Math.max(0, targetX - 40);
    if(e.key === 'ArrowRight') targetX = Math.min(LOGICAL_WIDTH, targetX + 40);
  });

  /* ===============================
     3. GAME STATE & ENTITIES
  ================================ */
  const state = {
    running: false,
    score: 0,
    lives: 3,
    streak: 0,
    character: 'pooh',
    weather: 'none'
  };

  const characters = {
    pooh: { color: '#d4a574', radius: 38, speed: 0.15, label: "Pooh" },
    piglet: { color: '#ffb7c5', radius: 32, speed: 0.25, label: "Piglet" },
    tigger: { color: '#ff8c00', radius: 32, speed: 0.15, bounce: true, label: "Tigger" },
    rabbit: { color: '#8bc34a', radius: 32, speed: 0.15, bonus: true, label: "Rabbit" }
  };

  const player = { x: LOGICAL_WIDTH/2, y: LOGICAL_HEIGHT - 80, vx: 0 };
  
  let honeys = [];
  let bees = [];
  let particles = [];
  let lastTime = 0;
  let spawnTimer = 0;

  /* ===============================
     4. GAME LOOP
  ================================ */
  function gameLoop(timestamp) {
    if (!state.running) return;
    
    const dt = Math.min((timestamp - lastTime) / 1000, 0.05); // Cap delta time
    lastTime = timestamp;

    update(dt);
    draw();
    
    requestAnimationFrame(gameLoop);
  }

  function update(dt) {
    const charStats = characters[state.character];
    
    // Smooth Movement
    const dx = targetX - player.x;
    player.vx = dx * 10; // spring force
    player.x += player.vx * dt;
    
    // Bounds Check
    if(player.x < charStats.radius) player.x = charStats.radius;
    if(player.x > LOGICAL_WIDTH - charStats.radius) player.x = LOGICAL_WIDTH - charStats.radius;

    // Spawning Logic
    spawnTimer += dt;
    if (spawnTimer > 1.0 - (Math.min(state.score, 1000) / 2000)) {
      spawnTimer = 0;
      if (Math.random() < 0.7) spawnHoney();
      else spawnBee();
    }

    // Update Honeys
    for (let i = honeys.length - 1; i >= 0; i--) {
      let h = honeys[i];
      h.y += h.speed * dt;
      h.rot += 2 * dt;

      // Collision
      const dist = Math.hypot(h.x - player.x, h.y - player.y);
      if (dist < charStats.radius + 20) {
        collectHoney(h, i);
        continue;
      }
      
      if (h.y > LOGICAL_HEIGHT + 50) honeys.splice(i, 1);
    }

    // Update Bees
    for (let i = bees.length - 1; i >= 0; i--) {
      let b = bees[i];
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      
      const dist = Math.hypot(b.x - player.x, b.y - player.y);
      if (dist < charStats.radius + 15) {
        if(charStats.bounce && Math.random() > 0.5) {
          // Tigger Bounce
          b.vx *= -1.5; b.vy = -200;
          createPopup(player.x, player.y - 50, "BOUNCE!", "#ff8c00");
        } else {
          hitBee(i);
        }
        continue;
      }
      
      if (b.x < -50 || b.x > LOGICAL_WIDTH + 50) bees.splice(i, 1);
    }
    
    // Particles
    particles.forEach((p, i) => {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 2;
      if(p.life <= 0) particles.splice(i, 1);
    });
  }

  function spawnHoney() {
    honeys.push({
      x: Math.random() * (LOGICAL_WIDTH - 60) + 30,
      y: -40,
      speed: 150 + (state.score * 0.1),
      rot: 0,
      gold: Math.random() < 0.1
    });
  }

  function spawnBee() {
    const fromLeft = Math.random() > 0.5;
    bees.push({
      x: fromLeft ? -40 : LOGICAL_WIDTH + 40,
      y: Math.random() * 300 + 50,
      vx: (fromLeft ? 1 : -1) * (100 + Math.random() * 100),
      vy: Math.random() * 40 - 20
    });
  }

  /* ===============================
     5. DRAWING (VECTOR STYLE)
  ================================ */
  function draw() {
    // Clear Screen
    ctx.fillStyle = '#87ceeb';
    // Simple Gradient Sky
    const grad = ctx.createLinearGradient(0, 0, 0, LOGICAL_HEIGHT);
    grad.addColorStop(0, '#0a3d62');
    grad.addColorStop(1, '#b0e0e6');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

    // Draw Grass Hill
    ctx.fillStyle = '#7cb342';
    ctx.beginPath();
    ctx.moveTo(0, LOGICAL_HEIGHT);
    ctx.lineTo(LOGICAL_WIDTH, LOGICAL_HEIGHT);
    ctx.lineTo(LOGICAL_WIDTH, LOGICAL_HEIGHT - 60);
    ctx.quadraticCurveTo(LOGICAL_WIDTH/2, LOGICAL_HEIGHT - 120, 0, LOGICAL_HEIGHT - 60);
    ctx.fill();

    // Draw Player
    const char = characters[state.character];
    ctx.fillStyle = char.color;
    // Ears
    ctx.beginPath();
    ctx.arc(player.x - 25, player.y - 25, 12, 0, Math.PI*2);
    ctx.arc(player.x + 25, player.y - 25, 12, 0, Math.PI*2);
    ctx.fill();
    // Head
    ctx.beginPath();
    ctx.arc(player.x, player.y, char.radius, 0, Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle = '#333';
    ctx.beginPath();
    ctx.arc(player.x - 10, player.y - 5, 4, 0, Math.PI*2);
    ctx.arc(player.x + 10, player.y - 5, 4, 0, Math.PI*2);
    ctx.fill();
    // Nose
    ctx.beginPath();
    ctx.ellipse(player.x, player.y + 5, 6, 4, 0, 0, Math.PI*2);
    ctx.fill();

    // Draw Honey Pots
    honeys.forEach(h => {
      ctx.save();
      ctx.translate(h.x, h.y);
      ctx.rotate(Math.sin(h.rot) * 0.2);
      
      // Pot Body
      ctx.fillStyle = h.gold ? '#ffd700' : '#8b4513';
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI, false); // Bottom
      ctx.lineTo(20, -10);
      ctx.lineTo(-20, -10);
      ctx.fill();
      
      // Label
      ctx.fillStyle = '#fce4ec';
      ctx.fillRect(-15, -5, 30, 8);
      
      if(h.gold) {
         ctx.shadowColor = '#fff';
         ctx.shadowBlur = 10;
         ctx.fillStyle = '#fff';
         ctx.fill(); 
         ctx.shadowBlur = 0;
      }
      
      ctx.restore();
    });

    // Draw Bees
    bees.forEach(b => {
      ctx.save();
      ctx.translate(b.x, b.y);
      // Wings
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.ellipse(0, -10, 10, 6, 0, 0, Math.PI*2);
      ctx.fill();
      // Body
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI*2);
      ctx.fill();
      // Stripes
      ctx.fillStyle = '#000';
      ctx.fillRect(-5, -5, 3, 10);
      ctx.fillRect(2, -5, 3, 10);
      ctx.restore();
    });

    // Particles
    particles.forEach(p => {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1.0;
  }

  /* ===============================
     6. GAME EVENTS
  ================================ */
  function collectHoney(h, index) {
    honeys.splice(index, 1);
    
    let points = 10;
    if(h.gold) points = 50;
    
    if(characters[state.character].bonus) points *= 2;
    if(state.streak > 5) points += 5;

    state.score += points;
    state.streak++;
    
    // UI Update
    document.getElementById('score').innerText = state.score;
    document.getElementById('streak').innerText = state.streak;
    
    // Visuals
    createPopup(h.x, h.y, `+${points}`, h.gold ? '#ffd700' : '#fff');
    createParticles(h.x, h.y, h.gold ? '#ffd700' : '#ffa500');
    playSound(h.gold ? 600 : 400, 'sine');
  }

  function hitBee(index) {
    bees.splice(index, 1);
    state.lives--;
    state.streak = 0;
    
    document.getElementById('lives').innerText = state.lives;
    document.getElementById('streak').innerText = 0;
    
    playSound(150, 'sawtooth');
    createPopup(player.x, player.y - 50, "OUCH!", "#e63946");
    
    // Screen shake visual
    const container = document.querySelector('.game-container');
    container.style.transform = 'translate(5px, 0)';
    setTimeout(() => container.style.transform = 'translate(-5px, 0)', 50);
    setTimeout(() => container.style.transform = 'none', 100);

    if (state.lives <= 0) gameOver();
  }

  function gameOver() {
    state.running = false;
    document.getElementById('final-score').innerText = state.score;
    document.getElementById('gameover-overlay').classList.remove('hidden');
    playSound(100, 'sawtooth', 0.5);
  }

  function createPopup(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'score-popup';
    el.innerText = text;
    el.style.color = color;
    
    // Convert Logical X/Y to CSS % for positioning
    const leftPct = (x / LOGICAL_WIDTH) * 100;
    const topPct = (y / LOGICAL_HEIGHT) * 100;
    
    el.style.left = `${leftPct}%`;
    el.style.top = `${topPct}%`;
    
    document.querySelector('.game-container').appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }
  
  function createParticles(x, y, color) {
    for(let i=0; i<8; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 100,
        vy: (Math.random() - 0.5) * 100,
        life: 1.0,
        size: Math.random() * 4 + 2,
        color: color
      });
    }
  }

  /* ===============================
     7. AUDIO SYSTEM
  ================================ */
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  let soundEnabled = true;

  function playSound(freq, type, duration = 0.1) {
    if (!soundEnabled) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  /* ===============================
     8. UI & BUTTON BINDINGS
  ================================ */
  // Start Game
  document.getElementById('start-btn').onclick = () => {
    document.getElementById('start-overlay').classList.add('hidden');
    state.running = true;
    state.score = 0; state.lives = 3;
    honeys = []; bees = [];
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
    if(audioCtx.state === 'suspended') audioCtx.resume();
  };

  // Restart
  document.getElementById('restart-btn').onclick = () => {
    document.getElementById('gameover-overlay').classList.add('hidden');
    document.getElementById('start-btn').click();
  };

  // Character Selection
  document.getElementById('char-select-btn').onclick = () => {
    document.getElementById('start-overlay').classList.add('hidden');
    document.getElementById('char-overlay').classList.remove('hidden');
  };
  
  document.querySelectorAll('.char-card').forEach(card => {
    card.onclick = () => {
      document.querySelectorAll('.char-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      state.character = card.dataset.char;
    };
  });
  
  document.getElementById('confirm-char-btn').onclick = () => {
    document.getElementById('char-overlay').classList.add('hidden');
    document.getElementById('start-btn').click();
  };
  
  // Weather Toggles
  document.querySelectorAll('.weather-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.weather-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.weather = btn.dataset.w;
      // You can implement particles for weather here later
    };
  });

  // Sound Toggle
  const soundBtn = document.getElementById('sound-btn');
  soundBtn.onclick = () => {
    soundEnabled = !soundEnabled;
    soundBtn.innerHTML = soundEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
    if(soundEnabled && audioCtx.state === 'suspended') audioCtx.resume();
  };

})();
</script>
</body>
</html>
