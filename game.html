<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pooh's Enhanced Honey Hunt - Complete Edition</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#d4a574" />
  <meta name="description" content="Help Pooh catch honey pots in the Hundred Acre Wood! Now with achievements, character selection, weather effects, and more!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka+One&family=Bubblegum+Sans&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    /* Brand palette */
    --pooh-bear:#d4a574; --pooh-light:#e8c9a3; --pooh-red:#e63946;
    --honey-pot:#8b4513; --honey-gold:#ffa500; --honey-shine:#ffd700;
    --wood-brown:#5d4e37; --wood-light:#8b7355;
    --grass-green:#7cb342; --grass-dark:#558b2f;
    --sky-blue:#87ceeb; --sky-light:#b0e0e6;
    --bee-yellow:#ffd700; --bee-black:#1a1a1a;
    --cloud-white:rgba(255,255,255,.95);
    --blossom-pink:#ffb7c5; --blossom-light:#ffd7dd;
    --powerup-blue:#4d96ff; --powerup-purple:#9d4edd;
    --danger-red:#e63946; --success-green:#06d6a0; --warning-orange:#ff9e00;

    /* Surfaces & elevation */
    --ink:#2b2418;
    --paper:rgba(255,248,225,.92);
    --paper-strong:rgba(255,248,225,.97);
    --glass:rgba(255,255,255,.16);
    --stroke:rgba(93,78,55,.85);

    --shadow-soft:0 10px 26px rgba(0,0,0,.14);
    --shadow-strong:0 18px 55px rgba(0,0,0,.28);
    --shadow-inset-light:inset 0 3px 0 rgba(255,255,255,.62);
    --shadow-inset-dark:inset 0 -4px 0 rgba(0,0,0,.10);

    --transition-speed:.22s;
    --radius-xl:28px;
    --radius-lg:22px;
    --radius-md:16px;

    /* Safe area */
    --safe-top:env(safe-area-inset-top, 10px);
    --safe-right:env(safe-area-inset-right, 10px);
    --safe-bottom:env(safe-area-inset-bottom, 10px);
    --safe-left:env(safe-area-inset-left, 10px);

    /* Layout tuning */
    --hud-gap:10px;
    --hud-top:calc(var(--safe-top) + 10px);
    --hud-side:calc(var(--safe-left) + 12px);
    --hud-side-r:calc(var(--safe-right) + 12px);

    --board-max-w:540px;
    --board-min-w:300px;

    /* Reserve space above canvas for HUD */
    --hud-reserve:112px;

    /* Control cluster spacing */
    --controls-bottom:calc(var(--safe-bottom) + 14px);
    --weather-bottom:calc(var(--safe-bottom) + 84px);

    /* Typography */
    --font-body:"Patrick Hand","Comic Sans MS",cursive,system-ui;
    --font-display:"Fredoka One",cursive;
  }

  /* ---------- Motion ---------- */
  @keyframes float{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-10px) rotate(.6deg)}}
  @keyframes cloudDrift{0%{transform:translateX(0)}100%{transform:translateX(110vw)}}
  @keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.05)}}
  @keyframes slideIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes scorePopIn{0%{transform:scale(.35) rotate(-10deg);opacity:0}55%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
  @keyframes twinkle{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
  @keyframes honeyDrip{0%{transform:translateY(0) scaleY(1)}50%{transform:translateY(4px) scaleY(1.15)}100%{transform:translateY(0) scaleY(1)}}
  @keyframes blossomFall{0%{transform:translateY(-50px) rotate(0)}100%{transform:translateY(110vh) rotate(360deg)}}
  @keyframes butterflyFlutter{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(10deg)}}
  @keyframes popupFloat{0%{opacity:1;transform:translate(-50%,0) scale(.6) rotate(-12deg)}45%{transform:translate(-50%,-58px) scale(1.25) rotate(7deg)}100%{opacity:0;transform:translate(-50%,-120px) scale(1) rotate(0)}}
  @keyframes floatWord{0%{opacity:0;transform:translateY(0) scale(.35) rotate(-8deg)}30%{opacity:1;transform:translateY(-34px) scale(1.2) rotate(4deg)}100%{opacity:0;transform:translateY(-94px) scale(.9) rotate(0)}}
  @keyframes fadeOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(-16px)}}

  @keyframes rainFall{0%{transform:translate3d(0,-60px,0) rotate(0deg)}100%{transform:translate3d(0,115vh,0) rotate(360deg)}}
  @keyframes snowFall{0%{transform:translate3d(0,-60px,0) rotate(0)}100%{transform:translate3d(120px,115vh,0) rotate(360deg)}}
  @keyframes leafFall{0%{transform:translate3d(0,-60px,0) rotate(0) scale(1)}50%{transform:translate3d(40px,56vh,0) rotate(180deg) scale(.82)}100%{transform:translate3d(-30px,115vh,0) rotate(360deg) scale(1)}}
  @keyframes petalFall{0%{transform:translate3d(0,-60px,0) rotate(0)}100%{transform:translate3d(60px,115vh,0) rotate(720deg)}}

  /* ---------- Reset / Base ---------- */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;
    background:
      radial-gradient(1200px 600px at 85% 15%, rgba(255,224,138,.55) 0%, rgba(255,224,138,0) 55%),
      linear-gradient(180deg,#0a3d62 0%,#2d7db2 28%,#87ceeb 48%,#b0e0e6 70%,#a8d5a3 86%,#7cb342 100%);
    font-family:var(--font-body);
    color:var(--wood-brown);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    text-rendering:optimizeLegibility;
  }

  /* Better focus for keyboard users */
  :focus{outline:none}
  :focus-visible{
    outline:4px solid rgba(255,165,0,.85);
    outline-offset:3px;
    border-radius:14px;
  }

  main#game-root{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    position:relative;
    z-index:1;
  }

  /* ---------- Background Layer ---------- */
  .background-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .cloud{
    position:absolute;
    background:white;
    border-radius:100px;
    opacity:.82;
    animation:cloudDrift linear infinite;
    filter:drop-shadow(0 10px 22px rgba(0,0,0,.08));
  }
  .cloud::before,.cloud::after{content:"";position:absolute;background:white;border-radius:100px}
  .cloud-1{width:120px;height:50px;top:14%;left:-140px;animation-duration:42s}
  .cloud-1::before{width:60px;height:60px;top:-30px;left:15px}
  .cloud-1::after{width:70px;height:50px;top:-20px;right:15px}
  .cloud-2{width:180px;height:70px;top:30%;left:-200px;animation-duration:64s;animation-delay:10s}
  .cloud-2::before{width:80px;height:80px;top:-40px;left:20px}
  .cloud-2::after{width:90px;height:70px;top:-30px;right:20px}
  .cloud-3{width:140px;height:55px;top:8%;left:-160px;animation-duration:54s;animation-delay:4s}
  .cloud-3::before{width:70px;height:70px;top:-35px;left:18px}
  .cloud-3::after{width:80px;height:55px;top:-22px;right:18px}

  .blossom{
    position:absolute;
    width:12px;height:12px;
    background:linear-gradient(135deg,var(--blossom-pink) 0%,var(--blossom-light) 100%);
    border-radius:50% 50% 50% 0;
    opacity:.65;
    animation:blossomFall linear infinite;
    filter:drop-shadow(0 4px 10px rgba(255,183,197,.18));
  }
  .butterfly{
    position:absolute;
    width:24px;height:16px;
    background:linear-gradient(135deg,#ff6b6b 0%,#ffd93d 100%);
    border-radius:50%;
    opacity:.85;
    animation:butterflyFlutter 3.2s ease-in-out infinite;
    filter:drop-shadow(0 6px 16px rgba(0,0,0,.12));
  }
  .butterfly::before,.butterfly::after{content:"";position:absolute;width:16px;height:24px;background:inherit;border-radius:50%;top:-4px}
  .butterfly::before{left:-8px;transform:rotate(45deg)}
  .butterfly::after{right:-8px;transform:rotate(-45deg)}

  /* ---------- HUD (Top Bar) ---------- */
  .hud{
    position:fixed;
    top:var(--hud-top);
    left:50%;
    transform:translateX(-50%);
    width:min(980px, calc(100vw - 24px - var(--safe-left) - var(--safe-right)));
    z-index:1200;
    pointer-events:none;
  }

  .hud-wrap{
    pointer-events:auto;
    display:grid;
    grid-template-columns: 1fr auto 1fr auto 1fr auto;
    align-items:center;
    gap:12px;
    padding:12px 14px;
    border-radius:999px;
    background:
      radial-gradient(800px 220px at 50% 0%, rgba(255,215,0,.18) 0%, rgba(255,215,0,0) 55%),
      linear-gradient(135deg, rgba(255,248,225,.92) 0%, rgba(255,232,184,.90) 100%);
    border:3px solid rgba(93,78,55,.85);
    box-shadow: var(--shadow-soft), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -3px 0 rgba(0,0,0,.08);
    backdrop-filter: blur(10px);
  }

  .hud-item{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }

  .hud-icon{
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.35rem;
    background:rgba(255,255,255,.55);
    border:2px solid rgba(93,78,55,.45);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.6);
  }

  .hud-meta{min-width:0; line-height:1;}
  .hud-label{
    font-family:"Patrick Hand",cursive;
    font-size:.92rem;
    letter-spacing:.6px;
    color:rgba(43,36,24,.85);
    text-transform:uppercase;
  }
  .hud-value{
    font-family:"Fredoka One",cursive;
    font-size:2.0rem;
    color:var(--pooh-red);
    text-shadow:2px 2px 0 rgba(0,0,0,.12);
    margin-top:2px;
    font-variant-numeric: tabular-nums;
  }

  .hud-score .hud-value{
    color:var(--honey-gold);
    text-shadow: 3px 3px 0 rgba(93,78,55,.35), 0 0 22px rgba(255,165,0,.35);
  }

  .hud-sep{
    width:1px;
    height:44px;
    background:linear-gradient(180deg, rgba(93,78,55,0) 0%, rgba(93,78,55,.28) 40%, rgba(93,78,55,.28) 60%, rgba(93,78,55,0) 100%);
  }

  /* Achievements "pill button" inside HUD */
  .hud-actions{
    grid-column: 6 / 7;
    justify-self:end;
    display:flex;
    align-items:center;
  }

  .hud-ach{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-radius:999px;
    cursor:pointer;
    background:linear-gradient(135deg, rgba(77,150,255,.92) 0%, rgba(42,110,255,.92) 100%);
    border:2px solid rgba(255,255,255,.82);
    box-shadow: 0 10px 22px rgba(0,0,0,.18), inset 0 2px 0 rgba(255,255,255,.25);
    color:white;
    font-family:"Fredoka One",cursive;
    pointer-events:auto;
    transition: transform var(--transition-speed) ease, filter var(--transition-speed) ease;
  }
  .hud-ach:hover{transform:translateY(-2px);filter:saturate(1.05)}
  .hud-ach:active{transform:translateY(1px)}

  .hud-ach-icon{font-size:1.25rem}
  .hud-ach-text{display:flex; flex-direction:column; align-items:flex-start; line-height:1.05}
  .hud-ach-label{
    font-size:.75rem;
    letter-spacing:1.1px;
    text-transform:uppercase;
    opacity:.92;
    font-family:"Patrick Hand",cursive;
  }
  .hud-ach-value{
    font-size:1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .hud-ach-caret{font-size:1.5rem; opacity:.9}

  /* ---------- Canvas Container ---------- */
  .game-container{
    position:relative;
    margin-top:calc(var(--hud-reserve) + var(--safe-top));
    width:clamp(var(--board-min-w), 92vw, var(--board-max-w));
    aspect-ratio:420/700;
    height:auto;
    max-height:calc(100dvh - (var(--hud-reserve) + 170px + var(--safe-top) + var(--safe-bottom)));
    animation:float 6.3s ease-in-out infinite;
    filter:drop-shadow(0 24px 52px rgba(0,0,0,.26)) drop-shadow(0 0 22px rgba(255,215,0,.18));
    transition:filter var(--transition-speed) ease, transform var(--transition-speed) ease;
    z-index:10;
    contain:layout paint style;
    border-radius:var(--radius-xl);
  }
  .game-container::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:calc(var(--radius-xl) + 10px);
    background:radial-gradient(800px 420px at 50% 0%, rgba(255,215,0,.22) 0%, rgba(255,215,0,0) 55%);
    filter:blur(1px);
    z-index:0;
    pointer-events:none;
  }

  #honey-game{
    width:100%;
    height:100%;
    display:block;
    background:linear-gradient(180deg,#0a3d62 0%,#1e6fa8 22%,#87ceeb 42%,#b0e0e6 62%,#a8d5a3 82%,#7cb342 100%);
    border-radius:var(--radius-xl);
    border:7px solid var(--wood-brown);
    box-shadow:
      0 0 0 4px rgba(139,115,85,.75),
      var(--shadow-strong),
      inset 0 -10px 26px rgba(0,0,0,.22),
      inset 0 10px 24px rgba(255,255,255,.12);
    touch-action:none;
    cursor:grab;
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  #honey-game:active{cursor:grabbing}

  /* ---------- Utility ---------- */
  .hidden{display:none!important}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- Honey Cursor ---------- */
  .honey-cursor{
    position:fixed;
    width:46px;height:46px;
    pointer-events:none;
    z-index:9999;
    transform:translate(-50%,-50%);
    transition:transform .08s ease;
    filter:drop-shadow(0 8px 18px rgba(0,0,0,.28));
    display:none;
    mix-blend-mode:multiply;
  }
  .honey-cursor.active{display:block}
  .honey-cursor .spoon{
    width:100%;
    height:100%;
    background:radial-gradient(circle at 30% 30%, #ffd700 0%, #ffa500 62%, #da9100 100%);
    clip-path:polygon(0% 45%, 62% 45%, 62% 30%, 100% 50%, 62% 70%, 62% 55%, 0% 55%);
    transform-origin:60% 50%;
    animation:honeyDrip 2s infinite;
    border-radius:10px;
  }

  /* ---------- Floating UI popups ---------- */
  .score-popup{
    position:absolute;
    font-weight:900;
    font-size:2.2rem;
    color:var(--honey-gold);
    pointer-events:none;
    text-shadow:4px 4px 0 var(--wood-brown), -2px -2px 0 rgba(255,255,255,.9), 0 0 30px rgba(255,165,0,.8);
    animation:popupFloat 1.45s ease-out forwards;
    z-index:100;
    font-family:var(--font-display);
    letter-spacing:1px;
    background:rgba(255,255,255,.06);
    padding:6px 12px;
    border-radius:14px;
    backdrop-filter:blur(6px);
  }
  .honey-word{
    position:absolute;
    font-size:1.55rem;
    font-weight:900;
    color:var(--honey-gold);
    text-shadow:3px 3px 0 var(--wood-brown), -1px -1px 0 rgba(255,255,255,.9), 0 0 22px rgba(255,165,0,.75);
    pointer-events:none;
    animation:floatWord 2.45s ease-out forwards;
    z-index:101;
    font-family:var(--font-body);
    text-align:center;
    padding:8px 14px;
    background:rgba(255,255,255,.12);
    border-radius:14px;
    border:2px solid rgba(255,255,255,.18);
    backdrop-filter:blur(7px);
  }

  /* ---------- Overlays ---------- */
  .character-select-overlay,.achievements-overlay,.overlay{
    position:absolute;
    inset:0;
    background:
      radial-gradient(900px 520px at 50% 0%, rgba(255,215,0,.22) 0%, rgba(255,215,0,0) 55%),
      linear-gradient(135deg, rgba(255,248,225,.97) 0%, rgba(255,232,184,.97) 55%, rgba(255,216,155,.97) 100%);
    backdrop-filter:blur(18px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    text-align:center;
    z-index:5000;
    animation:slideIn .55s ease-out;
    border:10px solid var(--wood-brown);
    box-shadow:
      inset 0 0 90px rgba(212,165,116,.28),
      0 0 70px rgba(0,0,0,.20);
    padding:calc(28px + var(--safe-top)) 28px calc(24px + var(--safe-bottom)) 28px;
    overflow:hidden;
  }

  /* Allow scroll for long overlays without blowing up layout */
  .achievements-overlay{padding:calc(20px + var(--safe-top)) 18px calc(18px + var(--safe-bottom)) 18px}
  .achievements-content{
    background:linear-gradient(135deg, rgba(255,248,225,.985) 0%, rgba(255,232,184,.985) 100%);
    border-radius:24px;
    padding:18px;
    max-width:580px;
    width:min(94vw, 580px);
    max-height:min(78vh, 720px);
    overflow:auto;
    border:7px solid var(--wood-brown);
    box-shadow:0 20px 60px rgba(0,0,0,.42);
    -webkit-overflow-scrolling:touch;
  }
  .achievements-content::-webkit-scrollbar{width:10px}
  .achievements-content::-webkit-scrollbar-thumb{background:rgba(93,78,55,.35);border-radius:10px}

  .overlay h1{
    font-size:3.7rem;
    font-weight:900;
    color:var(--pooh-red);
    text-shadow:5px 5px 0 var(--pooh-bear), 7px 7px 0 var(--wood-brown);
    letter-spacing:1.8px;
    line-height:1.05;
    animation:bounce 3.2s ease-in-out infinite;
    font-family:var(--font-display);
    margin-bottom:6px;
  }
  .overlay h2{
    font-size:2.2rem;
    color:var(--wood-brown);
    font-family:var(--font-display);
    margin-bottom:8px
  }
  .subtitle{
    font-size:1.22rem;
    color:var(--ink);
    text-shadow:1px 1px 0 rgba(255,255,255,.55);
    font-family:var(--font-body);
    max-width:560px;
    line-height:1.35;
    opacity:.92;
  }

  /* ---------- Buttons ---------- */
  .btn{
    background:linear-gradient(135deg,var(--pooh-red) 0%,#c62828 100%);
    border:5px solid var(--wood-brown);
    padding:16px 38px;
    font-size:1.18rem;
    font-weight:900;
    border-radius:60px;
    cursor:pointer;
    box-shadow:0 8px 0 #8b2020, 0 16px 30px rgba(0,0,0,.28), inset 0 4px 0 rgba(255,255,255,.35);
    color:white;
    text-transform:uppercase;
    letter-spacing:1.8px;
    transition:transform var(--transition-speed) ease, filter var(--transition-speed) ease;
    position:relative;
    font-family:var(--font-display);
    text-shadow:2px 2px 0 rgba(0,0,0,.25);
    overflow:hidden;
    min-height:56px;
  }
  .btn:hover{transform:translateY(-3px);filter:saturate(1.05)}
  .btn:active{transform:translateY(1px)}
  .btn-secondary{
    background:linear-gradient(135deg,var(--wood-light) 0%,var(--wood-brown) 100%);
    box-shadow:0 8px 0 #4a3a24, 0 16px 28px rgba(0,0,0,.24), inset 0 4px 0 rgba(255,255,255,.22);
    padding:14px 28px;
    font-size:1.05rem;
    letter-spacing:1.2px;
  }

  .final-score{
    font-size:4.6rem;
    font-weight:900;
    color:var(--honey-gold);
    text-shadow:6px 6px 0 var(--wood-brown), -3px -3px 0 rgba(255,255,255,.95), 0 0 40px rgba(255,165,0,.75);
    animation:bounce 2.4s ease-in-out infinite;
    margin:10px 0;
    font-family:var(--font-display);
  }

  .stats-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    margin:18px 0 10px;
    width:100%;
    max-width:560px
  }
  .stat-box{
    background:rgba(255,255,255,.88);
    border:4px solid var(--wood-brown);
    padding:14px;
    border-radius:18px;
    box-shadow:var(--shadow-soft);
  }
  .stat-box-label{
    font-size:.9rem;
    opacity:.9;
    margin-bottom:6px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--wood-brown);
    font-family:var(--font-body);
  }
  .stat-box-value{
    font-size:2rem;
    font-weight:900;
    color:var(--pooh-red);
    line-height:1;
    font-family:var(--font-display);
  }

  /* ---------- Character Select ---------- */
  .character-select-title{
    font-size:2.25rem;
    font-weight:900;
    color:var(--pooh-red);
    text-shadow:3px 3px 0 var(--pooh-bear);
    font-family:var(--font-display);
  }
  .character-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
    max-width:560px;
    width:100%;
  }
  .character-card{
    background:rgba(255,255,255,.88);
    border:4px solid var(--wood-brown);
    border-radius:20px;
    padding:14px;
    cursor:pointer;
    transition:transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease, border-color var(--transition-speed) ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;

  <script>
(() => {
  "use strict";
  if (window.__POOH_HONEY_HUNT__) return;
  window.__POOH_HONEY_HUNT__ = true;

  /* ================= SAFE STORAGE ================= */
  const Store = (() => {
    const mem=new Map(); let hasLS=false;
    try{localStorage.setItem("__t__","1");localStorage.removeItem("__t__");hasLS=true;}catch{}
    return {
      get:(k,d=null)=>{ if(hasLS){try{return localStorage.getItem(k)??d;}catch{}} return mem.has(k)?mem.get(k):d; },
      set:(k,v)=>{ const s=String(v); if(hasLS){try{localStorage.setItem(k,s);return;}catch{}} mem.set(k,s); }
    };
  })();

  const $ = id => document.getElementById(id);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;

  /* ================= APP STATE ================= */
  const AppState = {
    overlay:"start",
    paused:true,
    score:0,
    streak:0,
    lives:3,
    time:0,
    character:Store.get("character","pooh"),
    difficulty:Store.get("difficulty","normal"),
    soundOn:Store.get("sound","on")==="on",
    power:{ shield:0, slow:0, magnet:0 },
    achievements:JSON.parse(Store.get("achievements","{}")),
    invuln:0
  };

  /* ================= AUDIO ================= */
  const Audio = (() => {
    let ctx=null;
    function init(){
      if(ctx||!AppState.soundOn) return;
      try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch{}
    }
    function beep(freq=440,dur=0.08,type="sine",vol=0.08){
      if(!ctx||!AppState.soundOn) return;
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.value=vol;
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime+dur);
    }
    return {
      init,
      honey:()=>beep(880,0.06,"triangle",0.06),
      hit:()=>beep(120,0.12,"sawtooth",0.08),
      power:()=>beep(520,0.1,"square",0.06),
      gameover:()=>beep(90,0.3,"sine",0.1)
    };
  })();

  /* ================= ACHIEVEMENTS ================= */
  const Achievements = (() => {
    const defs={
      firstHoney:()=>AppState.score>0,
      streak10:()=>AppState.streak>=10,
      survive60:()=>AppState.time>=60000,
      score1k:()=>AppState.score>=1000,
      beeDodger:()=>AppState.time>=30000 && AppState.lives===3
    };
    function check(){
      Object.entries(defs).forEach(([k,f])=>{
        if(!AppState.achievements[k] && f()){
          AppState.achievements[k]=true;
          Store.set("achievements",JSON.stringify(AppState.achievements));
          toast(`🏆 Achievement Unlocked`);
        }
      });
    }
    return {check};
  })();

  /* ================= TOAST ================= */
  function toast(text){
    const d=document.createElement("div");
    d.textContent=text;
    Object.assign(d.style,{
      position:"fixed",top:"20px",left:"50%",transform:"translateX(-50%)",
      background:"rgba(255,215,0,.95)",color:"#5d4e37",
      padding:"10px 16px",borderRadius:"14px",zIndex:9999,
      fontFamily:"Fredoka One,cursive",boxShadow:"0 10px 26px rgba(0,0,0,.25)"
    });
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),1800);
  }

  /* ================= OVERLAYS ================= */
  const Overlays = (() => {
    const map={
      start:$("start-overlay"),
      pause:$("pause-overlay"),
      help:$("help-overlay"),
      gameover:$("gameover-overlay")
    };
    function open(n){
      Object.values(map).forEach(o=>o?.classList.add("hidden"));
      map[n]?.classList.remove("hidden");
      AppState.paused=true;
      document.body.classList.add("overlay-open");
    }
    function close(n){
      map[n]?.classList.add("hidden");
      AppState.paused=false;
      document.body.classList.remove("overlay-open");
    }
    return {open,close};
  })();

  /* ================= UI ================= */
  const UI = (() => {
    function update(){
      $("score").textContent=Math.floor(AppState.score);
      $("streak").textContent=AppState.streak;
      $("lives").textContent=AppState.lives;
    }
    function bind(){
      $("start-btn")?.addEventListener("click",()=>{Audio.init();Overlays.close("start");Game.start();});
      $("pause-btn")?.addEventListener("click",()=>Overlays.open("pause"));
      $("resume-btn")?.addEventListener("click",()=>Overlays.close("pause"));
      $("restart-btn")?.addEventListener("click",()=>{Game.reset();Game.start();});
      $("share-btn")?.addEventListener("click",async()=>{
        const t=`I scored ${Math.floor(AppState.score)} in Pooh’s Honey Hunt 🍯`;
        try{ navigator.share?navigator.share({text:t}):navigator.clipboard.writeText(t); }catch{}
      });
    }
    return {update,bind};
  })();
/* ================= SKINS / THEMES ================= */
const Skins = (() => {
  // You can change this default any time, or set it based on date.
  // Options: "classic", "autumn", "winter", "spring"
  let current = Store.get("skin", "classic");

  const palettes = {
    classic: {
      ink: "rgba(93,78,55,.45)",
      pooh: "#e2b887",
      poohLight: "#f2d4b3",
      shirt: "#e63946",
      honey: "#f5b000",
      honeyLight: "#ffce3a",
      honeyRim: "#c88a00",
      bee: "#ffd400",
      beeStripe: "#222",
      wing: "rgba(255,255,255,.7)",
      ground: "rgba(0,0,0,.06)",
    },
    autumn: {
      ink: "rgba(80,55,30,.50)",
      pooh: "#ddb27f",
      poohLight: "#f0cfa9",
      shirt: "#c1121f",
      honey: "#e3a300",
      honeyLight: "#ffd27a",
      honeyRim: "#a77400",
      bee: "#ffcc00",
      beeStripe: "#1f1f1f",
      wing: "rgba(255,255,255,.65)",
      ground: "rgba(60,35,15,.08)",
    },
    winter: {
      ink: "rgba(40,55,70,.50)",
      pooh: "#e6c49a",
      poohLight: "#f6e1c7",
      shirt: "#b71d2a",
      honey: "#f0b000",
      honeyLight: "#ffe6a6",
      honeyRim: "#b98500",
      bee: "#ffd400",
      beeStripe: "#223",
      wing: "rgba(255,255,255,.75)",
      ground: "rgba(120,150,180,.10)",
    },
    spring: {
      ink: "rgba(55,75,45,.45)",
      pooh: "#e2b887",
      poohLight: "#f3d9bb",
      shirt: "#e63946",
      honey: "#f5b000",
      honeyLight: "#ffe08a",
      honeyRim: "#c88a00",
      bee: "#ffd400",
      beeStripe: "#222",
      wing: "rgba(255,255,255,.72)",
      ground: "rgba(60,120,80,.07)",
    }
  };

  function get() { return palettes[current] || palettes.classic; }
  function set(name) {
    current = palettes[name] ? name : "classic";
    Store.set("skin", current);
  }

  // Optional: auto-season by month (can delete if you want manual control only)
  function autoByDate() {
    const m = new Date().getMonth(); // 0-11
    if ([11,0,1].includes(m)) set("winter");
    else if ([2,3,4].includes(m)) set("spring");
    else if ([8,9,10].includes(m)) set("autumn");
    else set("classic");
  }

  return { get, set, autoByDate };
})();

  /* ================= STORYBOOK ART ================= */
/* ================= STORYBOOK ART (SKINNED) ================= */
const Art = (() => {
  function drawPooh(ctx, x, y, scale = 1, moodT = 0) {
    const P = Skins.get();
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    // Subtle breathing (tiny, cheap)
    const breathe = 1 + Math.sin(moodT) * 0.01;

    // Body
    ctx.fillStyle = P.pooh;
    ctx.beginPath();
    ctx.ellipse(0, 28, 56 * breathe, 52, 0, 0, Math.PI * 2);
    ctx.fill();

    // Belly highlight
    ctx.fillStyle = "rgba(255,255,255,.12)";
    ctx.beginPath();
    ctx.ellipse(-10, 34, 26, 20, -0.25, 0, Math.PI * 2);
    ctx.fill();

    // Head
    ctx.fillStyle = P.pooh;
    ctx.beginPath();
    ctx.ellipse(0, -48, 44, 40, 0, 0, Math.PI * 2);
    ctx.fill();

    // Ears
    ctx.beginPath();
    ctx.ellipse(-30, -88, 14, 14, 0, 0, Math.PI * 2);
    ctx.ellipse(30, -88, 14, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    // Snout
    ctx.fillStyle = P.poohLight;
    ctx.beginPath();
    ctx.ellipse(0, -38, 18, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    // Nose
    ctx.fillStyle = "#5d4e37";
    ctx.beginPath();
    ctx.ellipse(0, -42, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Eyes
    ctx.fillStyle = "#2d2d2d";
    ctx.beginPath();
    ctx.arc(-12, -52, 3, 0, Math.PI * 2);
    ctx.arc(12, -52, 3, 0, Math.PI * 2);
    ctx.fill();

    // Shirt
    ctx.fillStyle = P.shirt;
    ctx.beginPath();
    ctx.ellipse(0, 22, 58, 28, 0, Math.PI, Math.PI * 2);
    ctx.fill();

    // Storybook outline
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(0, 28, 56, 52, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -48, 44, 40, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  function drawHoneyPot(ctx, x, y, r, spinT = 0) {
    const P = Skins.get();
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(spinT) * 0.05);

    // Jar body
    ctx.fillStyle = P.honey;
    ctx.beginPath();
    ctx.moveTo(-r, -r * 0.6);
    ctx.quadraticCurveTo(-r * 1.2, r * 0.8, 0, r);
    ctx.quadraticCurveTo(r * 1.2, r * 0.8, r, -r * 0.6);
    ctx.closePath();
    ctx.fill();

    // Shine
    ctx.fillStyle = "rgba(255,255,255,.32)";
    ctx.beginPath();
    ctx.ellipse(-r * 0.3, -r * 0.15, r * 0.22, r * 0.38, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // Drip
    ctx.fillStyle = P.honeyLight;
    ctx.beginPath();
    ctx.ellipse(r * 0.28, r * 0.92, r * 0.15, r * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Rim + outline
    ctx.strokeStyle = P.honeyRim;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }

  function drawBee(ctx, x, y, r, flapT = 0) {
    const P = Skins.get();
    ctx.save();
    ctx.translate(x, y);

    // Wings
    const flap = Math.sin(flapT) * 0.35;
    ctx.fillStyle = P.wing;
    ctx.beginPath();
    ctx.ellipse(-r * 0.6, -r * 0.6, r * 0.6, r * 0.4, flap, 0, Math.PI * 2);
    ctx.ellipse(r * 0.6, -r * 0.6, r * 0.6, r * 0.4, -flap, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = P.bee;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Stripes
    ctx.fillStyle = P.beeStripe;
    ctx.fillRect(-r * 0.8, -r * 0.22, r * 1.6, r * 0.30);
    ctx.fillRect(-r * 0.8, r * 0.18, r * 1.6, r * 0.30);

    // Head
    ctx.beginPath();
    ctx.arc(-r * 0.9, 0, r * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // Outline
    ctx.strokeStyle = P.ink;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.8, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
  }

  function groundWash(ctx, W, H) {
    const P = Skins.get();
    ctx.fillStyle = P.ground;
    ctx.fillRect(0, H - 140, W, 140);
  }

  return { drawPooh, drawHoneyPot, drawBee, groundWash };
})();


  /* ================= GAME ================= */
  const Game = (() => {
    const canvas=$("honey-game");
    const ctx=canvas.getContext("2d");
    const W=420,H=700;

    let last=0,running=false;
    let px=W/2,tx=W/2;
    const py=H-90;
    let shake=0;

    const honeys=[], bees=[], powers=[];
    let hT=0,bT=0,pT=0;

    const DIFF={
      kid:{h:300,b:1200,bee:0.7},
      normal:{h:360,b:900,bee:1},
      chaos:{h:220,b:600,bee:1.4}
    };

    function reset(){
      Object.assign(AppState,{score:0,streak:0,lives:3,time:0,invuln:0,power:{shield:0,slow:0,magnet:0}});
      honeys.length=bees.length=powers.length=0;
      UI.update();
    }

    function start(){
      AppState.paused=false; running=true;
      last=performance.now();
      requestAnimationFrame(loop);
    }

    function loop(ts){
      if(!running) return;
      const dt=Math.min(32,ts-last); last=ts;
      if(!AppState.paused){ update(dt); render(); }
      requestAnimationFrame(loop);
    }

    function spawnHoney(){ honeys.push({x:Math.random()*(W-40)+20,y:-30,r:18,vy:120,val:10}); }
    function spawnBee(){ bees.push({x:Math.random()*(W-40)+20,y:-40,r:20,vy:160}); }
    function spawnPower(){
      const t=Math.random();
      powers.push({type:t<.33?"shield":t<.66?"slow":"magnet",x:Math.random()*(W-40)+20,y:-30,r:20,vy:120});
    }

    function update(dt){
      AppState.time+=dt;
      AppState.invuln=Math.max(0,AppState.invuln-dt);
      hT+=dt; bT+=dt; pT+=dt;

      const D=DIFF[AppState.difficulty]||DIFF.normal;
      if(hT>D.h){spawnHoney();hT=0;}
      if(bT>D.b){spawnBee();bT=0;}
      if(pT>8000){spawnPower();pT=0;}

      let speed=1,beeMul=D.bee,magR=0,val=1;
      if(AppState.character==="tigger") speed=1.3;
      if(AppState.character==="piglet") beeMul*=0.85;
      if(AppState.character==="pooh") magR=80;
      if(AppState.character==="rabbit") val=1.5;

      Object.keys(AppState.power).forEach(k=>AppState.power[k]=Math.max(0,AppState.power[k]-dt));
      if(AppState.power.slow>0) beeMul*=0.5;

      px=lerp(px,tx,clamp((dt/16)*speed,0.1,0.35));

      honeys.forEach((h,i)=>{
        h.y+=h.vy*(dt/1000);
        if(AppState.power.magnet>0||magR){
          const dx=px-h.x,dy=py-h.y;
          if(dx*dx+dy*dy<(magR+50)**2){h.x+=dx*0.05;h.y+=dy*0.05;}
        }
        if(hit(px,py,48,h.x,h.y,h.r)){
          AppState.score+=h.val*val*(1+AppState.streak*0.1);
          AppState.streak++;
          Audio.honey();
          honeys.splice(i,1); UI.update();
        }
      });

      bees.forEach((b,i)=>{
        b.y+=b.vy*beeMul*(dt/1000);
        if(hit(px,py,48,b.x,b.y,b.r)&&AppState.invuln<=0){
          if(AppState.power.shield>0){AppState.power.shield=0;}
          else{
            AppState.lives--; AppState.streak=Math.max(0,AppState.streak-3);
            AppState.invuln=1200; shake=14; Audio.hit();
            if(AppState.lives<=0){ Audio.gameover(); $("final-score").textContent=Math.floor(AppState.score); Overlays.open("gameover"); }
          }
          bees.splice(i,1); UI.update();
        }
      });

      powers.forEach((p,i)=>{
        p.y+=p.vy*(dt/1000);
        if(hit(px,py,48,p.x,p.y,p.r)){
          AppState.power[p.type]=6000;
          Audio.power();
          powers.splice(i,1);
        }
      });

      Achievements.check();
    }

    function hit(ax,ay,ar,bx,by,br){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy<(ar+br)*(ar+br); }

    function render() {
  ctx.save();

  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.85;
  }

  ctx.clearRect(0, 0, W, H);

  // Ground wash
  ctx.fillStyle = "rgba(0,0,0,.06)";
  ctx.fillRect(0, H - 140, W, 140);

  // Honey
  honeys.forEach(h => {
    Art.drawHoney(ctx, h.x, h.y, h.r);
  });

  // Bees
  bees.forEach(b => {
    b._t = (b._t || 0) + 0.15;
    Art.drawBee(ctx, b.x, b.y, b.r, b._t);
  });

  // Pooh (centerpiece)
  Art.drawPooh(ctx, px, py - 10, 1);

  ctx.restore();
}

    canvas.addEventListener("pointermove",e=>{
      if(AppState.paused) return;
      const r=canvas.getBoundingClientRect();
      tx=clamp((e.clientX-r.left)*(W/r.width),60,W-60);
    });

    return {start,reset};
  })();

  /* ================= BOOT ================= */
  document.addEventListener("DOMContentLoaded",()=>{
    UI.bind();
    UI.update();
    Overlays.open("start");
  Skins.autoByDate(); "

  });
})();
</script>
